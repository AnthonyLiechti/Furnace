async function oppSubmitCreate() {
  var sel        = document.getElementById('oppClientSel');
  var projNameEl = document.getElementById('oppProjName');
  var errEl      = document.getElementById('oppCreateError');
  if (!sel || !projNameEl) return;

  var projName = projNameEl.value.trim();
  if (!projName) { alert('Please enter a project / opportunity name.'); projNameEl.focus(); return; }

  var clientId = '', clientName = '', clientNum = '';

  if (sel.value === '__new__') {
    clientName = ((document.getElementById('oppNewClientName') || {}).value || '').trim();
    clientNum  = ((document.getElementById('oppNewClientNum')  || {}).value || '').trim();
    if (!clientName) { alert('Please enter a client name.'); return; }
  } else if (sel.value) {
    clientId   = sel.value;
    var opt    = sel.options[sel.selectedIndex];
    clientName = opt ? (opt.getAttribute('data-name') || '') : '';
    clientNum  = opt ? (opt.getAttribute('data-num')  || '') : '';
  } else {
    alert('Please select a client.'); return;
  }

  /* Disable button to prevent double-submit */
  var btn = document.querySelector('#oppCreateOverlay button[onclick="oppSubmitCreate()"]');
  if (btn) { btn.disabled = true; btn.textContent = 'Creating…'; }
  if (errEl) errEl.style.display = 'none';

  try {
    /* Create new client if needed */
    if (!clientId) {
      var newCl = await sparkFetch('clients', '', 'POST', { name: clientName, client_number: clientNum });
      if (!newCl || !newCl[0]) throw new Error('Failed to create client record');
      clientId = newCl[0].id;
    }

    /* Unique project code for this opportunity */
    var oppCode = 'OPP_' + Date.now().toString(36).toUpperCase();

    sparkShowSaving();

    /* Create project record */
    var newProj = await sparkFetch('projects', '', 'POST', { name: projName, project_code: oppCode, client_id: clientId });
    if (!newProj || !newProj[0]) throw new Error('Failed to create project record');
    var supaProjectId = newProj[0].id;

    /* Create budget with status = 'opportunity' */
    var isSmallProjChecked = !!(document.getElementById('oppIsSmallProj') || {}).checked;
    var newBudget = await sparkFetch('budgets', '', 'POST', {
      name: projName, project_id: supaProjectId,
      status: 'opportunity', visibility: 'visible',
      client_price: 0, total_amount: 0,
      has_discount: false, discount_percentage: 0,
      reserve_percentage: 5, oop_markup_percentage: 20,
      is_small_project: isSmallProjChecked
    });
    if (!newBudget || !newBudget[0]) throw new Error('Failed to create budget record');
    var budgetId = newBudget[0].id;

    /* Pre-fill all active team members with 0 hours (skip Former Employees) */
    var allTeam = await sparkFetch('team_members', 'select=id,name,department,employment_type&is_active=eq.true&order=name.asc');
    if (allTeam && allTeam.length) {
      var lb = [];
      for (var ti = 0; ti < allTeam.length; ti++) {
        var tm = allTeam[ti];
        if (tm.department === 'Former Employees') continue;
        var dept = tm.department;
        if (dept && dept !== 'Executive/Admin' && dept !== 'Account' && dept !== 'Creative' && dept !== 'Post') dept = null;
        lb.push({ budget_id: budgetId, team_member_id: tm.id, department: dept,
          employment_type: tm.employment_type || 'Employee',
          phase1: 0, phase2: 0, phase3_1: 0, phase3_2: 0, phase4: 0, phase5: 0, display_order: ti });
      }
      await sparkFetch('labor_budget_entries', '', 'POST', lb);
    }

    /* Default OOP entries */
    var oopCats = await sparkFetch('oop_categories', 'select=id,name,section_id&order=display_order.asc');
    if (oopCats && oopCats.length) {
      for (var i = 0; i < oopCats.length; i++) {
        await sparkFetch('oop_budget_entries', '', 'POST', {
          budget_id: budgetId, category_id: oopCats[i].id, section_id: oopCats[i].section_id,
          line_item_name: oopCats[i].name, count: 0, rate: 0, days: 1, head_count: 1,
          is_active: true, display_order: i
        });
      }
    }

    sparkHideSaving();
    var overlay = document.getElementById('oppCreateOverlay');
    if (overlay) overlay.remove();
    navigate('opportunity:' + budgetId);

  } catch(err) {
    sparkHideSaving();
    console.error('oppSubmitCreate error:', err);
    var msg = err && err.message ? err.message : String(err);
    if (errEl) { errEl.textContent = 'Error: ' + msg; errEl.style.display = 'block'; }
    else { alert('Failed to create opportunity: ' + msg); }
    if (btn) { btn.disabled = false; btn.textContent = 'Create Opportunity'; }
  }
}

    + '<div style="font-size:32px;margin-bottom:12px">&#128465;</div>'

    + '<button id="oppDelCancel" style="padding:10px 20px;border-radius:7px;border:1px solid var(--mid-gray);background:transparent;cursor:pointer;font-size:13px;color:var(--mid-gray)">Cancel</button>'
    + '</div></div>';

  document.body.appendChild(overlay);
  overlay.querySelector('#oppDelCancel').onclick = function() { overlay.remove(); };
  overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };

  overlay.querySelector('#oppDelConfirm').onclick = async function() {
    overlay.querySelector('#oppDelConfirm').disabled = true;
    overlay.querySelector('#oppDelConfirm').textContent = 'Deleting…';
    try {
      /* Delete child records first, then budget, then project */
      await sparkFetch('freelancer_budget_entries?budget_id=eq.' + budgetId, '', 'DELETE');
      await sparkFetch('oop_budget_entries?budget_id=eq.' + budgetId, '', 'DELETE');
      await sparkFetch('labor_budget_entries?budget_id=eq.' + budgetId, '', 'DELETE');
      await sparkFetch('budgets?id=eq.' + budgetId, '', 'DELETE');
      if (projectId) await sparkFetch('projects?id=eq.' + projectId, '', 'DELETE');
      overlay.remove();
      navigate('opportunities');
    } catch(err) {
      overlay.remove();
      alert('Delete failed: ' + (err && err.message ? err.message : err));
    }
  };
}

async function oppConvertSubmit(budgetId, projId) {
  var codeEl = document.getElementById('oppConvertCode');
  var errEl  = document.getElementById('oppConvertError');
  var btn    = document.getElementById('oppConvertBtn');
  if (!codeEl) return;

  var code = codeEl.value.trim();
  if (!code) {
    if (errEl) { errEl.textContent = 'Please enter a project number.'; errEl.style.display = 'block'; }
    codeEl.focus();
    return;
  }

  /* Duplicate check — fast local scan */
  var _convCodeUpper = code.toUpperCase();
  var _convDup = false;
  for (var _cci = 0; _cci < (CLIENTS || []).length; _cci++) {
    for (var _cpi = 0; _cpi < CLIENTS[_cci].projects.length; _cpi++) {
      if ((CLIENTS[_cci].projects[_cpi].code || '').toUpperCase() === _convCodeUpper) { _convDup = true; break; }
    }
    if (_convDup) break;
  }
  if (_convDup) {
    if (errEl) { errEl.textContent = 'Project code \u201c' + code + '\u201d is already in use \u2014 please choose a different number.'; errEl.style.display = 'block'; }
    codeEl.focus(); return;
  }
  /* Supabase check for stale local state */
  var _convDbCheck = await sparkFetch('projects', 'project_code=eq.' + encodeURIComponent(code) + '&select=id');
  if (_convDbCheck && _convDbCheck.length > 0) {

async function sparkFetch(table, query, method, body) {
  /* Load config — Electron IPC or browser localStorage fallback */
  if (!sparkConfig) {
    if (window.furnaceAPI && window.furnaceAPI.sparkReadConfig) {
      sparkConfig = await window.furnaceAPI.sparkReadConfig();
    } else {
      /* Browser fallback — use hardcoded config + localStorage token */
      sparkConfig = {
        supabaseUrl: 'https://jnwdscddyqujjikesdpb.supabase.co',
        supabaseAnonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impud2RzY2RkeXF1amppa2VzZHBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyODgxOTEsImV4cCI6MjA4OTg2NDE5MX0.EQueTlfX30ULmpLDF7ijSv0xR0_baAT2kPjYoK_RnpA'
      };
    }
  }
  if (!sparkConfig) return null;
  /* Use the anon key directly as the Bearer token — no login required */
  var url = sparkConfig.supabaseUrl + '/rest/v1/' + table + (query ? '?' + query : '');
  var opts = {
    method: method || 'GET',
    headers: {
      'apikey': sparkConfig.supabaseAnonKey,
      'Authorization': 'Bearer ' + sparkConfig.supabaseAnonKey,
      'Content-Type': 'application/json',
      'Prefer': method === 'PATCH' || method === 'POST' ? 'return=representation' : 'return=minimal',
    },
  };
  if (body) opts.body = JSON.stringify(body);
  try {
    var resp = await fetch(url, opts);
    if (!resp.ok) {
      var errText = await resp.text();
      var errMsg = errText;
      try { var errJson = JSON.parse(errText); errMsg = errJson.message || errJson.details || errText; } catch(e) {}
      console.error('Spark fetch error', resp.status, errText);
      var e = new Error(errMsg);
      e.status = resp.status;
      throw e;
    }
    var text = await resp.text();
    return text ? JSON.parse(text) : true;
  } catch (err) { console.error('Spark fetch exception', err); throw err; }
}

function renderYTD() {
  var mc = document.getElementById('mainContent');
  if (!mc) return;

  /* Effective TCV: client_price after 3.5% discount if has_discount */
  function effTCV(proj) {
    var raw = proj.dollarBudget || 0;
    var sb = proj._supabudget;
    return (sb && sb.has_discount) ? raw * 0.965 : raw;
  }
  function effReserve(proj) {
    var sb = proj._supabudget;
    if (!sb) return effTCV(proj) - (proj.laborCost || 0);
    var _erMkPct = sb.oopMarkupPct != null ? sb.oopMarkupPct : 20;
    var _erOopProjected = (sb.oopTotal || 0) * (1 + _erMkPct / 100);
    var _erProjLaborPrice = Math.max(0, (sb.laborTotal || 0) - (sb.flTotal || 0));
    return effTCV(proj) - _erProjLaborPrice - _erOopProjected - (sb.flTotal || 0);
  }
  /* Budget breakdown bar — matches master dashboard style */
  function lobBar(spentD, laborRemD, oopD, flD, reserveD) {
    var barTotal = spentD + laborRemD + oopD + flD + Math.max(0, reserveD);
    if (barTotal <= 0) return '';
    /* Use exact percentages — CSS handles decimals fine, avoids rounding gaps */
    function seg(val, color, textColor, label, isLast) {
      var p = val / barTotal * 100;
      if (p <= 0) return '';
      var flexStr = isLast ? ';flex:1 0 ' + p.toFixed(2) + '%' : '';
      return '<div class="lob-seg" style="width:' + p.toFixed(2) + '%;background:' + color + (textColor ? ';color:' + textColor : '') + flexStr + '">'
        + (p >= 7 ? label : '') + '</div>';
    }
    /* Build visible segments first so we can mark the last one */
    var segs = [];
    if (spentD > 0)               segs.push([spentD,    'var(--ember)', null,             '$' + Math.round(spentD).toLocaleString()]);
    if (laborRemD > 0)            segs.push([laborRemD, 'var(--ocean)', null,             '$' + Math.round(laborRemD).toLocaleString()]);
    if (flD > 0)                  segs.push([flD,       '#9B8EC2',     null,             '$' + Math.round(flD).toLocaleString()]);
    if (oopD > 0)                 segs.push([oopD,      'var(--sand)', 'var(--abyss)',   '$' + Math.round(oopD).toLocaleString()]);
    if (Math.max(0,reserveD) > 0) segs.push([Math.max(0,reserveD), '#81C784', null,     '$' + Math.round(reserveD).toLocaleString()]);
    var s = '<div class="labor-oop-bar" style="margin-top:14px">';
    s += '<div class="lob-title">Budget Breakdown</div>';
    s += '<div class="lob-bar">';
    for (var _si = 0; _si < segs.length; _si++) {
      var _sg = segs[_si];
      s += seg(_sg[0], _sg[1], _sg[2], _sg[3], _si === segs.length - 1);
    }
    s += '</div>';
    s += '<div class="lob-legend">';
    s += '<div class="lob-legend-item"><div class="lob-legend-dot" style="background:var(--ember)"></div>Labor Spent</div>';
    s += '<div class="lob-legend-item"><div class="lob-legend-dot" style="background:var(--ocean)"></div>Labor Remaining</div>';
    if (flD > 0) s += '<div class="lob-legend-item"><div class="lob-legend-dot" style="background:#9B8EC2"></div>Freelancers</div>';
    s += '<div class="lob-legend-item"><div class="lob-legend-dot" style="background:var(--sand)"></div>Out of Pocket</div>';
    s += '<div class="lob-legend-item"><div class="lob-legend-dot" style="background:#81C784"></div>Profit</div>';
    s += '</div></div>';
    return s;
  }

  /* Filter to 2026; undated POs always included */
  var yearPOs = SUPA_POS.filter(function(p) {
    return !p.date_sent || p.date_sent.slice(0,4) === '2026';
  });

  /* Group by project_code */
  var byProject = {};
  for (var i = 0; i < yearPOs.length; i++) {
    var po = yearPOs[i];
    if (!byProject[po.project_code]) byProject[po.project_code] = [];
    byProject[po.project_code].push(po);
  }

  /* Project lookup from CLIENTS */
  var projByCode = {};
  for (var ci = 0; ci < CLIENTS.length; ci++) {
    for (var pi = 0; pi < CLIENTS[ci].projects.length; pi++) {
      var pr = CLIENTS[ci].projects[pi];
      projByCode[pr.code] = { proj: pr, client: CLIENTS[ci] };
    }
  }

  var projCodesWithPOs = Object.keys(byProject);
  var totalPO = 0;
  for (var i = 0; i < yearPOs.length; i++) totalPO += parseFloat(yearPOs[i].amount) || 0;

  /* Aggregate portfolio financials across matched projects */
  var totalBudget = 0, totalLaborMU = 0, totalSpentD = 0, totalHrsBudget = 0, totalHrsSpent = 0;
  var totalOOPBudget = 0, totalOOPSpent = 0, totalFLBudget = 0, totalFLSpent = 0, totalReserve = 0;
  for (var i = 0; i < projCodesWithPOs.length; i++) {
    var lk = projByCode[projCodesWithPOs[i]];
    if (!lk) continue;
    var p = lk.proj, sb = p._supabudget;
    var pHrs      = p.totalBudget || 0;
    /* Projected Labor Price: Forge team only (FL tracked separately) */
    var pLaborMU  = sb ? Math.max(0, (sb.laborTotal || 0) - (sb.flTotal || 0)) : (p.laborCost || 0);
    var pSpentHrs = filteredProjectSpent(p);
    totalBudget    += effTCV(p);
    totalLaborMU   += pLaborMU;
    totalHrsBudget += pHrs;
    totalHrsSpent  += pSpentHrs;
    totalSpentD    += pSpentHrs * 200; /* always $200/hr */
    totalReserve   += effReserve(p);
    if (sb) {
      var _aggMkPct   = sb.oopMarkupPct != null ? sb.oopMarkupPct : 20;
      totalOOPBudget += (sb.oopTotal || 0) * (1 + _aggMkPct / 100); /* planned × markup */
      totalOOPSpent  += sb.oopSpent  || 0;
      totalFLBudget  += sb.flTotal   || 0;
      totalFLSpent   += sb.flSpent   || 0;
    }
  }

  /* Build client sections + unmatched */
  var clientMap = {}, unmatched = [];
  for (var i = 0; i < projCodesWithPOs.length; i++) {
    var code = projCodesWithPOs[i];
    var lk = projByCode[code];
    if (lk) {
      var cid = lk.client.id;
      if (!clientMap[cid]) clientMap[cid] = { client: lk.client, projects: [] };
      clientMap[cid].projects.push({ proj: lk.proj, pos: byProject[code] });
    } else {

function _poProjectOptions(selectedCode) {
  var opts = '<option value="">— Select project —</option>';
  var sorted = CLIENTS.slice().sort(function(a,b){ return (a.code||'').localeCompare(b.code||''); });
  for (var ci = 0; ci < sorted.length; ci++) {
    var c = sorted[ci];
    var ps = c.projects.slice().sort(function(a,b){ return (a.code||'').localeCompare(b.code||''); });
    if (!ps.length) continue;
    opts += '<optgroup label="' + c.code + ' ' + c.name + '">';
    for (var pi = 0; pi < ps.length; pi++) {
      var p = ps[pi];
      opts += '<option value="' + p.code + '"' + (p.code === selectedCode ? ' selected' : '') + '>' + p.code + ' — ' + p.name + '</option>';
    }
    opts += '</optgroup>';
  }
  return opts;
}

function openEditPOModal(poId) {
  var po = null;
  for (var i = 0; i < SUPA_POS.length; i++) { if (SUPA_POS[i].id === poId) { po = SUPA_POS[i]; break; } }
  if (!po) return;
  openPOModal(po.project_code);
  document.querySelector('#poModalOverlay h2').textContent = 'Edit Purchase Order';
  if (po.po_number) document.getElementById('poPONumber').value = po.po_number;
  if (po.amount)    document.getElementById('poAmount').value   = po.amount;
  if (po.date_sent) document.getElementById('poDateSent').value = po.date_sent;
  if (po.notes)     document.getElementById('poNotes').value    = po.notes;
  var btn = document.getElementById('poSubmitBtn');
  btn.textContent = 'Update PO';
  btn.setAttribute('onclick', 'submitPO(\'' + poId + '\')');
}

async function submitPO(editId) {
  var code   = document.getElementById('poProjectCode').value.trim();
  var amount = parseFloat(document.getElementById('poAmount').value);
  var poNum  = document.getElementById('poPONumber').value.trim();
  var date   = document.getElementById('poDateSent').value;
  var notes  = document.getElementById('poNotes').value.trim();
  var errEl  = document.getElementById('poModalError');
  var btn    = document.getElementById('poSubmitBtn');

  if (!code) { errEl.textContent = 'Select a project.'; errEl.style.display = 'block'; return; }
  if (!amount || isNaN(amount) || amount <= 0) { errEl.textContent = 'Enter a valid amount greater than $0.'; errEl.style.display = 'block'; return; }

  btn.disabled = true; btn.textContent = 'Saving…';
  errEl.style.display = 'none';
  try {
    var payload = { project_code: code, amount: amount };
    if (poNum) payload.po_number = poNum;
    if (date)  payload.date_sent = date;
    if (notes) payload.notes = notes;
    if (editId) {
      await sparkFetch('pos?id=eq.' + editId, '', 'PATCH', payload);
    } else {
      await sparkFetch('pos', '', 'POST', payload);
    }
    await loadPOs();
    document.getElementById('poModalOverlay').remove();
    renderYTD();
  } catch(e) {
    errEl.textContent = 'Error: ' + (e.message || 'Could not save.');
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = editId ? 'Update PO' : 'Save PO';
  }
}

async function settingsSaveSlackToken() {
  var inp = document.getElementById('slackTokenInput');
  var status = document.getElementById('slackTokenStatus');
  if (!inp) return;
  var token = inp.value.trim();
  sparkShowSaving();
  var existing = await sparkFetch('agency_settings', 'key=eq.slack_bot_token&select=id');
  if (existing && existing.length) {
    await sparkFetch('agency_settings?key=eq.slack_bot_token', '', 'PATCH', { value: token });
  } else {
    await sparkFetch('agency_settings', '', 'POST', { category: 'integrations', key: 'slack_bot_token', value: token, sort_order: 1 });
  }
  SLACK_BOT_TOKEN = token;
  sparkHideSaving();
  if (status) { status.textContent = '✓ Saved'; status.style.color = '#81C784'; setTimeout(function(){ if(status) status.textContent=''; }, 2500); }
}

async function slackNotifyNewProject(projName, projCode, tokenOverride) {
  var token = tokenOverride || SLACK_BOT_TOKEN;
  if (!token) return { ok: false, error: 'no_token' };
  /* Route through Vercel serverless proxy — Slack Web API blocks direct browser calls (CORS) */
  try {
    var resp = await fetch('/api/slack-notify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ projName: projName, projCode: projCode, token: token, type: 'new_project' })
    });
    return await resp.json();
  } catch(e) {
    console.error('Slack proxy error:', e);
    return { ok: false, error: e.message || 'proxy_unreachable' };
  }
}

async function slackNotifyProjectFinished(projName, projCode) {
  var token = SLACK_BOT_TOKEN;
  if (!token) return;
  try {
    await fetch('/api/slack-notify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ projName: projName, projCode: projCode, token: token, type: 'project_finished' })
    });
  } catch(e) {
    console.error('Slack finished-notify error:', e);
  }
}

async function updateTeamMemberRate(tmId, field, value) {
  var val = parseFloat(value) || 0;
  await sparkFetch('team_members?id=eq.' + tmId, '', 'PATCH', {[field]: val});
  /* Update local cache */
  for (var i = 0; i < FURNACE_TEAM_MEMBERS.length; i++) {
    if (FURNACE_TEAM_MEMBERS[i].id === tmId) FURNACE_TEAM_MEMBERS[i][field] = val;
  }
  /* If billable_rate changed, cascade to all freelancer_budget_entries for this member */
  if (field === 'billable_rate') {
    await sparkFetch('freelancer_budget_entries?team_member_id=eq.' + tmId, '', 'PATCH', { rate: val });

    /* Update sb._flEntries in every SUPA_BUDGET that has entries for this member,
       then recompute only flTotal/flSpent — do NOT touch laborCostInternal */
    if (SUPA_BUDGETS) {
      for (var bc in SUPA_BUDGETS) {
        var sbCheck = SUPA_BUDGETS[bc];
        if (!sbCheck._flEntries) continue;
        var changed = false;
        for (var fi = 0; fi < sbCheck._flEntries.length; fi++) {
          if (sbCheck._flEntries[fi].team_member_id === tmId) {
            sbCheck._flEntries[fi].rate = val;
            changed = true;
          }
        }
        if (changed) {
          flRecomputeTotals(sbCheck);
        }
      }
    }

    /* Also update sparkCurrentData if a budget snapshot is open (instant feedback) */
    if (sparkCurrentData && sparkCurrentData.freelancerEntries) {
      for (var j = 0; j < sparkCurrentData.freelancerEntries.length; j++) {
        if (sparkCurrentData.freelancerEntries[j].team_member_id === tmId) {
          sparkCurrentData.freelancerEntries[j].rate = val;
        }
      }
      sparkRenderFreelancersContent();
      sparkRenderSummary();
    }

    /* Re-render the financials banner for any project currently visible in the DOM */
    if (CLIENTS) {
      for (var ci = 0; ci < CLIENTS.length; ci++) {
        for (var pi = 0; pi < CLIENTS[ci].projects.length; pi++) {
          var pp = CLIENTS[ci].projects[pi];
          if (pp._supabudget && document.getElementById('projFin-' + pp.code)) {
            renderProjFinancials(pp);
          }
        }
      }
    }
  }
}

function isSmallProjectCode(code) {
  if (!code) return false;
  return (code.indexOf('_10_') >= 0 && code.indexOf('XXX') >= 0) || code === '334_20_01';
}

async function sparkFindBudgetForProject(projectCode) {
  if (!sparkAuth.connected) return null;
  if (!projectCode) return null;

  /* Always fetch the full budget map (it's fast and avoids stale cache issues) */
  var rows = await sparkFetch('budgets', 'select=id,name,status,projects(project_code)&visibility=eq.visible&order=updated_at.desc');
  if (rows && rows.length) {
    sparkBudgetMap = {}; /* clear and rebuild */
    for (var i = 0; i < rows.length; i++) {
      var b = rows[i];
      var code = b.projects && b.projects.project_code ? b.projects.project_code : null;
      if (code) {
        sparkBudgetMap[code] = b.id;
      }
    }
  }
  sparkBudgetMapFetched = true;

  /* Direct match on full code */
  if (sparkBudgetMap[projectCode]) return sparkBudgetMap[projectCode];

  /* Try prefix matching for codes like 320_10_XXX */
  var codeParts = projectCode.split('_');
  if (codeParts.length >= 3) {
    var prefix = codeParts[0] + '_' + codeParts[1];
    for (var key in sparkBudgetMap) {
      if (key && key.indexOf(prefix) === 0) {
        if (key.split('_')[2] === codeParts[2]) return sparkBudgetMap[key];
      }
    }
  }

  return null;
}

async function sparkCreateBudgetForProject(projectCode) {
  var container = document.getElementById('sparkProjectBudget');
  if (!container) return;
  container.innerHTML = '<div style="padding:20px;color:var(--mid-gray)">Creating budget...</div>';

  /* Find the project in portfolio */
  var proj = null;
  for (var i = 0; i < CLIENTS.length; i++) {
    for (var j = 0; j < CLIENTS[i].projects.length; j++) {
      if (CLIENTS[i].projects[j].code === projectCode) {
        proj = CLIENTS[i].projects[j];
        proj._clientName = CLIENTS[i].name;
        proj._clientCode = CLIENTS[i].code;
        break;
      }
    }
    if (proj) break;
  }
  if (!proj) {
    container.innerHTML = '<div style="padding:16px 20px;color:var(--ember);font-size:13px;background:var(--white);border-radius:10px;margin-bottom:20px">Could not find project in portfolio.</div>';
    return;
  }

  try {
    /* 1. Check if a Supabase project record already exists */
    var existingProj = await sparkFetch('projects', 'project_code=eq.' + encodeURIComponent(projectCode) + '&select=id');
    var supaProjectId;
    if (existingProj && existingProj.length > 0) {
      supaProjectId = existingProj[0].id;
    } else {
      /* Check if client exists */
      var existingClient = await sparkFetch('clients', 'client_number=eq.' + encodeURIComponent(proj._clientCode) + '&select=id');
      var clientId;
      if (existingClient && existingClient.length > 0) {
        clientId = existingClient[0].id;
      } else {
        var newClient = await sparkFetch('clients', '', 'POST', {
          name: proj._clientName,
          client_number: proj._clientCode
        });
        if (!newClient || !newClient[0]) throw new Error('Failed to create client');
        clientId = newClient[0].id;
      }
      /* Create project */
      var newProj = await sparkFetch('projects', '', 'POST', {
        name: proj.name,
        project_code: projectCode,
        client_id: clientId
      });
      if (!newProj || !newProj[0]) throw new Error('Failed to create project');
      supaProjectId = newProj[0].id;
    }

    /* 2. Create budget record */
    var newBudget = await sparkFetch('budgets', '', 'POST', {
      name: proj.name,
      project_id: supaProjectId,
      status: 'proposed',
      visibility: 'visible',
      client_price: 0,
      total_amount: 0,
      has_discount: false,
      discount_percentage: 0,
      reserve_percentage: 5,
      oop_markup_percentage: 20
    });
    if (!newBudget || !newBudget[0]) throw new Error('Failed to create budget');
    var budgetId = newBudget[0].id;

    /* 2b. Pre-fill all active team members with 0 hours (skip Former Employees) */
    var allTeam = await sparkFetch('team_members', 'select=id,name,department,employment_type&is_active=eq.true&order=name.asc');
    if (allTeam && allTeam.length) {
      var laborBatch = [];
      for (var ti = 0; ti < allTeam.length; ti++) {
        var tm = allTeam[ti];
        if (tm.department === 'Former Employees') continue;
        var dept = tm.department;
        if (dept && dept !== 'Executive/Admin' && dept !== 'Account' && dept !== 'Creative' && dept !== 'Post') dept = null;
        laborBatch.push({
          budget_id: budgetId, team_member_id: tm.id, department: dept,
          employment_type: tm.employment_type || 'Employee',
          phase1: 0, phase2: 0, phase3_1: 0, phase3_2: 0, phase4: 0, phase5: 0,
          display_order: ti
        });
      }
      await sparkFetch('labor_budget_entries', '', 'POST', laborBatch);
    }

    /* 3. Create default OOP entries from categories template */
    var oopSections = await sparkFetch('oop_sections', 'select=id,slug');
    var oopCats = await sparkFetch('oop_categories', 'select=id,name,section_id&order=display_order.asc');
    if (oopCats && oopCats.length) {
      for (var i = 0; i < oopCats.length; i++) {
        await sparkFetch('oop_budget_entries', '', 'POST', {
          budget_id: budgetId,
          category_id: oopCats[i].id,
          section_id: oopCats[i].section_id,
          line_item_name: oopCats[i].name,
          count: 0,
          rate: 0,
          days: 1,
          head_count: 1,
          is_active: true,
          display_order: i
        });
      }
    }

    /* 4. Update local state so project no longer shows as needs_review */
    sparkBudgetMap[projectCode] = budgetId;
    SUPA_BUDGETS[projectCode] = newBudget[0];
    for (var ci = 0; ci < CLIENTS.length; ci++) {
      for (var pi = 0; pi < CLIENTS[ci].projects.length; pi++) {
        var lp = CLIENTS[ci].projects[pi];
        if (lp.code === projectCode) {
          lp._supabudget = newBudget[0];
          lp.dataSource = 'supabase';
          lp.dollarBudget = 0;
          lp.laborCost = 0;
          lp.oopCost = 0;
          lp.profit = 0;
          lp.totalBudget = 0;
        }
      }
    }
    renderSidebar();

    /* 5. Notify Slack */
    slackNotifyNewProject(proj.name, projectCode);

    /* 6. Reload the budget view */
    await sparkLoadBudgetForProject(projectCode);
  } catch (err) {
    console.error('Failed to create budget:', err);
    container.innerHTML = '<div style="padding:16px 20px;color:var(--ember);font-size:13px;background:var(--white);border-radius:10px;margin-bottom:20px">Failed to create budget: ' + err.message + '</div>';
  }
}

async function sparkLoadBudgetForProject(projectCode) {
  var container = document.getElementById('sparkProjectBudget');
  if (!container) return;

  /* Small projects get a multi-snapshot list view instead of single editor */
  if (isSmallProjectCode(projectCode)) {
    sparkSmallProjProjectCode = null;
    return sparkRenderSmallProjectList(projectCode);
  }

  var budgetId = await sparkFindBudgetForProject(projectCode);
  if (!budgetId) {
    /* Issue 4: Show "Create Budget" button for unbudgeted projects */
    container.innerHTML = '<div style="background:var(--white);border-radius:10px;padding:20px;margin-bottom:20px;text-align:center">'
      + '<div style="font-size:13px;color:var(--mid-gray);margin-bottom:12px">No Furnace budget found for <span style="font-family:monospace">' + projectCode + '</span></div>'
      + '<button onclick="sparkCreateBudgetForProject(\'' + projectCode + '\')" style="padding:8px 20px;border-radius:6px;border:none;background:var(--ocean);color:var(--white);cursor:pointer;font-size:13px;font-weight:600">Create Budget</button>'
      + '</div>';
    return;
  }

  /* Load full budget data */
  sparkSelectedBudget = budgetId; try { if (budgetId) localStorage.setItem("furnace_spark_budget", budgetId); else localStorage.removeItem("furnace_spark_budget"); } catch(e) {}
  var loadingEl = container;
  loadingEl.innerHTML = '<div style="padding:20px;color:var(--mid-gray)">Loading budget data...</div>';

  var results = await Promise.all([
    sparkFetch('budgets', 'id=eq.' + budgetId + '&select=*,projects(id,name,project_code,clients(id,name,client_number))'),
    sparkFetch('labor_budget_entries', 'budget_id=eq.' + budgetId + '&select=*,team_member:team_members(id,name,billable_rate,fully_burdened_rate,department,employment_type)&order=department.asc,display_order.asc'),
    sparkFetch('oop_budget_entries', 'budget_id=eq.' + budgetId + '&select=*,section:oop_sections(id,name,slug),category:oop_categories(id,name)&order=display_order.asc'),
    sparkFetch('oop_sections', 'select=*&order=display_order.asc'),
    sparkFetch('oop_categories', 'select=*&order=display_order.asc'),
    sparkFetch('labor_actuals', 'budget_id=eq.' + budgetId + '&select=*,team_member:team_members(id,name,department,employment_type)&order=work_date.desc'),
    sparkFetch('agency_settings', 'select=*&order=category.asc,sort_order.asc'),
    sparkFetch('freelancer_budget_entries', 'budget_id=eq.' + budgetId + '&select=*,team_member:team_members(id,name,billable_rate,fully_burdened_rate)&order=team_member_id.asc,display_order.asc')
  ]);

  sparkCurrentData = {
    budget: results[0] && results[0][0] ? results[0][0] : null,
    labor: results[1] || [],
    oop: results[2] || [],
    oopSections: results[3] || [],
    oopCategories: results[4] || [],
    actuals: results[5] || [],
    settings: results[6] || [],
    freelancerEntries: results[7] || []
  };

  sparkPhaseTab = 'all';
  sparkOopTab = (sparkCurrentData.oopSections.length && sparkCurrentData.oopSections[0].slug) || 'creative';

  if (!sparkCurrentData.budget) {
    container.innerHTML = '<div style="padding:16px 20px;color:var(--mid-gray);font-size:13px;background:var(--white);border-radius:10px;margin-bottom:20px">Could not load budget data. Showing snapshot data below.</div>';
    return;
  }

  /* Render the budget content into the project page (snapshotSection stays collapsed by default) */
  sparkRenderBudgetContent(true);

  /* Subscribe to real-time changes for this budget so collaborators see live updates */
  sparkSubscribeRealtime(sparkCurrentData.budget.id);
}

async function sparkRenderSmallProjectList(projectCode) {

  }

async function sparkCreateSmallSnapshot(projectCode) {
  var nameEl = document.getElementById('sparkNewSnapName');
  var snapName = nameEl ? nameEl.value.trim() : '';
  if (!snapName) { if (nameEl) nameEl.focus(); return; }

  var container = document.getElementById('sparkProjectBudget');
  if (container) container.innerHTML = '<div style="padding:16px;color:var(--mid-gray);font-size:13px">Creating snapshot\u2026</div>';

  try {
    /* Find or create the Supabase project record */
    var existingProj = await sparkFetch('projects', 'project_code=eq.' + encodeURIComponent(projectCode) + '&select=id');
    var supaProjectId;
    if (existingProj && existingProj.length) {
      supaProjectId = existingProj[0].id;
    } else {
      /* Look up from portfolio for client info */
      var portfolioProj = null;
      for (var ci = 0; ci < CLIENTS.length; ci++) {
        for (var pi = 0; pi < CLIENTS[ci].projects.length; pi++) {
          if (CLIENTS[ci].projects[pi].code === projectCode) {
            portfolioProj = CLIENTS[ci].projects[pi];
            portfolioProj._clientName = CLIENTS[ci].name;
            portfolioProj._clientCode = CLIENTS[ci].code;
            break;
          }
        }
        if (portfolioProj) break;
      }
      if (!portfolioProj) throw new Error('Project not found in portfolio');
      var existingClient = await sparkFetch('clients', 'client_number=eq.' + encodeURIComponent(portfolioProj._clientCode) + '&select=id');
      var clientId = existingClient && existingClient.length ? existingClient[0].id : null;
      if (!clientId) {
        var nc = await sparkFetch('clients', '', 'POST', { name: portfolioProj._clientName, client_number: portfolioProj._clientCode });
        if (!nc || !nc[0]) throw new Error('Failed to create client');
        clientId = nc[0].id;
      }
      var np = await sparkFetch('projects', '', 'POST', { name: portfolioProj.name, project_code: projectCode, client_id: clientId });
      if (!np || !np[0]) throw new Error('Failed to create project');
      supaProjectId = np[0].id;
    }

    /* Create the budget */
    var newBudget = await sparkFetch('budgets', '', 'POST', {
      name: snapName,
      project_id: supaProjectId,
      status: 'proposed',
      visibility: 'visible',
      client_price: 0,
      has_discount: false,
      discount_percentage: 0,
      reserve_percentage: 5,
      oop_markup_percentage: 10,
      no_oop: true,
      no_freelancers: true
    });
    if (!newBudget || !newBudget[0]) throw new Error('Failed to create budget');
    var budgetId = newBudget[0].id;

    /* Pre-fill active team members (skip Former Employees) */
    var allTeam = await sparkFetch('team_members', 'select=id,name,department,employment_type&is_active=eq.true&order=name.asc');
    if (allTeam && allTeam.length) {
      var lb = [];
      for (var ti = 0; ti < allTeam.length; ti++) {
        var tm = allTeam[ti];
        if (tm.department === 'Former Employees') continue;
        lb.push({ budget_id: budgetId, team_member_id: tm.id, department: tm.department,
          employment_type: tm.employment_type || 'Employee',
          phase1: 0, phase2: 0, phase3_1: 0, phase3_2: 0, phase4: 0, phase5: 0, display_order: ti });
      }
      await sparkFetch('labor_budget_entries', '', 'POST', lb);
    }

    /* Reload list */
    await sparkRenderSmallProjectList(projectCode);
  } catch (err) {
    console.error('Failed to create snapshot:', err);
    if (container) container.innerHTML = '<div style="padding:16px;color:var(--ember);font-size:13px;background:var(--white);border-radius:10px">Failed to create snapshot: ' + err.message + '</div>';
  }
}

function addProjAutoComplete(inputEl) {
  var val = inputEl.value;
  /* Trigger only when the user has typed CLIENT_CAMPAIGN_ (trailing underscore = 3 parts, last empty) */
  var parts = val.split('_');
  if (parts.length !== 3 || parts[2] !== '') return;

  var clientCode = parts[0].toUpperCase();
  var campStr    = parts[1];
  var campNum    = parseInt(campStr, 10);
  if (!clientCode || !campStr || isNaN(campNum)) return;

  /* Find the client by code */
  var client = null;
  for (var i = 0; i < (CLIENTS || []).length; i++) {
    if ((CLIENTS[i].code || '').toUpperCase() === clientCode) { client = CLIENTS[i]; break; }
  }
  if (!client) return;

  /* Find max project number for this campaign */
  var maxProj = 0, foundCampaign = false;
  for (var j = 0; j < client.projects.length; j++) {
    var code = (client.projects[j].code || '').toUpperCase();
    if (code.indexOf(clientCode + '_') !== 0) continue;
    var rem = code.slice(clientCode.length + 1);
    var rparts = rem.split('_');
    if (rparts.length < 2) continue;
    if (parseInt(rparts[0], 10) !== campNum) continue;
    var pNum = parseInt(rparts[1], 10);
    if (!isNaN(pNum)) { foundCampaign = true; if (pNum > maxProj) maxProj = pNum; }
  }

  /* Fill the next project number, preserving the user's campaign formatting */
  var nextProj  = foundCampaign ? maxProj + 1 : 1;
  var projPad   = nextProj < 10 ? '0' + nextProj : String(nextProj);
  var newVal    = parts[0] + '_' + campStr + '_' + projPad;
  inputEl.value = newVal;

  /* Select the project-number portion so the user can immediately overwrite it */
  var selStart = newVal.length - projPad.length;
  try { inputEl.setSelectionRange(selStart, newVal.length); } catch(e) {}
}

function addProjUpdateSuggestions(clientId, suggestElId, codeInputId) {
  suggestElId = suggestElId || 'addProjSuggest';
  codeInputId = codeInputId || 'addProjCode';
  var el = document.getElementById(suggestElId);
  if (!el) return;

  var client = clientById(clientId);
  if (!client) { el.innerHTML = ''; return; }

  var clientCode = client.code; /* e.g. "322" */

  /* Parse all project codes for this client into campaign groups */
  var campaigns = {}; /* campaignNum (int) → { max: int, str: string (original padding) } */
  var allProjects = client.projects || [];
  for (var i = 0; i < allProjects.length; i++) {
    var code = (allProjects[i].code || '').toUpperCase();
    /* Must start with client code */
    if (code.indexOf(clientCode + '_') !== 0) continue;
    var remainder = code.slice(clientCode.length + 1); /* e.g. "16_02" or "10_XXX" */
    var parts = remainder.split('_');
    if (parts.length < 2) continue;
    var campStr = parts[0];  /* e.g. "16" */
    var projStr = parts[1];  /* e.g. "02" */
    var campNum = parseInt(campStr, 10);
    var projNum = parseInt(projStr, 10);
    if (isNaN(campNum) || isNaN(projNum)) continue;
    if (!campaigns[campNum] || projNum > campaigns[campNum].max) {
      campaigns[campNum] = { max: projNum, campStr: campStr };
    }
  }

  var campNums = Object.keys(campaigns).map(Number).sort(function(a,b){return a-b;});

  /* Build suggestions */
  var suggestions = [];

  /* Next project within each of the most recent campaigns (up to 4) */
  var recentCamps = campNums.slice(-4).reverse(); /* newest first */
  for (var c = 0; c < recentCamps.length; c++) {
    var cn = recentCamps[c];
    var info = campaigns[cn];
    var nextProjNum = info.max + 1;
    var campPad = info.campStr.length >= 2 ? info.campStr : ('0' + info.campStr).slice(-2);
    var projPad = nextProjNum < 10 ? '0' + nextProjNum : String(nextProjNum);
    suggestions.push({
      code: clientCode + '_' + campPad + '_' + projPad,
      desc: 'Campaign ' + cn + ' — project ' + nextProjNum
    });
  }

  /* New campaign */
  var maxCamp = campNums.length > 0 ? Math.max.apply(null, campNums) : 0;
  var nextCamp = maxCamp + 1;
  var nextCampPad = nextCamp < 10 ? '0' + nextCamp : String(nextCamp);
  suggestions.push({
    code: clientCode + '_' + nextCampPad + '_01',
    desc: 'New campaign ' + nextCamp,
    isNew: true
  });

  /* Render */
  var dk = document.documentElement.classList.contains('dark');
  var pillBase = 'display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600;font-family:monospace;margin:0 4px 4px 0;border:1px solid;white-space:nowrap;transition:all .15s';
  var h = '<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:' + (dk?'#666':'#aaa') + ';margin-bottom:5px">&#128161; Suggested codes</div>';
  h += '<div style="display:flex;flex-wrap:wrap">';
  for (var s = 0; s < suggestions.length; s++) {
    var sg = suggestions[s];
    var isNew = sg.isNew;
    var pillColor = isNew
      ? (dk ? 'rgba(91,74,138,.35)' : 'rgba(91,74,138,.1)')
      : (dk ? 'rgba(0,150,136,.2)'  : 'rgba(0,150,136,.08)');
    var pillBorder = isNew
      ? (dk ? 'rgba(91,74,138,.5)'  : 'rgba(91,74,138,.3)')
      : (dk ? 'rgba(0,150,136,.4)'  : 'rgba(0,150,136,.35)');
    var pillTextC = isNew ? (dk ? '#C5B8F0' : '#5B4A8A') : (dk ? '#4DB6AC' : '#00796B');
    h += '<span style="' + pillBase + ';background:' + pillColor + ';border-color:' + pillBorder + ';color:' + pillTextC + '"'
      + ' onclick="document.getElementById(\'' + codeInputId + '\').value=\'' + sg.code + '\';document.getElementById(\'' + codeInputId + '\').focus()"'
      + ' title="' + sg.desc + '">'
      + sg.code
      + '<span style="font-family:sans-serif;font-size:9px;font-weight:400;opacity:.75">' + (isNew ? '★ new' : '#' + (s+1)) + '</span>'
      + '</span>';
  }
  h += '</div>';
  el.innerHTML = h;
}

function hideAddProjectForm() {
  var overlay = document.getElementById('addProjectOverlay');

async function createNewProject() {
  var clientEl = document.getElementById('addProjClientSelect');
  var nameEl = document.getElementById('addProjName');
  var codeEl = document.getElementById('addProjCode');
  var errEl = document.getElementById('addProjError');

  var clientId = clientEl ? clientEl.value : '';
  var name = nameEl ? nameEl.value.trim() : '';
  var code = codeEl ? codeEl.value.trim().toUpperCase() : '';

  function showErr(msg) {
    if (errEl) { errEl.textContent = msg; errEl.style.display = 'block'; }
  }
  if (!clientId) { showErr('Please select a client.'); return; }
  if (!name) { showErr('Project name is required.'); if (nameEl) nameEl.focus(); return; }
  if (!code) { showErr('Project code is required.'); if (codeEl) codeEl.focus(); return; }

  /* Duplicate check — fast local scan first */
  var _codeUpper = code.toUpperCase();
  var _dupFound = false;
  for (var _ci = 0; _ci < (CLIENTS || []).length; _ci++) {
    for (var _pi = 0; _pi < CLIENTS[_ci].projects.length; _pi++) {
      if ((CLIENTS[_ci].projects[_pi].code || '').toUpperCase() === _codeUpper) { _dupFound = true; break; }
    }
    if (_dupFound) break;
  }
  if (_dupFound) { showErr('Project code \u201c' + code + '\u201d is already in use \u2014 please choose a different one.'); if (codeEl) codeEl.focus(); return; }

  /* Also hit Supabase in case local state is stale */
  var _dbCheck = await sparkFetch('projects', 'project_code=eq.' + encodeURIComponent(code) + '&select=id');
  if (_dbCheck && _dbCheck.length > 0) { showErr('Project code \u201c' + code + '\u201d is already in use \u2014 please choose a different one.'); if (codeEl) codeEl.focus(); return; }

  /* Disable button during creation */
  var btn = document.querySelector('#addProjectOverlay button');
  if (btn) { btn.textContent = 'Creating\u2026'; btn.disabled = true; }
  if (errEl) errEl.style.display = 'none';

  try {
    /* 1. Create project in Supabase */
    var newProj = await sparkFetch('projects', '', 'POST', {
      name: name,
      project_code: code,
      client_id: clientId
    });
    if (!newProj || !newProj[0]) throw new Error('No record returned — the project code may already be in use.');
    var projId = newProj[0].id;

    /* 2. Create initial budget */
    var newBudget = await sparkFetch('budgets', '', 'POST', {
      project_id: projId,
      name: 'Initial Snapshot',
      status: 'proposed',
      visibility: 'visible',
      client_price: 0,
      has_discount: false,
      discount_percentage: 0,
      reserve_percentage: 5,
      oop_markup_percentage: 10,
      no_oop: false,
      no_freelancers: false
    });

    /* 2b. Pre-fill all active team members with 0 hours across all phases */
    if (newBudget && newBudget[0]) {
      var budgetId = newBudget[0].id;
      var allTeam = await sparkFetch('team_members', 'select=id,department,employment_type&is_active=eq.true&order=name.asc');
      if (allTeam && allTeam.length) {
        var laborBatch = [];
        for (var ti = 0; ti < allTeam.length; ti++) {
          var tm = allTeam[ti];
          var dept = tm.department;
          if (dept && dept !== 'Executive/Admin' && dept !== 'Account' && dept !== 'Creative' && dept !== 'Post') dept = null;
          laborBatch.push({
            budget_id: budgetId, team_member_id: tm.id, department: dept,
            employment_type: tm.employment_type || 'Employee',
            phase1: 0, phase2: 0, phase3_1: 0, phase3_2: 0, phase4: 0, phase5: 0,
            display_order: ti
          });
        }
        await sparkFetch('labor_budget_entries', '', 'POST', laborBatch);
      }
    }

    /* 3. Update CLIENTS local state */
    for (var ci = 0; ci < CLIENTS.length; ci++) {
      if (CLIENTS[ci].id === clientId) {
        CLIENTS[ci].projects.push({
          id: projId,
          name: name,
          code: code,
          status: 'active',
          budget: 0, spent: 0,
          laborCost: 0, oopCost: 0, profit: 0, clientPrice: 0
        });
        break;
      }
    }

    /* 4. Add to ALLOCATIONS.forecastProjects so it appears in resource planner */
    if (ALLOCATIONS && ALLOCATIONS.forecastProjects) {
      if (ALLOCATIONS.forecastProjects.indexOf(name) < 0) {
        ALLOCATIONS.forecastProjects.push(name);
        ALLOCATIONS.forecastProjects.sort();
      }
    }

    /* 5. Bust cache */
    try { localStorage.removeItem('furnace_supa_v4'); } catch(e) {}

    /* 6. Navigate to new project page */
    hideAddProjectForm();
    navigate('project:' + code);

  } catch(err) {
    console.error('createNewProject error:', err);
    var msg = err.message || 'Unknown error';
    if (msg.indexOf('idx_projects_code') >= 0 || msg.indexOf('unique') >= 0 || msg.indexOf('duplicate key') >= 0) {
      msg = 'That project code is already in use — please choose a different one.';
      if (codeEl) codeEl.focus();
    }
    showErr(msg);
    if (btn) { btn.textContent = 'Create Project'; btn.disabled = false; }
  }
}

/* ── REAL-TIME COLLABORATION ── */
var _sparkRealtimeChannel = null;
var _sparkRealtimeBudgetId = null;

function sparkSubscribeRealtime(budgetId) {
  if (!budgetId || !_furnaceAuthClient) return;
  /* Unsubscribe from any previous budget channel */
  if (_sparkRealtimeChannel) {
    _furnaceAuthClient.removeChannel(_sparkRealtimeChannel);
    _sparkRealtimeChannel = null;
  }
  _sparkRealtimeBudgetId = budgetId;

  _sparkRealtimeChannel = _furnaceAuthClient
    .channel('budget-live-' + budgetId)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'labor_budget_entries',       filter: 'budget_id=eq.' + budgetId }, function(payload) { sparkHandleRealtimeChange('labor', payload); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'oop_budget_entries',         filter: 'budget_id=eq.' + budgetId }, function(payload) { sparkHandleRealtimeChange('oop', payload); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'freelancer_budget_entries',  filter: 'budget_id=eq.' + budgetId }, function(payload) { sparkHandleRealtimeChange('fl', payload); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'budgets',                   filter: 'id=eq.' + budgetId },        function(payload) { sparkHandleRealtimeChange('budget', payload); })
    .subscribe(function(status) {
      var dot = document.getElementById('sparkLiveDot');
      if (dot) dot.style.display = status === 'SUBSCRIBED' ? 'inline-block' : 'none';
    });
}

function sparkHandleRealtimeChange(type, payload) {
  if (!sparkCurrentData) return;
  var rec = payload.new || payload.old;
  if (!rec) return;

  /* Skip if this entry has a pending local save — our own change, already applied */
  var pendingKey = type + '-' + rec.id + '-';
  for (var k in sparkSaveTimers) {
    if (k.indexOf(rec.id) !== -1) return;
  }

  /* Show a brief "live update" flash */
  sparkFlashLiveUpdate();

  if (type === 'labor') {
    if (payload.eventType === 'DELETE') {
      sparkCurrentData.labor = sparkCurrentData.labor.filter(function(e) { return e.id !== rec.id; });
    } else {
      var found = false;
      for (var i = 0; i < sparkCurrentData.labor.length; i++) {
        if (sparkCurrentData.labor[i].id === rec.id) {
          /* Preserve the joined team_member object, merge scalar fields */
          var tm = sparkCurrentData.labor[i].team_member;
          sparkCurrentData.labor[i] = rec;
          sparkCurrentData.labor[i].team_member = tm;
          found = true; break;
        }
      }
      if (!found && payload.eventType === 'INSERT') sparkCurrentData.labor.push(rec);
    }
    sparkRenderLaborContent();
    sparkRenderSummary();

  } else if (type === 'oop') {
    if (payload.eventType === 'DELETE') {
      sparkCurrentData.oop = sparkCurrentData.oop.filter(function(e) { return e.id !== rec.id; });
    } else {
      var found = false;
      for (var i = 0; i < sparkCurrentData.oop.length; i++) {
        if (sparkCurrentData.oop[i].id === rec.id) {
          var sec = sparkCurrentData.oop[i].section;
          var cat = sparkCurrentData.oop[i].category;
          sparkCurrentData.oop[i] = rec;
          sparkCurrentData.oop[i].section = sec;
          sparkCurrentData.oop[i].category = cat;
          found = true; break;
        }
      }
      if (!found && payload.eventType === 'INSERT') sparkCurrentData.oop.push(rec);
    }
    sparkRenderOopContent();
    sparkRenderSummary();

  } else if (type === 'fl') {
    if (payload.eventType === 'DELETE') {
      sparkCurrentData.freelancerEntries = (sparkCurrentData.freelancerEntries || []).filter(function(e) { return e.id !== rec.id; });
    } else {
      var found = false;
      var fes = sparkCurrentData.freelancerEntries || [];
      for (var i = 0; i < fes.length; i++) {
        if (fes[i].id === rec.id) {
          var tm2 = fes[i].team_member;
          fes[i] = rec;
          fes[i].team_member = tm2;
          found = true; break;
        }
      }
      if (!found && payload.eventType === 'INSERT') fes.push(rec);
      sparkCurrentData.freelancerEntries = fes;
    }
    sparkRenderFreelancersContent();
    sparkRenderSummary();

  } else if (type === 'budget') {
    /* Client price, toggles, etc. changed */
    Object.assign(sparkCurrentData.budget, rec);
    sparkRenderBudgetContent(true);
  }
}

function sparkFmt(n) {
  if (n == null || isNaN(n)) return '$0';
  return '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:0});
}

function sparkFmtDec(n) {
  if (n == null || isNaN(n)) return '$0.00';
  return '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function sparkGetRate(entry) {
  /* Flat $200/hr agency rate for all labor, always */
  return 200;
}

function sparkGetInternalRate(entry) {
  /* Flat $200/hr — same as client rate, no internal distinction */
  return 200;
}

function sparkEntryHours(entry, phaseKey) {
  if (phaseKey === 'all') {
    var total = 0;
    for (var i = 0; i < SPARK_PHASES.length; i++) {
      total += (entry[SPARK_PHASES[i].key] || 0);
    }
    return total;
  }
  return entry[phaseKey] || 0;
}

function sparkEntryTotal(entry) {
  var rate = sparkGetRate(entry);
  var hrs = 0;
  for (var i = 0; i < SPARK_PHASES.length; i++) {
    hrs += (entry[SPARK_PHASES[i].key] || 0);
  }
  return hrs * rate;
}

function sparkSettingVal(settings, category, key, fallback) {
  for (var i = 0; i < settings.length; i++) {
    if (settings[i].category === category && settings[i].key === key) return parseFloat(settings[i].value) || fallback;
  }
  return fallback;
}

/* Returns the OOP budget value for display/profit — effective amounts with markup applied.
   Falls back to oopEffective × 1.20 when oopEffectiveWithMarkup hasn't been stored yet. */
function sbOopBudget(sb) {
  if (!sb) return 0;
  if (sb.oopEffectiveWithMarkup != null) return sb.oopEffectiveWithMarkup;
  return (sb.oopEffective || sb.oopTotal || 0) * 1.20;
}

function sparkOopItemTotal(item) {
  /* Planned total (always from planned fields) */
  var rate = item.rate || item.rate_override || item.vendor_rate || 0;
  return (item.count || 0) * rate * (item.days || 1) * (item.head_count || 1);
}

function sparkOopItemEffective(item) {
  /* Cascade: Actual Amount → Actual Fields → Adjusted Fields → Planned */
  if (item.actual_amount != null) return item.actual_amount;
  /* Any actual field triggers actual tier */
  if (item.actual_count != null || item.actual_rate != null || item.actual_days != null || item.actual_head_count != null) {
    return (item.actual_count != null ? item.actual_count : (item.adjusted_count != null ? item.adjusted_count : (item.count||0)))
         * (item.actual_rate != null ? item.actual_rate : (item.adjusted_rate != null ? item.adjusted_rate : (item.rate||0)))
         * (item.actual_days != null ? item.actual_days : (item.adjusted_days != null ? item.adjusted_days : (item.days||1)))
         * (item.actual_head_count != null ? item.actual_head_count : (item.adjusted_head_count != null ? item.adjusted_head_count : (item.head_count||1)));
  }
  /* Any adjusted field triggers adjusted tier */
  if (item.adjusted_count != null || item.adjusted_rate != null || item.adjusted_days != null || item.adjusted_head_count != null) {
    return (item.adjusted_count != null ? item.adjusted_count : (item.count||0))
         * (item.adjusted_rate != null ? item.adjusted_rate : (item.rate||0))
         * (item.adjusted_days != null ? item.adjusted_days : (item.days||1))
         * (item.adjusted_head_count != null ? item.adjusted_head_count : (item.head_count||1));
  }
  return sparkOopItemTotal(item);
}

function sparkOopItemSpent(item) {
  /* Only counts if Paid is checked */
  if (!item.paid) return 0;
  return sparkOopItemEffective(item);
}

/* Compute total OOP cost with per-section markup applied.
   Falls back to the global oop_markup_percentage from agency_settings when
   a section doesn't have an override in budget.oop_section_markups. */
function sparkComputeOopWithSectionMarkup(data) {
  var entries  = (data && data.oop) || [];
  var settings = (data && data.settings) || [];
  var budget   = (data && data.budget) || {};
  var globalPct = sparkSettingVal(settings, 'markup', 'oop_markup_percentage', 20);
  var sectionMarkups = budget.oop_section_markups || {};

  /* Group active entries by section */
  var bySec = {};
  for (var i = 0; i < entries.length; i++) {
    var e = entries[i];
    if (e.is_active === false) continue;
    var sid = e.section_id || (e.section ? e.section.id : '__none__');
    if (!bySec[sid]) bySec[sid] = 0;
    bySec[sid] += sparkOopItemEffective(e);
  }

  var total = 0;
  for (var sid in bySec) {
    var subtotal = bySec[sid];
    var pct = (sectionMarkups[sid] != null) ? parseFloat(sectionMarkups[sid]) : globalPct;
    total += subtotal * (1 + pct / 100);
  }
  return total;
}

async function sparkSetSectionMarkup(secId, pct) {
  var budget = sparkCurrentData && sparkCurrentData.budget;
  if (!budget) return;
  var updated = {};
  var existing = budget.oop_section_markups || {};
  for (var k in existing) updated[k] = existing[k];
  updated[secId] = parseFloat(pct) || 0;
  budget.oop_section_markups = updated;
  sparkShowSaving();
  await sparkFetch('budgets?id=eq.' + budget.id, '', 'PATCH', { oop_section_markups: updated });
  sparkHideSaving();
  sparkRenderOopPanel();
  sparkComputeSummary();
}

function sparkRecomputeBudgetTotals() {
  /* Recompute SUPA_BUDGETS totals from sparkCurrentData and update the project financials */
  if (!sparkCurrentData || !sparkCurrentData.budget) return;
  var b = sparkCurrentData.budget;
  var projCode = (b.projects && b.projects.project_code) ? b.projects.project_code : PROJ_CODE_MAP[b.project_id];
  if (!projCode || !SUPA_BUDGETS || !SUPA_BUDGETS[projCode]) return;
  var sb = SUPA_BUDGETS[projCode];

  /* Recompute labor */
  var laborHours = 0, laborCost = 0, laborInternal = 0;

  sb.oopSpent     = oopSpent;

  if (CLIENTS) {

async function sparkShowAddTeamMember() {
  /* Fetch available team members from Supabase — exclude Freelancers (they have their own section) */
  var allMembers = await sparkFetch('team_members', 'select=id,name,department,employment_type,billable_rate&is_active=eq.true&order=name.asc');
  if (!allMembers || !allMembers.length) { alert('No team members found in Supabase.'); return; }

  /* Filter out members already in this budget and exclude Freelancers */
  var existingIds = {};
  if (sparkCurrentData && sparkCurrentData.labor) {

  if (!available.length) { alert('All active team members are already assigned.'); return; }

  /* Build a simple dropdown modal */
  var overlay = document.createElement('div');
  overlay.id = 'sparkAddMemberOverlay';
  overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center';

  var h = '<div style="font-size:16px;font-weight:700;margin-bottom:16px">Add Team Member</div>';
  h += '<div style="font-size:12px;color:var(--mid-gray);margin-bottom:12px">Select team members to add to this budget:</div>';

  for (var i = 0; i < available.length; i++) {
    var m = available[i];
    var dept = m.department || 'Other';
    var type = m.employment_type === 'Freelancer' ? ' (FL)' : m.employment_type === 'Contractor' ? ' (C)' : '';
    h += '<label style="display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;font-size:13px">';

    h += m.name + type + ' <span style="font-size:10px;color:var(--mid-gray)">' + dept + '</span>';

  }

  h += '<div style="display:flex;gap:8px;margin-top:16px">';
  h += '<button onclick="sparkAddSelectedMembers()" style="padding:8px 20px;border-radius:6px;border:none;background:var(--ocean);color:var(--white);cursor:pointer;font-size:13px;font-weight:600;flex:1">Add Selected</button>';

  h += '</div>';

  modal.innerHTML = h;
  overlay.appendChild(modal);
  overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
  document.body.appendChild(overlay);

  var checkboxes = overlay.querySelectorAll('input[type="checkbox"]:checked');

/* Recompute flTotal / flSpent on a cached SUPA_BUDGETS object.
   Budget sentinel entries (week_label === '__budget__') define the budget (flTotal).
   flSpent is always the sum of paid day-by-day entries (ISO date week_labels).
   If no sentinel exists, falls back to summing all entries for flTotal (old behaviour). */
function flRecomputeTotals(sb) {
  var entries = sb._flEntries || [];
  var hasSentinel = false;
  for (var _i = 0; _i < entries.length; _i++) {
    if (entries[_i].week_label === '__budget__') { hasSentinel = true; break; }
  }
  var flTot = 0, flSp = 0;
  for (var _i = 0; _i < entries.length; _i++) {
    var _fe = entries[_i];
    var _cost = (_fe.hours || 0) * (_fe.rate || 0);
    if (_fe.week_label === '__budget__') {
      flTot += _cost; /* sentinel defines the budget total only */
    } else {

    });
    if (result && result.length) {
      result[0].team_member = { id: tmId, name: mName };
      if (!sparkCurrentData.freelancerEntries) sparkCurrentData.freelancerEntries = [];
      sparkCurrentData.freelancerEntries.push(result[0]);
    }
  }
  sparkHideSaving();
  overlay.remove();
  sparkRenderFreelancersContent();
  sparkRenderSummary();
}

function sparkToggleOopSection(sectionId) {
  sparkOopSectionExpanded[sectionId] = !sparkOopSectionExpanded[sectionId];
  sparkRenderOopContent();
}

function sparkToggleOopCategory(catId) {
  sparkOopCategoryExpanded[catId] = !sparkOopCategoryExpanded[catId];
  sparkRenderOopContent();
}

function sparkOopGridClass(slug) {
  if (slug === 'talent') return 'spark-oop-grid-talent';
  if (slug === 'travel-meals') return 'spark-oop-grid-travel';
  return 'spark-oop-grid-std';
}

function sparkOopColHeaders(slug) {
  var hasDays  = (slug === 'talent' || slug === 'travel-meals');
  var hasHead  = (slug === 'travel-meals');
  /* Per-tier column count: Count + Rate [+ Days] [+ Head] + Total */
  var planCols = 2 + (hasDays ? 1 : 0) + (hasHead ? 1 : 0) + 1;
  var adjCols  = planCols;
  var actCols  = planCols + 1; /* +Paid */
  /* Width of each tier group = numCols×56px + (numCols-1)×2px (gap between cols) */
  function tw(n) { return 'calc(' + n + '*56px + ' + (n-1) + '*2px)'; }

  var h = '<div class="spark-oop-tier-hdr">';
  h += '<div></div>'; /* Line Item spacer — flex:1.4 from CSS */
  h += '<div class="oop-tier-group planned" style="width:' + tw(planCols) + '">PLANNED</div>';
  h += '<div class="oop-tier-group adjusted" style="width:' + tw(adjCols)  + '">ADJUSTED</div>';
  h += '<div class="oop-tier-group actual"   style="width:' + tw(actCols)  + '">ACTUAL</div>';
  h += '<div></div>'; /* Notes spacer — flex:1 from CSS */
  h += '</div>';

  h += '<div class="spark-oop-col-hdr-3tier">';
  h += '<div>Line Item</div>';
  /* Planned — ocean blue */
  h += '<div class="num pln">Count</div><div class="num pln">Rate</div>';
  if (hasDays) h += '<div class="num pln">Days</div>';
  if (hasHead) h += '<div class="num pln">Head</div>';
  h += '<div class="num pln">Total</div>';
  /* Adjusted — amber */
  h += '<div class="num adj">Count</div><div class="num adj">Rate</div>';
  if (hasDays) h += '<div class="num adj">Days</div>';
  if (hasHead) h += '<div class="num adj">Head</div>';
  h += '<div class="num adj">Total</div>';
  /* Actual — green */
  h += '<div class="num act">Count</div><div class="num act">Rate</div>';
  if (hasDays) h += '<div class="num act">Days</div>';
  if (hasHead) h += '<div class="num act">Head</div>';
  h += '<div class="num act">Total</div>';
  h += '<div class="num act">Paid</div>';
  h += '<div>Notes</div>';
  h += '</div>';
  return h;
}

function sparkRenderOopContent() {
  var el = document.getElementById('sparkOopContent');
  if (!el || !sparkCurrentData) return;
  var data = sparkCurrentData;
  var sections = data.oopSections;
  var allCategories = data.oopCategories || [];
  var entries = data.oop;
  var settings = data.settings;
  var markupPct = sparkSettingVal(settings, 'markup', 'oop_markup_percentage', 20);
  var sectionMarkups = (data.budget && data.budget.oop_section_markups) || {};

  if (!sections.length) { el.innerHTML = '<p style="color:var(--mid-gray)">No OOP sections found.</p>'; return; }

  /* Build lookup: sectionId -> categories */
  var catsBySec = {};
  for (var i = 0; i < allCategories.length; i++) {
    var cat = allCategories[i];
    var sid = cat.section_id;
    if (!catsBySec[sid]) catsBySec[sid] = [];
    catsBySec[sid].push(cat);
  }

  /* Build lookup: categoryId -> entries */
  var entriesByCat = {};
  /* Also build lookup: sectionId -> uncategorized entries (have section but no category) */
  var uncatBySection = {};
  for (var i = 0; i < entries.length; i++) {
    var e = entries[i];
    var cid = e.category_id || (e.category ? e.category.id : null);
    var sid = e.section_id || (e.section ? e.section.id : null);
    if (cid) {
      if (!entriesByCat[cid]) entriesByCat[cid] = [];
      entriesByCat[cid].push(e);
    } else if (sid) {
      /* Has section but no category — will be shown as flat list under the section */
      if (!uncatBySection[sid]) uncatBySection[sid] = [];
      uncatBySection[sid].push(e);
    }
    /* else: no section OR category — truly orphaned, skip */
  }

  var grandTotal = 0, grandSubtotal = 0;
  var h = '';

  for (var s = 0; s < sections.length; s++) {
    var sec = sections[s];
    var secId = sec.id;
    var slug = sec.slug || '';
    var secMarkupPct = (sectionMarkups[secId] != null) ? parseFloat(sectionMarkups[secId]) : markupPct;
    var secExpanded = sparkOopSectionExpanded[secId] !== false; /* default open */
    var secCats = catsBySec[secId] || [];
    var gc = sparkOopGridClass(slug);

    /* Compute section totals (including uncategorized entries for this section) */
    /* sectionSubtotal = effective amounts (actual_amount → adjusted → planned cascade)  */
    var sectionSubtotal = 0;
    var activeItems = 0;
    for (var c = 0; c < secCats.length; c++) {
      var catEntries = entriesByCat[secCats[c].id] || [];
      for (var e = 0; e < catEntries.length; e++) {
        if (catEntries[e].is_active !== false) {
          sectionSubtotal += sparkOopItemEffective(catEntries[e]);
          activeItems++;
        }
      }
    }
    var uncatItems = uncatBySection[secId] || [];
    for (var u = 0; u < uncatItems.length; u++) {
      if (uncatItems[u].is_active !== false) {
        sectionSubtotal += sparkOopItemEffective(uncatItems[u]);
        activeItems++;
      }
    }
    /* Apply markup on the effective subtotal — suppressed entirely when section is $0 */
    var markupAmt = sectionSubtotal > 0 ? sectionSubtotal * (secMarkupPct / 100) : 0;
    var sectionTotal = sectionSubtotal + markupAmt;
    grandSubtotal += sectionSubtotal;
    grandTotal += sectionTotal;

    /* Department display name */
    var deptName = sec.name || 'Section';
    if (slug !== 'travel-meals' && slug !== 'talent') deptName += ' Department';

    h += '<div class="spark-oop-wrap">';

    /* Section header */
    h += '<div class="spark-oop-dept-header" onclick="sparkToggleOopSection(\'' + secId + '\')">';
    h += '<div><span style="font-size:11px;margin-right:6px">' + (secExpanded ? '&#9660;' : '&#9654;') + '</span>';
    h += '<span class="dept-title">' + deptName + '</span>';
    h += '<span class="dept-meta">' + secCats.length + ' categories &middot; ' + activeItems + ' active</span></div>';
    h += '<div class="dept-total">' + sparkFmt(sectionTotal) + '</div>';
    h += '</div>';

    if (secExpanded) {
      h += '<div class="spark-oop-dept-body">';

      /* Column headers */
      h += sparkOopColHeaders(slug);

      /* Categories */
      for (var c = 0; c < secCats.length; c++) {
        var cat = secCats[c];
        var catId = cat.id;
        var catEntries = entriesByCat[catId] || [];
        /* Auto-expand categories that have actual amounts set, unless user explicitly collapsed */
        var _catHasActuals = catEntries.some(function(ce) { return ce.is_active !== false && ce.actual_amount != null; });
        var catExpanded = sparkOopCategoryExpanded[catId] !== undefined ? !!sparkOopCategoryExpanded[catId] : _catHasActuals;
        var activeCatEntries = [];
        var catTotal = 0;
        for (var e = 0; e < catEntries.length; e++) {
          if (catEntries[e].is_active !== false) {
            activeCatEntries.push(catEntries[e]);
            catTotal += sparkOopItemEffective(catEntries[e]);
          }
        }

        /* Category row */
        h += '<div class="spark-oop-cat-row" onclick="sparkToggleOopCategory(\'' + catId + '\')">';
        h += '<div><span class="cat-toggle">' + (catExpanded ? '&#9660;' : '&#9654;') + '</span>';
        h += '<span class="cat-label">' + (cat.name || 'Unnamed') + '</span>';
        h += '<span class="cat-meta">' + activeCatEntries.length + ' items</span></div>';
        h += '<div class="cat-total">' + sparkFmt(catTotal) + '</div>';
        h += '</div>';

        /* Expanded line items */
        if (catExpanded) {

          }

            var itemTotal = sparkOopItemTotal(item);

            /* Adjusted values — override planned if set */
            var adjCount = item.adjusted_count;
            var adjRate = item.adjusted_rate;
            var adjDays = item.adjusted_days;
            var adjHead = item.adjusted_head_count;
            var adjTotal = (adjCount != null || adjRate != null) ? (adjCount != null ? adjCount : (item.count||0)) * (adjRate != null ? adjRate : itemRate) * (adjDays != null ? adjDays : (item.days||1)) * (adjHead != null ? adjHead : (item.head_count||1)) : null;

            /* Actual values */
            var actCount = item.actual_count;
            var actRate = item.actual_rate;
            var actDays = item.actual_days;
            var actHead = item.actual_head_count;
            var actAmount = item.actual_amount;
            var actTotal = actAmount != null ? actAmount : ((actCount != null || actRate != null) ? (actCount != null ? actCount : 0) * (actRate != null ? actRate : 0) * (actDays != null ? actDays : 1) * (actHead != null ? actHead : 1) : null);

            var iid = item.id;

            /* ── PLANNED ── */
            h += '<div class="num tier-planned"><input type="number" class="spark-input" value="' + (item.count||0) + '" min="0" step="1" onchange="sparkDebouncedPatchOop(\'' + iid + '\',\'count\',this.value)"></div>';

            if (slug === 'talent' || slug === 'travel-meals') {
              h += '<div class="num tier-adjusted"><input type="number" class="spark-input adj-input" value="' + (adjDays != null ? adjDays : '') + '" placeholder="—" min="0" step="1" onchange="sparkDebouncedPatchOop(\'' + iid + '\',\'adjusted_days\',this.value)"></div>';
            }
            if (slug === 'travel-meals') {
              h += '<div class="num tier-adjusted"><input type="number" class="spark-input adj-input" value="' + (adjHead != null ? adjHead : '') + '" placeholder="—" min="0" step="1" onchange="sparkDebouncedPatchOop(\'' + iid + '\',\'adjusted_head_count\',this.value)"></div>';

            /* ── ACTUAL ── */
            h += '<div class="num tier-actual"><input type="number" class="spark-input act-input" value="' + (actCount != null ? actCount : '') + '" placeholder="—" min="0" step="1" onchange="sparkDebouncedPatchOop(\'' + iid + '\',\'actual_count\',this.value)"></div>';
            h += '<div class="num tier-actual"><input type="number" class="spark-input act-input" value="' + (actRate != null ? actRate : '') + '" placeholder="—" min="0" step="0.01" onchange="sparkDebouncedPatchOop(\'' + iid + '\',\'actual_rate\',this.value)"></div>';
            if (slug === 'talent' || slug === 'travel-meals') {
              h += '<div class="num tier-actual"><input type="number" class="spark-input act-input" value="' + (actDays != null ? actDays : '') + '" placeholder="—" min="0" step="1" onchange="sparkDebouncedPatchOop(\'' + iid + '\',\'actual_days\',this.value)"></div>';
            }
            if (slug === 'travel-meals') {
              h += '<div class="num tier-actual"><input type="number" class="spark-input act-input" value="' + (actHead != null ? actHead : '') + '" placeholder="—" min="0" step="1" onchange="sparkDebouncedPatchOop(\'' + iid + '\',\'actual_head_count\',this.value)"></div>';

            /* Paid checkbox + date */

            h += '<div style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px">';

            h += '<button onclick="sparkDeleteOopEntry(\'' + iid + '\')" title="Delete line item" style="background:none;border:none;color:var(--mid-gray);cursor:pointer;font-size:14px;padding:2px 4px;opacity:.5;transition:opacity .2s" onmouseenter="this.style.opacity=1;this.style.color=\'var(--ember)\'" onmouseleave="this.style.opacity=.5;this.style.color=\'var(--mid-gray)\'">&times;</button></div>';

      if (activeUncatForSec.length > 0) {

        h += '<div class="cat-total">' + sparkFmt(uncatTotal) + '</div>';
        h += '</div>';
        if (uncatExpanded) {
          /* Build category options for this section so the user can assign the entry */
          var uncatSecCats = (catsBySec[secId] || []);
          var uncatCatOpts = '<option value="">— Assign category —</option>';
          for (var uc = 0; uc < uncatSecCats.length; uc++) {
            uncatCatOpts += '<option value="' + uncatSecCats[uc].id + '">' + (uncatSecCats[uc].name || 'Unnamed') + '</option>';
          }
          for (var u = 0; u < activeUncatForSec.length; u++) {
            var item = activeUncatForSec[u];
            var iid = item.id;
            var itemTotal = sparkOopItemTotal(item);
            var itemName = item.line_item_name || 'Unnamed';
            var adjCount = item.adjusted_count, adjRate = item.adjusted_rate, adjDays = item.adjusted_days, adjHead = item.adjusted_head_count;
            var adjTotal2 = (adjCount != null || adjRate != null) ? (adjCount != null ? adjCount : (item.count||0)) * (adjRate != null ? adjRate : (item.rate||0)) * (adjDays != null ? adjDays : (item.days||1)) * (adjHead != null ? adjHead : (item.head_count||1)) : null;
            var actAmount = item.actual_amount, actCount = item.actual_count, actRate = item.actual_rate, actDays = item.actual_days, actHead = item.actual_head_count;
            var actTotal2 = actAmount != null ? actAmount : ((actCount != null || actRate != null) ? (actCount != null ? actCount : 0) * (actRate != null ? actRate : 0) * (actDays != null ? actDays : 1) * (actHead != null ? actHead : 1) : null);
            h += '<div class="spark-oop-line-item-3tier">';
            h += '<div><input type="text" class="spark-input" style="width:100%;text-align:left;font-weight:500" value="' + itemName.replace(/"/g, '&quot;') + '" onchange="sparkDebouncedPatchOop(\'' + iid + '\',\'line_item_name\',this.value)" onblur="sparkDebouncedPatchOop(\'' + iid + '\',\'line_item_name\',this.value)"></div>';
            h += '<div class="num tier-planned"><input type="number" class="spark-input" value="' + (item.count||0) + '" min="0" step="1" onchange="sparkDebouncedPatchOop(\'' + iid + '\',\'count\',this.value)"></div>';
            h += '<div class="num tier-planned"><input type="number" class="spark-input" value="' + (item.rate||0) + '" min="0" step="0.01" onchange="sparkDebouncedPatchOop(\'' + iid + '\',\'rate\',this.value)"></div>';

            h += '<div class="num tier-adjusted"><input type="number" class="spark-input adj-input" value="' + (adjRate != null ? adjRate : '') + '" placeholder="—" min="0" step="0.01" onchange="sparkDebouncedPatchOop(\'' + iid + '\',\'adjusted_rate\',this.value)"></div>';
            h += '<div class="num tier-adjusted" style="font-weight:600">' + (adjTotal2 != null ? sparkFmt(adjTotal2) : '<span style="opacity:.3">—</span>') + '</div>';

            h += '<div class="num tier-actual" style="font-weight:600">' + (actTotal2 != null ? sparkFmt(actTotal2) : '<span style="opacity:.3">—</span>') + '</div>';

            h += '<div style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px">';

          }

      }

      /* Section subtotal / markup / total */
      h += '<div class="spark-oop-subtotal"><span>' + deptName + ' Subtotal</span><span style="font-weight:600">' + sparkFmt(sectionSubtotal) + '</span></div>';

      h += '<div class="spark-oop-dept-total"><span>' + deptName + ' Total</span><span>' + sparkFmt(sectionTotal) + '</span></div>';

      h += '</div>'; /* end dept-body */
    }

    h += '</div>'; /* end spark-oop-wrap */
  }

  /* Grand total bar — subtotal + markup breakdown */

async function sparkLoadBudget(budgetId) {
  sparkSelectedBudget = budgetId; try { if (budgetId) localStorage.setItem("furnace_spark_budget", budgetId); else localStorage.removeItem("furnace_spark_budget"); } catch(e) {}
  if (!budgetId) { sparkCurrentData = null; sparkRenderBudgetContent(); return; }

  var loadingEl = document.getElementById('sparkBudgetContent');
  if (loadingEl) loadingEl.innerHTML = '<div style="padding:40px;text-align:center;color:var(--mid-gray)">Loading budget data...</div>';

  var results = await Promise.all([
    sparkFetch('budgets', 'id=eq.' + budgetId + '&select=*,projects(id,name,project_code,clients(id,name,client_number))'),
    sparkFetch('labor_budget_entries', 'budget_id=eq.' + budgetId + '&select=*,team_member:team_members(id,name,billable_rate,fully_burdened_rate,department,employment_type)&order=department.asc,display_order.asc'),
    sparkFetch('oop_budget_entries', 'budget_id=eq.' + budgetId + '&select=*,section:oop_sections(id,name,slug),category:oop_categories(id,name)&order=display_order.asc'),
    sparkFetch('oop_sections', 'select=*&order=display_order.asc'),
    sparkFetch('oop_categories', 'select=*&order=display_order.asc'),
    sparkFetch('labor_actuals', 'budget_id=eq.' + budgetId + '&select=*,team_member:team_members(id,name,department,employment_type)&order=work_date.desc'),
    sparkFetch('agency_settings', 'select=*&order=category.asc,sort_order.asc'),
    sparkFetch('freelancer_budget_entries', 'budget_id=eq.' + budgetId + '&select=*,team_member:team_members(id,name,billable_rate,fully_burdened_rate)&order=team_member_id.asc,display_order.asc')
  ]);

  sparkCurrentData = {
    budget: results[0] && results[0][0] ? results[0][0] : null,
    labor: results[1] || [],
    oop: results[2] || [],
    oopSections: results[3] || [],
    oopCategories: results[4] || [],
    actuals: results[5] || [],
    settings: results[6] || [],
    freelancerEntries: results[7] || []
  };

  sparkPhaseTab = 'all';
  sparkOopTab = (sparkCurrentData.oopSections.length && sparkCurrentData.oopSections[0].slug) || 'creative';
  sparkRenderBudgetContent();
}

function sparkRenderBudgetContent(embedded) {
  var el = embedded ? document.getElementById('sparkProjectBudget') : document.getElementById('sparkBudgetContent');
  if (!el) return;
  if (!sparkCurrentData || !sparkCurrentData.budget) {
    el.innerHTML = embedded
      ? '<div style="padding:16px 20px;color:var(--mid-gray);font-size:13px;background:var(--white);border-radius:10px;margin-bottom:20px">Could not load budget data.</div>'
      : '<div style="padding:40px;text-align:center;color:var(--mid-gray)">Select a budget above to begin editing.</div>';
    return;
  }

  var data = sparkCurrentData;
  var budget = data.budget;
  var settings = data.settings;
  var reservePct = sparkSettingVal(settings, 'reserve', 'reserve_percentage', 5);
  var discountPct = budget.has_discount ? 3.5 : 0;
  var clientPrice = budget.client_price || 0;
  var discountAmt = clientPrice * (discountPct / 100);
  var tcv = clientPrice - discountAmt;
  var reserveAmt = tcv * (reservePct / 100);

  /* Compute labor total + hours — Employees only */
  var totalLaborCost = 0;  /* Client-facing @ $200/hr */
  var totalLaborInternal = 0;  /* Internal cost @ actual rates */
  var totalLaborHrs = 0;
  for (var i = 0; i < data.labor.length; i++) {
    var li = data.labor[i];
    var hrs = sparkEntryHours(li, 'all');
    totalLaborCost += hrs * sparkGetRate(li);
    totalLaborInternal += hrs * sparkGetInternalRate(li);
    totalLaborHrs += hrs;
  }
  /* Compute freelancer total from dedicated table */
  var totalFreelancerHrs = 0, totalFreelancerCost = 0;
  for (var i = 0; i < (data.freelancerEntries || []).length; i++) {
    var fe = data.freelancerEntries[i];
    totalFreelancerHrs += fe.hours || 0;
    totalFreelancerCost += (fe.hours || 0) * (fe.rate || 0);
  }
  /* Compute OOP total using effective amounts (cascade: actual → adjusted → planned) */
  var totalOop = 0;
  for (var i = 0; i < data.oop.length; i++) {
    if (data.oop[i].is_active !== false) totalOop += sparkOopItemEffective(data.oop[i]);
  }
  var totalOopWithMarkup = sparkComputeOopWithSectionMarkup(data);
  var totalAmount = totalLaborCost + totalFreelancerCost + totalOopWithMarkup;
