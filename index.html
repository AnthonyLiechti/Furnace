async function fetchTrevorHours(from, to) {
  if (!TREVOR_TRACKER_KEY) return;
  if (TREVOR_HOURS.from === from && TREVOR_HOURS.to === to && !TREVOR_HOURS.error && !TREVOR_HOURS.loading) return;
  TREVOR_HOURS.loading = true; TREVOR_HOURS.error = null;
  try {
    var resp = await fetch(TREVOR_TRACKER_URL + '/api/v1/time-entries?from=' + from + '&to=' + to,
      { headers: { 'Authorization': 'Bearer ' + TREVOR_TRACKER_KEY } });
    if (resp.ok) {
      TREVOR_HOURS.entries = await resp.json();
      TREVOR_HOURS.from = from; TREVOR_HOURS.to = to;
    } else if (resp.status === 401) {
      TREVOR_HOURS.error = '401 — key revoked. Tell Trevor to mint a new one in Settings › Admin › API.';
      TREVOR_HOURS.entries = [];
    } else {
      TREVOR_HOURS.error = 'API error ' + resp.status;
      TREVOR_HOURS.entries = [];
    }
  } catch(e) {
    TREVOR_HOURS.error = 'Network error: ' + (e.message || 'unknown');
    TREVOR_HOURS.entries = [];
  }
  TREVOR_HOURS.loading = false;
  renderResource();
}

function trevorGetRange(wk) {
  /* Returns { from, to } covering the current RT view week or month */
  if (!wk || !wk.sunday) return null;
  if (rtTimeMode === 'month') {
    var d = new Date(wk.sunday + 'T00:00:00');
    var first = new Date(d.getFullYear(), d.getMonth(), 1);
    var last  = new Date(d.getFullYear(), d.getMonth() + 1, 0);
    return { from: first.toISOString().slice(0, 10), to: last.toISOString().slice(0, 10) };
  }
  /* Week: sunday + 1 = Mon, sunday + 5 = Fri */
  var sun = new Date(wk.sunday + 'T00:00:00');
  var mon = new Date(sun); mon.setDate(mon.getDate() + 1);
  var fri = new Date(sun); fri.setDate(fri.getDate() + 5);
  return { from: mon.toISOString().slice(0, 10), to: fri.toISOString().slice(0, 10) };
}

async function trevorSyncToSupabase(from, to) {
  if (!TREVOR_TRACKER_KEY) return;
  if (!sparkAuth || !sparkAuth.connected) {
    TREVOR_SYNC = { syncing: false, msg: 'Furnace not connected to Supabase.', isError: true };
    renderResource(); return;
  }

  function setStatus(msg, isError) {
    TREVOR_SYNC = { syncing: !isError, msg: msg, isError: !!isError };
    renderResource();
  }

  setStatus('Fetching from tracker…');

  /* 1. Fetch from Trevor's tracker API */
  var entries;
  try {
    var resp = await fetch(TREVOR_TRACKER_URL + '/api/v1/time-entries?from=' + from + '&to=' + to,
      { headers: { 'Authorization': 'Bearer ' + TREVOR_TRACKER_KEY } });
    if (!resp.ok) throw new Error(resp.status === 401 ? 'Key revoked (401)' : 'API error ' + resp.status);
    entries = await resp.json();
    TREVOR_HOURS.entries = entries; TREVOR_HOURS.from = from; TREVOR_HOURS.to = to; TREVOR_HOURS.error = null;
  } catch(e) {
    setStatus('Tracker fetch failed: ' + e.message, true); return;
  }

  if (!entries || entries.length === 0) {
    TREVOR_SYNC = { syncing: false, msg: 'No entries in tracker for this period.', isError: false };
    renderResource(); return;
  }

  /* 2. Build board_id → Furnace project lookup */
  var boardMap = {};
  var allP = allProjects();
  for (var i = 0; i < allP.length; i++) {
    if (allP[i].boardId) boardMap[String(allP[i].boardId)] = allP[i];
  }

  /* 3. Convert tracker entries → labor_actuals rows */
  var rows = [], skipped = 0;
  for (var i = 0; i < entries.length; i++) {
    var e = entries[i];
    var hrs = parseFloat(e.parsed_hours);
    if (!hrs || hrs <= 0) continue;
    var bid  = e.matched_board_id ? String(e.matched_board_id) : null;
    var proj = bid ? boardMap[bid] : null;
    if (!proj) { skipped++; continue; }
    var etype = (e.entry_type || '').toLowerCase();
    rows.push({
      person_name:  TREVOR_RT_NAME,
      board_name:   e.matched_project_name || proj.name || '',
      project_code: proj.code,
      work_date:    e.date,
      hours:        hrs,
      source:       'timetracker',
      is_billable:  proj.hourType !== 'nonbillable',
      is_bizdev:    false,
      is_timeoff:   etype.indexOf('off') > -1 || etype.indexOf('vacation') > -1 || etype.indexOf('pto') > -1,
      phase_key:    null,
      start_time:   null
    });
  }

  if (rows.length === 0) {
    TREVOR_SYNC = { syncing: false, msg: 'Nothing to sync — ' + skipped + ' unmatched project' + (skipped !== 1 ? 's' : '') + '.', isError: false };
    renderResource(); return;
  }

  /* 4. Delete Trevor's existing actuals for this date range */
  setStatus('Clearing old entries for ' + from + ' – ' + to + '…');
  try {
    await sparkFetch('labor_actuals?source=eq.timetracker&person_name=eq.' + encodeURIComponent(TREVOR_RT_NAME) + '&work_date=gte.' + from + '&work_date=lte.' + to, '', 'DELETE');
  } catch(e) {
    setStatus('Delete failed: ' + e.message, true); return;
  }

  /* 5. Batch insert new rows */
  setStatus('Writing ' + rows.length + ' entries to Supabase…');
  var BATCH = 200, inserted = 0;
  for (var b = 0; b < rows.length; b += BATCH) {
    try {
      var res = await sparkFetch('labor_actuals', '', 'POST', rows.slice(b, b + BATCH));
      if (res && res.error) throw new Error(res.error.message || JSON.stringify(res.error));
      inserted += Math.min(BATCH, rows.length - b);
    } catch(e) {
      setStatus('Insert failed: ' + e.message, true); return;
    }
  }

  /* 6. Patch local SUPA_ACTUALS_ALL cache + rebuild RT_WEEKS */
  SUPA_ACTUALS_ALL = (SUPA_ACTUALS_ALL || []).filter(function(a) {
    return !(a.person_name === TREVOR_RT_NAME && a.work_date >= from && a.work_date <= to);
  });
  SUPA_ACTUALS_ALL = SUPA_ACTUALS_ALL.concat(rows);
  computeResourceWeeks();

  TREVOR_SYNC = {
    syncing:  false,
    msg:      '✓ ' + inserted + ' entr' + (inserted !== 1 ? 'ies' : 'y') + ' synced' + (skipped ? ' · ' + skipped + ' unmatched skipped' : ''),
    isError:  false
  };
  renderResource();
}

function rtGetCurrentIdx() {
  if (rtWeekIdx >= 0 && rtWeekIdx < RT_WEEKS.length) return rtWeekIdx;
  /* Default: latest week with actual hours */
  for (var i = RT_WEEKS.length - 1; i >= 0; i--) {
    var tot = 0;
    for (var p in RT_WEEKS[i].people) tot += RT_WEEKS[i].people[p].actual || 0;
    if (tot > 0) return i;
  }
  return RT_WEEKS.length - 1;
}
function rtNav(dir) {
  var idx = rtGetCurrentIdx();
  if (rtTimeMode === 'week') {
    rtWeekIdx = Math.max(0, Math.min(RT_WEEKS.length - 1, idx + dir));
  } else {
    /* Jump to next/prev month */
    var curMon = RT_WEEKS[idx].sunday.substring(0, 7);
    if (dir > 0) {
      for (var i = idx + 1; i < RT_WEEKS.length; i++) {
        if (RT_WEEKS[i].sunday.substring(0, 7) !== curMon) { rtWeekIdx = i; break; }
      }
    } else {
      for (var i = idx - 1; i >= 0; i--) {
        if (RT_WEEKS[i].sunday.substring(0, 7) !== curMon) {
          /* Find first week of that month */
          var tgtMon = RT_WEEKS[i].sunday.substring(0, 7);
          for (var j = 0; j <= i; j++) {
            if (RT_WEEKS[j].sunday.substring(0, 7) === tgtMon) { rtWeekIdx = j; break; }
          }
          break;
        }
      }
    }
  }
  renderResource();
}
function rtGetMonthWeeks(startIdx) {
  /* Get all weeks in the same month as startIdx */
  var mon = RT_WEEKS[startIdx].sunday.substring(0, 7);
  var indices = [];
  for (var i = 0; i < RT_WEEKS.length; i++) {
    if (RT_WEEKS[i].sunday.substring(0, 7) === mon) indices.push(i);
  }
  return indices;
}
function rtAggregateWeeks(indices) {
  /* Combine multiple weeks into one virtual week */
  var combined = {label:'', sunday:'', people:{}};
  var labels = [];
  for (var w = 0; w < indices.length; w++) {
    var wk = RT_WEEKS[indices[w]];
    labels.push(wk.label);
    for (var pn in wk.people) {
      if (!combined.people[pn]) combined.people[pn] = {predicted:0, actual:0, projects:{}};
      combined.people[pn].predicted += wk.people[pn].predicted || 0;
      combined.people[pn].actual += wk.people[pn].actual || 0;
      var projs = wk.people[pn].projects || {};
      for (var pk in projs) {
        if (!combined.people[pn].projects[pk]) combined.people[pn].projects[pk] = {p:0, a:0};
        combined.people[pn].projects[pk].p += projs[pk].p || 0;
        combined.people[pn].projects[pk].a += projs[pk].a || 0;
      }
    }
  }
  var d = new Date(RT_WEEKS[indices[0]].sunday + 'T00:00:00');
  combined.label = d.toLocaleDateString('en-US', {month:'long', year:'numeric'});
  combined.sunday = RT_WEEKS[indices[0]].sunday;
  return combined;
}

function rtCalcAcc(predicted, actual) {
  return Math.max(predicted, actual) > 0 ? Math.min(predicted, actual) / Math.max(predicted, actual) * 100 : 100;
}
function rtCalcAccProject(predicted, actual) {
  if (predicted === 0 && actual === 0) return 100;
  if (predicted === 0) {
    if (actual <= 0.5) return 50;
    if (actual <= 1.0) return 25;
    return 0;
  }
  return Math.min(predicted, actual) / Math.max(predicted, actual) * 100;
}

function isFutureWk(wk) {
  for (var pn in wk.people) { if ((wk.people[pn].actual || 0) > 0) return false; }
  return true;
}

function rtFilterNames(allNames) {
  if (rtShowLeadership) return allNames;
  var out = [];
  for (var i = 0; i < allNames.length; i++) {
    if (RT_LEADERSHIP.indexOf(allNames[i]) === -1) out.push(allNames[i]);
  }
  return out;
}

  if (!rmFlWeekOf) rmFlWeekOf = getCurrentMonday();
  var isDark = document.documentElement.classList.contains('dark');
  var _todayISO = new Date().toISOString().slice(0, 10);
  var anchor = new Date(rmFlWeekOf + 'T00:00:00');
  var month = anchor.getMonth(), year = anchor.getFullYear();

  /* Grid start: Monday on or before 1st of month */
  var firstOfMonth = new Date(year, month, 1);
  var fdow = firstOfMonth.getDay();
  var gridStart = new Date(firstOfMonth);
  gridStart.setDate(gridStart.getDate() - (fdow === 0 ? 6 : fdow - 1));
  var lastDay = new Date(year, month + 1, 0);

  /* FL lookup: tmId|dayISO → [entries] */
  var flLookup = {};
  for (var i = 0; i < flEntries.length; i++) {
    var e = flEntries[i];
    if (!flIsDateLabel(e.week_label || '')) continue;
    var k = e.team_member_id + '|' + e.week_label;
    if (!flLookup[k]) flLookup[k] = [];
    flLookup[k].push(e);
  }

  /* OOP lookup: dayISO → [schedule entries] */
  var oopByDay = {};
  if (projCode && OOP_SCHEDULE && OOP_SCHEDULE.entries) {
    for (var _oi = 0; _oi < OOP_SCHEDULE.entries.length; _oi++) {
      var _oe = OOP_SCHEDULE.entries[_oi];
      if (_oe.projectCode !== projCode) continue;
      if (!oopByDay[_oe.date]) oopByDay[_oe.date] = [];
      oopByDay[_oe.date].push(_oe);
    }
  }

  var _dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var h = '';

  /* Day-of-week header row */
  h += '<div style="display:grid;grid-template-columns:repeat(7,1fr);border-radius:8px 8px 0 0;overflow:hidden;border:1px solid rgba(91,74,138,.15);border-bottom:none">';
  for (var _di = 0; _di < 7; _di++) {
    var _isWknd = _di >= 5;
    h += '<div style="padding:6px 0;text-align:center;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:' + (_isWknd ? 'var(--mid-gray)' : 'var(--abyss)') + ';background:rgba(91,74,138,.06);border-right:' + (_di < 6 ? '1px solid rgba(91,74,138,.1)' : 'none') + '">' + _dayNames[_di] + '</div>';
  }
  h += '</div>';

  /* Calendar cells */
  h += '<div style="display:grid;grid-template-columns:repeat(7,1fr);border:1px solid rgba(91,74,138,.15);border-radius:0 0 8px 8px;overflow:hidden">';
  var cur = new Date(gridStart);
  var cellIdx = 0;
  while (true) {
    var dayISO = cur.toISOString().slice(0, 10);
    var inMonth = cur.getMonth() === month;
    var isToday = dayISO === _todayISO;
    var isWeekend = cur.getDay() === 0 || cur.getDay() === 6;
    var colIdx = cellIdx % 7;
    if (!inMonth && cur > lastDay && colIdx === 0) break;
    var cellBg = isToday ? 'rgba(91,74,138,.1)' : (isWeekend ? (isDark ? 'rgba(255,255,255,.01)' : 'rgba(0,0,0,.02)') : 'transparent');
    h += '<div style="min-height:90px;padding:4px;background:' + cellBg + ';border-right:' + (colIdx < 6 ? '1px solid rgba(91,74,138,.1)' : 'none') + ';border-bottom:1px solid rgba(91,74,138,.1);position:relative;cursor:pointer;opacity:' + (inMonth ? '1' : '.35') + '" onclick="rmFlDayClick(\'' + projCode + '\',\'' + dayISO + '\')">';
    h += '<div style="font-size:12px;font-weight:' + (isToday ? '700' : '500') + ';color:' + (isToday ? '#5B4A8A' : 'var(--abyss)') + ';margin-bottom:3px">' + cur.getDate() + '</div>';
    /* FL chips */
    for (var _fi = 0; _fi < freelancers.length; _fi++) {
      var _fl = freelancers[_fi];
      var _ck = _fl.tmId + '|' + dayISO;
      var _cEnts = flLookup[_ck] || [];
      if (!_cEnts.length) continue;
      var _hrs = 0, _paid = false;
      for (var _ei = 0; _ei < _cEnts.length; _ei++) { _hrs += _cEnts[_ei].hours || 0; if (_cEnts[_ei].paid) _paid = true; }
      var _chipBg = _paid ? 'rgba(46,125,50,.12)' : 'rgba(91,74,138,.12)';
      var _chipClr = _paid ? '#2E7D32' : '#5B4A8A';
      var _shortName = _fl.name.split(' ')[0];
      h += '<div onclick="event.stopPropagation();rmFlOpenCellModal(\'' + projCode + '\',\'' + _fl.tmId + '\',\'' + dayISO + '\')" style="background:' + _chipBg + ';color:' + _chipClr + ';border-radius:3px;padding:2px 4px;margin-bottom:2px;font-size:9px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + _shortName + ' \u00b7 ' + _hrs + 'h</div>';
    }
    /* OOP chips */
    var _oopDay = oopByDay[dayISO] || [];
    for (var _oi2 = 0; _oi2 < _oopDay.length; _oi2++) {
      var _oop = _oopDay[_oi2];
      var _oChipBg = _oop.paid ? 'rgba(46,125,50,.12)' : 'rgba(245,127,23,.12)';
      var _oChipClr = _oop.paid ? '#2E7D32' : '#F57F17';
      h += '<div style="background:' + _oChipBg + ';color:' + _oChipClr + ';border-radius:3px;padding:2px 4px;margin-bottom:2px;font-size:9px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="' + (_oop.lineItemName || 'OOP') + '">' + sparkFmt(_oop.amount) + ' OOP</div>';
    }
    h += '</div>';
    cur.setDate(cur.getDate() + 1);
    cellIdx++;
  }
  h += '</div>';
  return h;
}

function rmFlDayClick(projCode, dayISO) {

  h += '<div style="font-size:13px;font-weight:700;margin-bottom:4px">' + _dayLong[_d.getDay()] + ', ' + _FL_MON[_d.getMonth()] + ' ' + _d.getDate() + '</div>';

  h += '</div></div>';
  document.body.insertAdjacentHTML('beforeend', h);
}

function rmFlGetFreelancers(entries) {
  var seen = {}, result = [];
  for (var i = 0; i < entries.length; i++) {
    var e = entries[i], tid = e.team_member_id;
    if (!seen[tid]) { seen[tid] = true; result.push({ tmId: tid, name: e._name || (e.team_member && e.team_member.name) || 'Unknown', rate: e.rate || 0 }); }
  }
  return result;
}

function rmFlGetTiers(entries, tmId) {
  var planned = 0, adjusted = 0, actual = 0;
  for (var i = 0; i < entries.length; i++) {
    var e = entries[i];
    if (e.team_member_id !== tmId) continue;
    if (e.week_label === '__budget__') { planned += e.hours || 0; continue; }
    if (flIsDateLabel(e.week_label || '')) { adjusted += e.hours || 0; if (e.paid) actual += e.hours || 0; }
  }
  return { planned: planned, adjusted: adjusted, actual: actual };
}

function rmFlGetColumns() {
  if (!rmFlWeekOf) rmFlWeekOf = getCurrentMonday();
  var cols = [];
  var _rmDays = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var _todayISO = new Date().toISOString().slice(0, 10);
  if (rmFlViewMode === 'month') {
    /* Month view: one column per week-start (Monday) in the month */
    var d = new Date(rmFlWeekOf + 'T00:00:00'), tm = d.getMonth(), ty = d.getFullYear();
    var first = new Date(ty, tm, 1), dow = first.getDay();
    first.setDate(first.getDate() - (dow === 0 ? 6 : dow - 1));
    var endOM = new Date(ty, tm + 1, 0), cur = new Date(first);
    while (cur <= endOM) {
      var iso = cur.toISOString().slice(0, 10);
      cols.push({ key: iso, label: _FL_MON[cur.getMonth()] + ' ' + cur.getDate(), faded: cur.getMonth() !== tm, isWeek: true, isWeekend: false, isToday: false });
      cur.setDate(cur.getDate() + 7);
    }
  } else {
    /* Week view: 7 individual day columns (Mon–Sun) */
    var cur = new Date(rmFlWeekOf + 'T00:00:00');
    for (var i = 0; i < 7; i++) {
      var iso = cur.toISOString().slice(0, 10);
      var dow = cur.getDay();
      var isWeekend = (dow === 0 || dow === 6);
      cols.push({
        key: iso,
        label: _rmDays[dow] + '<br><span style="font-size:9px;opacity:.7">' + _FL_MON[cur.getMonth()] + ' ' + cur.getDate() + '</span>',
        faded: false,
        isWeek: false,
        isWeekend: isWeekend,
        isToday: iso === _todayISO
      });
      cur.setDate(cur.getDate() + 1);
    }
  }
  return cols;
}

async function rmFlSaveCellEntry(projCode, tmId, weekISO, entryId, rate) {
  var hrsEl = document.getElementById('rmFlCellHrs');
  var paidEl = document.getElementById('rmFlCellPaid');
  var pdEl   = document.getElementById('rmFlCellPaidDate');
  if (!hrsEl) return;
  var hours = parseFloat(hrsEl.value) || 0;
  var paid = paidEl ? paidEl.checked : false;
  var paidDate = (paid && pdEl && pdEl.value) ? pdEl.value : null;
  sparkShowSaving();
  if (entryId) {
    await sparkFetch('freelancer_budget_entries?id=eq.' + entryId, '', 'PATCH', { hours: hours, paid: paid, paid_date: paidDate });
    for (var i = 0; i < RM_FL.entries.length; i++) {
      if (RM_FL.entries[i].id === entryId) { RM_FL.entries[i].hours = hours; RM_FL.entries[i].paid = paid; RM_FL.entries[i].paid_date = paidDate; break; }
    }
  } else {
    if (hours <= 0) { sparkHideSaving(); document.getElementById('rmFlCellOverlay').remove(); return; }
    var result = await sparkFetch('freelancer_budget_entries', '', 'POST', {
      budget_id: RM_FL.budgetId, team_member_id: tmId, week_label: weekISO,
      hours: hours, rate: rate, paid: paid, paid_date: paidDate, display_order: RM_FL.entries.length
    });
    if (result && result.length) {
      result[0]._name = rmFlGetNameForTm(tmId);
      result[0].team_member = { id: tmId, name: result[0]._name };
      RM_FL.entries.push(result[0]);
    }
  }
  if (SUPA_BUDGETS && SUPA_BUDGETS[projCode]) { SUPA_BUDGETS[projCode]._flEntries = RM_FL.entries.slice(); flRecomputeTotals(SUPA_BUDGETS[projCode]); }
  sparkHideSaving();
  document.getElementById('rmFlCellOverlay').remove();
  renderRMFlUpdate();
}

async function rmFlDeleteCellEntry(entryId) {
  sparkShowSaving();
  await sparkFetch('freelancer_budget_entries?id=eq.' + entryId, '', 'DELETE', null);
  RM_FL.entries = RM_FL.entries.filter(function(e) { return e.id !== entryId; });
  rmFlSyncBack();
  sparkHideSaving();
  document.getElementById('rmFlCellOverlay').remove();
  renderRMFlUpdate();
}

    return calHtml + '<div style="padding:40px 24px;text-align:center;color:var(--mid-gray)">'
      + '<div style="font-size:14px;font-weight:600;margin-bottom:6px">No active OOP entries</div>'
      + '<div style="font-size:12px">This project has no out-of-pocket line items set up yet.</div>'
      + '</div>';
  }

  /* Group by section */
  var sections = {}, secOrder = [];
  for (var i = 0; i < active.length; i++) {
    var e = active[i];
    var secId = e.section_id || (e.section ? e.section.id : 'other');
    var secName = (e.section && e.section.name) || 'Other';
    if (!sections[secId]) { sections[secId] = { name: secName, entries: [] }; secOrder.push(secId); }
    sections[secId].entries.push(e);
  }

  var grandTotal = 0, grandPaid = 0;
  var h = '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mid-gray);margin-bottom:10px">&#128203; OOP Line Items</div>';

  for (var s = 0; s < secOrder.length; s++) {
    var sid = secOrder[s];
    var sec = sections[sid];
    var secTotal = 0, secPaid = 0;
    for (var i = 0; i < sec.entries.length; i++) {
      var e = sec.entries[i];
      var cost = (e.count || 0) * (e.rate || 0) * (e.days || 1) * (e.head_count || 1);
      if (cost === 0) continue;
      secTotal += cost;
      if (e.paid) secPaid += cost;
    }
    grandTotal += secTotal;
    grandPaid  += secPaid;

    h += '<div style="border:1px solid rgba(100,130,180,.2);border-radius:8px;margin-top:8px;overflow:hidden">';
    /* Section header */
    h += '<div style="background:rgba(100,130,180,.15);color:' + dmText + ';padding:8px 12px;display:flex;align-items:center;justify-content:space-between">';
    h += '<span style="font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em">' + sec.name + '</span>';
    h += '<span style="font-size:12px;font-weight:600;color:' + dmText + '">' + sparkFmt(secTotal) + (secPaid > 0 ? ' <span style="color:#81C784;font-size:11px">· ' + sparkFmt(secPaid) + ' paid</span>' : '') + '</span>';
    h += '</div>';
    /* Column headers */
    h += '<div style="display:grid;grid-template-columns:1fr 90px 1fr;gap:8px;padding:5px 12px 3px;background:rgba(100,130,180,.06)">';
    h += '<div style="font-size:9px;color:var(--mid-gray);text-transform:uppercase;letter-spacing:.5px;font-weight:700">Item</div>';
    h += '<div style="font-size:9px;color:var(--mid-gray);text-transform:uppercase;letter-spacing:.5px;font-weight:700;text-align:right">Cost</div>';
    h += '<div style="font-size:9px;color:var(--mid-gray);text-transform:uppercase;letter-spacing:.5px;font-weight:700">Paid &amp; Date</div>';
    h += '</div>';
    /* Entry rows */
    for (var j = 0; j < sec.entries.length; j++) {
      var oe = sec.entries[j];
      var oeCost = (oe.count || 0) * (oe.rate || 0) * (oe.days || 1) * (oe.head_count || 1);
      if (oeCost === 0) continue;
      var rowBg = oe.paid ? 'rgba(129,199,132,.07)' : (j % 2 === 0 ? 'transparent' : dmRowAlt);
      h += '<div style="display:grid;grid-template-columns:1fr 90px 1fr;align-items:center;gap:8px;padding:6px 12px;background:' + rowBg + '">';
      h += '<div style="font-size:12px;font-weight:500;color:' + dmText + '">' + (oe.line_item_name || '—') + '</div>';
      h += '<div style="font-size:12px;font-weight:600;text-align:right;color:' + dmText + '">' + sparkFmt(oeCost) + '</div>';
      h += '<div style="display:flex;align-items:center;gap:6px">';
      h += '<input type="checkbox"' + (oe.paid ? ' checked' : '') + ' onchange="rmOopTogglePaid(\'' + oe.id + '\',this.checked)" title="Mark paid" style="cursor:pointer;width:15px;height:15px;accent-color:#81C784;flex-shrink:0">';
      if (oe.paid) {
        h += '<input type="date" value="' + (oe.paid_date || '') + '" onchange="rmOopDebouncedPatch(\'' + oe.id + '\',\'paid_date\',this.value)" style="font-size:11px;border:1px solid ' + dmBorder + ';border-radius:5px;padding:2px 5px;color:#81C784;font-weight:600;background:' + dmSurf2 + ';outline:none">';
      } else {
        h += '<span style="font-size:10px;color:var(--mid-gray)">Unpaid</span>';
      }
      h += '</div>';
      h += '</div>';
    }
    h += '</div>'; /* end section card */
  }

  /* Grand totals */
  var grandUnpaid = grandTotal - grandPaid;
  h += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px 14px;margin-top:10px;background:rgba(100,130,180,.09);border-radius:8px">';
  h += '<div><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mid-gray);opacity:.8;margin-bottom:2px">Total OOP</div>';
  h += '<span style="font-weight:700;color:' + dmText + '">' + sparkFmt(grandTotal) + '</span></div>';
  h += '<div><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#81C784;opacity:.8;margin-bottom:2px">Paid</div>';
  h += '<span style="font-weight:700;color:#81C784">' + sparkFmt(grandPaid) + '</span></div>';
  if (grandUnpaid > 0) {
    h += '<div><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ember);opacity:.8;margin-bottom:2px">Unpaid</div>';
    h += '<span style="font-weight:700;color:var(--ember)">' + sparkFmt(grandUnpaid) + '</span></div>';
  } else {
    h += '<div style="display:flex;align-items:center;gap:4px"><span style="font-size:18px">✓</span><span style="font-size:11px;font-weight:600;color:#81C784">All Paid</span></div>';
  }
  h += '</div>';

  return calHtml + h;
}

/* ── Combined OOP + FL Cash Flow Calendar (shown in both FL and OOP tabs) ── */
function renderRMOopCalendar(projCode) {
  if (!rmFlWeekOf) rmFlWeekOf = getCurrentMonday();

  var flEntries = [];
  var freelancers = [];
  var sb = SUPA_BUDGETS && SUPA_BUDGETS[projCode];
  if (sb && sb._flEntries) {
    flEntries = sb._flEntries;
    freelancers = rmFlGetFreelancers(flEntries);
  }

  /* Check if any OOP scheduled */
  var hasOop = false;
  if (projCode && OOP_SCHEDULE && OOP_SCHEDULE.entries) {
    for (var _oi = 0; _oi < OOP_SCHEDULE.entries.length; _oi++) {
      if (OOP_SCHEDULE.entries[_oi].projectCode === projCode) { hasOop = true; break; }
    }
  }

  var hasAny = hasOop || freelancers.length > 0;
  var _rmd = new Date(rmFlWeekOf + 'T00:00:00');

  h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:16px">';
  h += '<button onclick="rmFlWeekOf=shiftOopMonth(rmFlWeekOf,-1);renderRMOopUpdate();renderRMFlUpdate()" style="padding:4px 10px;border-radius:5px;border:1px solid var(--canvas);background:transparent;cursor:pointer;font-size:14px">&#9664;</button>';
  h += '<span style="font-size:15px;font-weight:700;min-width:160px;text-align:center">' + _rmd.toLocaleDateString('en-US',{month:'long',year:'numeric'}) + '</span>';
  h += '<button onclick="rmFlWeekOf=shiftOopMonth(rmFlWeekOf,1);renderRMOopUpdate();renderRMFlUpdate()" style="padding:4px 10px;border-radius:5px;border:1px solid var(--canvas);background:transparent;cursor:pointer;font-size:14px">&#9654;</button>';
  h += '<button onclick="rmFlWeekOf=getCurrentMonday();renderRMOopUpdate();renderRMFlUpdate()" style="font-size:11px;padding:3px 10px;border-radius:5px;border:1px solid var(--canvas);background:transparent;cursor:pointer;margin-left:4px">Today</button>';

    h += '<div style="padding:16px 0;text-align:center;color:var(--mid-gray);font-size:12px">No FL or OOP payments scheduled for this period.</div>';

    return h;
  }

  h += renderRMMonthGrid(projCode, flEntries, freelancers);
  h += '</div>';
  return h;
}

async function rmOopLoadProject(projCode) {
  if (!projCode) { RM_OOP.projCode = null; RM_OOP.budgetId = null; RM_OOP.entries = []; renderRMOopUpdate(); return; }
  RM_OOP.projCode = projCode;
  var sb = SUPA_BUDGETS && SUPA_BUDGETS[projCode];
  if (!sb || !sb.id) {
    for (var _ci = 0; _ci < (CLIENTS||[]).length; _ci++) {
      for (var _pi = 0; _pi < CLIENTS[_ci].projects.length; _pi++) {
        var _p = CLIENTS[_ci].projects[_pi];
        if (_p.code === projCode && _p._supabudget) { sb = _p._supabudget; break; }
      }
      if (sb && sb.id) break;
    }
  }
  if (!sb || !sb.id) { renderRMOopUpdate(); return; }
  RM_OOP.budgetId = sb.id;
  var el = document.getElementById('rmOopContent');
  if (el) el.innerHTML = '<div style="padding:20px;color:var(--mid-gray)">Loading\u2026</div>';
  var entries = await sparkFetch('oop_budget_entries',
    'budget_id=eq.' + sb.id + '&select=*,section:oop_sections(id,name,slug),category:oop_categories(id,name)&order=display_order.asc');
  RM_OOP.entries = entries || [];
  renderRMOopUpdate();
}

async function rmOopTogglePaid(entryId, checked) {
  sparkShowSaving();
  var today = new Date().toISOString().slice(0, 10);
  var patch = { paid: checked, paid_date: checked ? today : null };
  await sparkFetch('oop_budget_entries?id=eq.' + entryId, '', 'PATCH', patch);
  for (var i = 0; i < RM_OOP.entries.length; i++) {
    if (RM_OOP.entries[i].id === entryId) {
      RM_OOP.entries[i].paid = checked; RM_OOP.entries[i].paid_date = checked ? today : null; break;
    }
  }
  sparkHideSaving();
  renderRMOopUpdate();
}

function rmOopDebouncedPatch(entryId, field, val) {
  if (field === 'paid_date' && !val) return;
  var key = entryId + '|' + field;
  if (rmOopPatchTimers[key]) clearTimeout(rmOopPatchTimers[key]);
  rmOopPatchTimers[key] = setTimeout(async function() {
    sparkShowSaving();
    var patch = {}; patch[field] = val;
    await sparkFetch('oop_budget_entries?id=eq.' + entryId, '', 'PATCH', patch);
    for (var i = 0; i < RM_OOP.entries.length; i++) {
      if (RM_OOP.entries[i].id === entryId) { RM_OOP.entries[i][field] = val; break; }
    }
    sparkHideSaving();
  }, 500);
}

function renderResource() {
  var mc = document.getElementById('mainContent');

  /* ── Freelancer tab doesn't need RT_WEEKS — handle separately ── */
  if (rtView === 'freelancers') {
    var fh = '<h1 class="page-title">Resource Manager</h1>';
    fh += '<p class="page-subtitle">Manage allocations, freelancer schedules and payments</p>';
    fh += '<div class="rt-tabs">';
    fh += '<div class="rt-tab" onclick="rtView=\'people\';renderResource()">Hours</div>';
    fh += '<div class="rt-tab active">Freelancers</div>';
    fh += '<div class="rt-tab" onclick="rtView=\'oop\';renderResource()">Out-Of-Pocket</div>';
    fh += '</div>';
    fh += '<div id="rmFlOuter">' + renderRMFreelancers() + '</div>';
    mc.innerHTML = fh;
    if (RM_FL.projCode && !RM_FL.entries.length) rmFlLoadProject(RM_FL.projCode);
    return;
  }

  /* ── Out-Of-Pocket tab ── */
  if (rtView === 'oop') {
    var oh = '<h1 class="page-title">Resource Manager</h1>';

    oh += '<div class="rt-tabs">';
    oh += '<div class="rt-tab" onclick="rtView=\'people\';renderResource()">Hours</div>';
    oh += '<div class="rt-tab" onclick="rtView=\'freelancers\';renderResource()">Freelancers</div>';
    oh += '<div class="rt-tab active">Out-Of-Pocket</div>';
    oh += '</div>';
    oh += '<div id="rmOopOuter">' + renderRMOop() + '</div>';
    mc.innerHTML = oh;
    if (RM_OOP.projCode && !RM_OOP.entries.length) rmOopLoadProject(RM_OOP.projCode);
    return;
  }

  if (!RT_WEEKS || RT_WEEKS.length === 0) {
    mc.innerHTML = '<h1 class="page-title">Resource Analytics</h1><p style="color:var(--mid-gray);margin-top:12px">No resource tracker data available yet.</p>';
    return;
  }

  var useGlobalFilter = (globalDateFilter !== 'all');
  var idx = rtGetCurrentIdx();
  var wk;
  if (useGlobalFilter) {
    wk = getFilteredRTData();
  } else if (rtTimeMode === 'month') {
    var monthIndices = rtGetMonthWeeks(idx);
    wk = rtAggregateWeeks(monthIndices);
  } else {
    wk = RT_WEEKS[idx];
  }

  var isFuture = true;
  for (var pn in wk.people) { if ((wk.people[pn].actual || 0) > 0) { isFuture = false; break; } }

  var ppl = wk.people;
  var allNames = Object.keys(ppl).sort(function(a,b){ return (ppl[b].actual||0) - (ppl[a].actual||0); });
  var names = rtFilterNames(allNames);

  /* Aggregate totals */
  var totPred = 0, totAct = 0;
  for (var i = 0; i < names.length; i++) { totPred += ppl[names[i]].predicted || 0; totAct += ppl[names[i]].actual || 0; }
  var totalAcc = rtCalcAcc(totPred, totAct);
  var onTarget = 0;
  for (var i = 0; i < names.length; i++) {
    var p = ppl[names[i]].predicted || 0, a = ppl[names[i]].actual || 0;
    if (rtCalcAcc(p, a) >= 80) onTarget++;
  }

  var h = '<h1 class="page-title">Resource Analytics</h1>';
  h += '<p class="page-subtitle">Comparing resource planner predictions vs actual hours logged</p>';

  if (useGlobalFilter) {
    /* When global date filter is active, show filtered label instead of week nav */
    var range = getDateRange(globalDateFilter);
    var opts = {month:'short', day:'numeric', year:'numeric'};
    var rangeLabel = range ? (range.start.toLocaleDateString('en-US', opts) + ' – ' + range.end.toLocaleDateString('en-US', opts)) : 'Filtered';
    var filteredIndices = getFilteredWeekIndices();
    h += '<div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;padding:10px 16px;background:var(--light-gray);border-radius:8px">';
    h += '<span style="font-size:12px;color:var(--mid-gray)">Showing data for:</span>';
    h += '<span style="font-size:14px;font-weight:600;color:var(--abyss)">' + rangeLabel + '</span>';
    h += '<span style="font-size:11px;color:var(--mid-gray)">(' + filteredIndices.length + ' week' + (filteredIndices.length !== 1 ? 's' : '') + ')</span>';
    h += '</div>';
  } else {
    /* ── Standard Time navigation bar ── */
    var canPrev = (rtTimeMode === 'week') ? idx > 0 : rtGetMonthWeeks(idx)[0] > 0;
    var canNext = (rtTimeMode === 'week') ? idx < RT_WEEKS.length - 1 : rtGetMonthWeeks(idx).slice(-1)[0] < RT_WEEKS.length - 1;

    h += '<div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">';
    h += '<div style="display:flex;gap:4px">';
    h += '<div class="rt-tab' + (rtTimeMode === 'week' ? ' active' : '') + '" onclick="rtTimeMode=\'week\';renderResource()" style="font-size:11px;padding:4px 12px">Weekly</div>';
    h += '<div class="rt-tab' + (rtTimeMode === 'month' ? ' active' : '') + '" onclick="rtTimeMode=\'month\';renderResource()" style="font-size:11px;padding:4px 12px">Monthly</div>';
    h += '</div>';
    h += '<div style="display:flex;align-items:center;gap:8px;flex:1;justify-content:center">';
    h += '<div onclick="' + (canPrev ? 'rtNav(-1)' : '') + '" style="width:28px;height:28px;border-radius:50%;border:1px solid ' + (canPrev ? 'var(--canvas)' : 'var(--light-gray)') + ';display:flex;align-items:center;justify-content:center;cursor:' + (canPrev ? 'pointer' : 'default') + ';color:' + (canPrev ? 'var(--abyss)' : 'var(--canvas)') + ';font-size:14px;user-select:none' + (canPrev ? ';background:var(--white)' : '') + '">&#9664;</div>';
    h += '<div style="font-size:14px;font-weight:600;color:var(--abyss);min-width:200px;text-align:center">';
    if (isFuture) h += '<span style="font-size:9px;background:var(--ocean);color:var(--white);padding:2px 6px;border-radius:3px;margin-right:6px;vertical-align:middle">UPCOMING</span>';
    h += wk.label + '</div>';
    h += '<div onclick="' + (canNext ? 'rtNav(1)' : '') + '" style="width:28px;height:28px;border-radius:50%;border:1px solid ' + (canNext ? 'var(--canvas)' : 'var(--light-gray)') + ';display:flex;align-items:center;justify-content:center;cursor:' + (canNext ? 'pointer' : 'default') + ';color:' + (canNext ? 'var(--abyss)' : 'var(--canvas)') + ';font-size:14px;user-select:none' + (canNext ? ';background:var(--white)' : '') + '">&#9654;</div>';
    h += '</div>';
    h += '<div style="width:120px"></div>'; /* spacer to balance layout */
    h += '</div>';
  }

  /* Summary cards */
  h += '<div class="rt-summary">';
  h += '<div class="rt-scard"><div class="rs-label">Predicted</div><div class="rs-val">' + totPred.toFixed(1) + '</div><div class="rs-sub">total hrs planned</div></div>';
  if (isFuture) {
    h += '<div class="rt-scard"><div class="rs-label">Status</div><div class="rs-val" style="font-size:18px;color:var(--ocean)">Upcoming</div><div class="rs-sub">actuals will fill in</div></div>';
  } else {
    h += '<div class="rt-scard"><div class="rs-label">Actual</div><div class="rs-val">' + totAct.toFixed(1) + '</div><div class="rs-sub">total hrs logged</div></div>';
  }
  h += '<div class="rt-scard"><div class="rs-label">' + (isFuture ? 'People' : 'Accuracy') + '</div><div class="rs-val" style="color:' + (isFuture ? 'var(--abyss)' : accColor(totalAcc)) + '">' + (isFuture ? names.length : totalAcc.toFixed(1) + '%') + '</div><div class="rs-sub">' + (isFuture ? 'with planned allocations' : (totAct > totPred ? '+' : '') + (totAct - totPred).toFixed(1) + ' hrs variance') + '</div></div>';
  h += '<div class="rt-scard"><div class="rs-label">' + (isFuture ? 'Projects' : 'On Target') + '</div>';
  if (isFuture) {
    var projCount;
    if (wk.billableProjects !== undefined) {
      projCount = wk.billableProjects;
    } else {
      var projSet = {};
      for (var i = 0; i < names.length; i++) { var pr = ppl[names[i]].projects || {}; for (var pk in pr) { projSet[pk] = true; } }
      projCount = Object.keys(projSet).length;
    }
    h += '<div class="rs-val">' + projCount + '</div><div class="rs-sub">billable projects</div>';
  } else {
    h += '<div class="rs-val">' + onTarget + '/' + names.length + '</div><div class="rs-sub">people within 80% accuracy</div>';
  }
  h += '</div></div>';

  /* Main tabs: Hours (active) | Freelancers | Out-Of-Pocket */
  h += '<div class="rt-tabs">';
  h += '<div class="rt-tab active">Hours</div>';
  h += '<div class="rt-tab" onclick="rtView=\'freelancers\';renderResource()">Freelancers</div>';
  h += '<div class="rt-tab" onclick="rtView=\'oop\';renderResource()">Out-Of-Pocket</div>';
  h += '<div style="margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mid-gray)">';
  h += '<span>Include Leadership</span>';
  h += '<div onclick="rtShowLeadership=!rtShowLeadership;renderResource()" style="width:36px;height:20px;border-radius:10px;background:' + (rtShowLeadership ? 'var(--ocean)' : 'var(--canvas)') + ';cursor:pointer;position:relative;transition:background .2s"><div style="width:16px;height:16px;border-radius:50%;background:var(--white);position:absolute;top:2px;' + (rtShowLeadership ? 'left:18px' : 'left:2px') + ';transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)"></div></div>';
  h += '</div>';
  h += '</div>';
  /* By Person / By Project sub-toggle */
  h += '<div style="display:flex;gap:6px;margin-bottom:16px">';
  h += '<div class="rt-tab' + (rtView === 'people' ? ' active' : '') + '" onclick="rtView=\'people\';renderResource()" style="font-size:11px;padding:4px 12px">By Person</div>';
  h += '<div class="rt-tab' + (rtView === 'projects' ? ' active' : '') + '" onclick="rtView=\'projects\';renderResource()" style="font-size:11px;padding:4px 12px">By Project</div>';
  h += '</div>';

  if (rtView === 'people') {
    h += renderRTPeople(wk);
  } else {
    h += renderRTProjects(wk);
  }
  document.getElementById('mainContent').innerHTML = h;
}

function accColor(v) { return v >= 80 ? '#2E7D32' : v >= 50 ? 'var(--honey)' : 'var(--ember)'; }
function accClass(v) { return v >= 80 ? 'high' : v >= 50 ? 'mid' : 'low'; }

function renderRTPeople(wk) {
  var ppl = wk.people;
  var allFiltered = rtFilterNames(Object.keys(ppl));
  var names;
  if (rtSortBy === 'accuracy') {
    names = allFiltered.sort(function(a,b){ return rtCalcAcc(ppl[b].predicted||0,ppl[b].actual||0) - rtCalcAcc(ppl[a].predicted||0,ppl[a].actual||0); });
  } else {
    names = allFiltered.sort(function(a,b){ return (ppl[b].actual||ppl[b].predicted||0) - (ppl[a].actual||ppl[a].predicted||0); });
  }
  var maxHrs = 1;
  for (var i = 0; i < names.length; i++) { var m = Math.max(ppl[names[i]].predicted||0, ppl[names[i]].actual||0); if (m > maxHrs) maxHrs = m; }

  var sortIcon = rtSortBy === 'accuracy' ? ' &#9650;' : '';
  var h = '<div class="rt-card"><h3>Team ' + (isFutureWk(wk) ? 'Plan' : 'Accuracy') + '</h3>';
  h += '<div class="rt-row rt-hdr"><div>Person</div><div class="rt-num">Predicted</div><div class="rt-num">Actual</div><div class="rt-num">Diff</div><div>Comparison</div><div class="rt-acc" style="cursor:pointer;user-select:none" onclick="rtSortBy=rtSortBy===\'accuracy\'?\'actual\':\'accuracy\';renderResource()">' + (isFutureWk(wk) ? 'Planned' : 'Accuracy' + sortIcon) + '</div></div>';
  for (var i = 0; i < names.length; i++) {
    var n = names[i], d = ppl[n];
    var pred = d.predicted || 0, act = d.actual || 0;
    var acc = rtCalcAcc(pred, act);
    var diff = act - pred;
    var predW = (pred / maxHrs) * 100;
    var actW = (act / maxHrs) * 100;
    var pc = PC[n] || '#9B9590';
    h += '<div class="rt-row">';
    h += '<div class="rt-name"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + pc + ';margin-right:6px"></span>' + n + '</div>';
    h += '<div class="rt-num" style="color:var(--mid-gray)">' + pred.toFixed(1) + '</div>';
    h += '<div class="rt-num" style="font-weight:600">' + act.toFixed(1) + '</div>';
    h += '<div class="rt-num" style="color:' + (diff >= 0 ? '#2E7D32' : 'var(--ember)') + '">' + (diff >= 0 ? '+' : '') + diff.toFixed(1) + '</div>';
    h += '<div class="rt-bar-wrap"><div class="rt-bar-pred" style="width:' + predW + '%"></div><div class="rt-bar-act" style="width:' + actW + '%;background:' + pc + '"></div></div>';
    h += '<div class="rt-acc ' + accClass(acc) + '">' + acc.toFixed(0) + '%</div>';
    h += '</div>';
  }
  h += '</div>';

  /* Per-person project breakdown */
  h += '<div class="rt-card"><h3>Per-Person Project Breakdown</h3>';
  for (var i = 0; i < names.length; i++) {
    var n = names[i], d = ppl[n];
    var pred = d.predicted || 0, act = d.actual || 0;
    var acc = rtCalcAcc(pred, act);
    var pc = PC[n] || '#9B9590';
    h += '<div style="margin-bottom:20px;padding:14px 0;border-bottom:1px solid var(--light-gray)">';
    h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + pc + '"></span><strong>' + n + '</strong><span style="font-size:11px;color:var(--mid-gray)">' + pred.toFixed(1) + 'h predicted → ' + act.toFixed(1) + 'h actual</span><span class="rt-acc ' + accClass(acc) + '" style="margin-left:auto">' + acc.toFixed(0) + '%</span></div>';
    var projs = d.projects || {};
    var pkeys = Object.keys(projs).sort(function(a,b){ return Math.max(projs[b].p||0,projs[b].a||0) - Math.max(projs[a].p||0,projs[a].a||0); });
    h += '<div style="display:grid;grid-template-columns:200px 60px 60px 60px 1fr;gap:6px;font-size:11px;padding-left:18px">';
    h += '<div style="color:var(--mid-gray)">Project</div><div style="color:var(--mid-gray);text-align:right">Pred</div><div style="color:var(--mid-gray);text-align:right">Act</div><div style="color:var(--mid-gray);text-align:right">Diff</div><div></div>';
    for (var j = 0; j < pkeys.length; j++) {
      var pk = pkeys[j], pv = projs[pk];
      var pp = pv.p || 0, pa = pv.a || 0;
      var pdiff = pa - pp;
      h += '<div style="font-weight:500">' + pk + '</div>';
      h += '<div style="text-align:right;color:var(--mid-gray)">' + pp.toFixed(1) + '</div>';
      h += '<div style="text-align:right;font-weight:600">' + pa.toFixed(1) + '</div>';
      h += '<div style="text-align:right;color:' + (pdiff >= 0 ? '#2E7D32' : 'var(--ember)') + '">' + (pdiff >= 0 ? '+' : '') + pdiff.toFixed(1) + '</div>';
      var mh = Math.max(pp, pa); if (mh === 0) mh = 1;
      h += '<div style="display:flex;gap:2px;align-items:center"><div style="height:6px;border-radius:3px;background:var(--canvas);width:' + (pp/mh*100) + '%"></div><div style="height:6px;border-radius:3px;background:' + pc + ';width:' + (pa/mh*100) + '%"></div></div>';
    }
    h += '</div></div>';
  }
  h += '</div>';

  /* Trevor's external time tracker */
  h += renderTrevorTrackerCard(wk);

  return h;
}

function renderRTProjects(wk) {
  var ppl = wk.people;
  /* Aggregate by project across all people */
  var projAgg = {};
  var names = rtFilterNames(Object.keys(ppl));
  for (var i = 0; i < names.length; i++) {
    var projs = ppl[names[i]].projects || {};
    for (var pk in projs) {
      if (!projAgg[pk]) projAgg[pk] = {predicted:0, actual:0, people:{}};
      projAgg[pk].predicted += projs[pk].p || 0;
      projAgg[pk].actual += projs[pk].a || 0;
      if ((projs[pk].p||0) > 0 || (projs[pk].a||0) > 0) {
        projAgg[pk].people[names[i]] = {p:projs[pk].p||0, a:projs[pk].a||0};
      }
    }
  }

  /* Enrich with code, budget, supabase data */
  var projKeys = Object.keys(projAgg);
  for (var i = 0; i < projKeys.length; i++) {
    var pk = projKeys[i];
    var d = projAgg[pk];
    d.code = PROJECT_CODES[pk] || '';
    var bud = PROJECT_BUDGETS[pk];
    d.budget = bud ? bud.budget : 0;
    d.spent = bud ? bud.spent : 0;
    d.remaining = bud ? bud.remaining : null;
    d.acc = rtCalcAccProject(d.predicted, d.actual);
    d.diff = d.actual - d.predicted;
    /* Look up Supabase budget data */
    d.supa = null;
    if (d.code && SUPA_BUDGETS && SUPA_BUDGETS[d.code]) {
      d.supa = SUPA_BUDGETS[d.code];
      /* Use Supabase laborHours as budget if available */
      if (d.supa.laborHours) d.budget = d.supa.laborHours;
    }
    /* Override spent with live Supabase actuals when available */
    if (d.code && SUPA_ACTUALS && SUPA_ACTUALS[d.code] && SUPA_ACTUALS[d.code].totalHours > 0) {
      d.spent = SUPA_ACTUALS[d.code].totalHours;
      if (d.budget > 0) d.remaining = d.budget - d.spent;
    }
  }

  /* Also add any PROJECT_BUDGETS entries not in projAgg */
  for (var bk in PROJECT_BUDGETS) {
    if (!projAgg[bk]) {
      var bud2 = PROJECT_BUDGETS[bk];
      var code2 = PROJECT_CODES[bk] || '';
      var supa2 = (code2 && SUPA_BUDGETS && SUPA_BUDGETS[code2]) ? SUPA_BUDGETS[code2] : null;
      var budget2 = (supa2 && supa2.laborHours) ? supa2.laborHours : bud2.budget;
      var spent2 = bud2.spent;
      /* Override spent with live Supabase actuals */
      if (code2 && SUPA_ACTUALS && SUPA_ACTUALS[code2] && SUPA_ACTUALS[code2].totalHours > 0) {
        spent2 = SUPA_ACTUALS[code2].totalHours;
      }
      projAgg[bk] = {
        predicted:0, actual:0, people:{}, code:code2,
        budget:budget2, spent:spent2, remaining:budget2 - spent2,
        acc:0, diff:0, supa: supa2
      };
      projKeys.push(bk);
    }
  }

  /* Filter */
  if (rtProjFilter === 'active') {
    projKeys = projKeys.filter(function(pk) {
      var d = projAgg[pk];
      return d.predicted > 0 || d.actual > 0;
    });
  }

  /* Sort by project code */
  projKeys.sort(function(a,b) { return (projAgg[a].code||'zzz').localeCompare(projAgg[b].code||'zzz'); });

  /* Detect non-billable / bizdev projects */
  var NON_BILLABLE_NAMES = ['Non-Billable','Time Off','Private/Leadership','Private/Other','Private/Untracked',
    'Internal Meetings and Skill Development','OS Current','EDO Personal Brand','General Accounts',
    'General Accounts Board','Stryke (SEO tool)','Level 10 Beta','Forge Public Relations',
    'Yardtopia Content Writer','Department Small Tasks','Account Depo','Post Depo','Leadership Meetings'];
  var BIZDEV_NAMES = ['New Opportunities','Business Development','EHS'];

  function isNonBillable(pk, d) {
    if (NON_BILLABLE_NAMES.indexOf(pk) >= 0) return true;
    if (d.code && (d.code === '100_00_00' || d.code.indexOf('100_') === 0)) return true;
    if (d.supa && (d.supa.status === 'nonbillable')) return true;
    return false;
  }
  function isBizDev(pk, d) {
    if (BIZDEV_NAMES.indexOf(pk) >= 0) return true;
    if (d.code && (d.code === '101_00_00' || d.code.indexOf('101_') === 0)) return true;
    if (d.supa && d.supa.status === 'bizdev') return true;
    return false;
  }

  /* Group by client prefix */
  function getClientFromCode(code) {
    if (!code) return '999_Unknown';
    return code.replace(/[a-zA-Z]/, '').split('_')[0];
  }
  function getClientLabel(prefix) {
    if (prefix === '100') return '100 Forge — Non-Billable';
    if (prefix === '101') return '101 New Opportunities';
    for (var ci = 0; ci < CLIENTS.length; ci++) { if (CLIENTS[ci].code === prefix) return CLIENTS[ci].code + ' ' + CLIENTS[ci].name; }
    return prefix;
  }
  var grouped = {};
  for (var i = 0; i < projKeys.length; i++) {
    var pk = projKeys[i], d = projAgg[pk];
    var cp;
    if (isNonBillable(pk, d)) {
      cp = '100';
    } else {
      cp = getClientFromCode(d.code);
      /* If still unknown but we have Supabase data, try to extract client from code */
      if (cp === '999_Unknown' && RT_NAME_TO_CODE[pk]) {
        var fallbackCode = RT_NAME_TO_CODE[pk];
        d.code = fallbackCode;
        cp = getClientFromCode(fallbackCode);
        /* Also try to get SUPA_BUDGETS data with this code */
        if (!d.supa && SUPA_BUDGETS && SUPA_BUDGETS[fallbackCode]) {
          d.supa = SUPA_BUDGETS[fallbackCode];
          if (d.supa.laborHours) d.budget = d.supa.laborHours;
        }
        if (SUPA_ACTUALS && SUPA_ACTUALS[fallbackCode] && SUPA_ACTUALS[fallbackCode].totalHours > 0) {
          d.spent = SUPA_ACTUALS[fallbackCode].totalHours;
          if (d.budget > 0) d.remaining = d.budget - d.spent;
        }
      }
    }
    if (!grouped[cp]) grouped[cp] = [];
    grouped[cp].push(pk);
  }
  var clientPrefixes = Object.keys(grouped).sort();

  /* Toggle helpers */
  window.rtToggleProject = function(pk) { rtExpandedProjects[pk] = !rtExpandedProjects[pk]; renderResource(); };
  window.rtSetProjFilter = function(f) { rtProjFilter = f; renderResource(); };
  window.rtToggleFinancials = function(pk) { rtExpandedFinancials[pk] = !rtExpandedFinancials[pk]; renderResource(); };
  window.rtToggleClient = function(cp) { rtCollapsedClients[cp] = !rtCollapsedClients[cp]; renderResource(); };

  /* ── Build HTML ── */
  var h = '';

  /* Filter toggle */
  h += '<div class="rtp-filter">';
  h += '<div class="rtp-filter-btn' + (rtProjFilter === 'active' ? ' active' : '') + '" onclick="rtSetProjFilter(\'active\')">Active This Week</div>';
  h += '<div class="rtp-filter-btn' + (rtProjFilter === 'all' ? ' active' : '') + '" onclick="rtSetProjFilter(\'all\')">All Projects</div>';
  h += '<span style="font-size:11px;color:var(--mid-gray);margin-left:8px;line-height:28px">' + projKeys.length + ' project' + (projKeys.length !== 1 ? 's' : '') + '</span>';
  h += '</div>';

  /* Total team hours this week (for impact weighting) */
  var totalTeamHrs = 0;
  for (var i = 0; i < projKeys.length; i++) {
    totalTeamHrs += Math.max(projAgg[projKeys[i]].predicted, projAgg[projKeys[i]].actual);
  }
  if (totalTeamHrs < 1) totalTeamHrs = 1;

  /* Weighted accuracy helper:
     accuracy = 1 - |actual - predicted| / max(predicted, actual, 0.5)
     impact   = max(predicted, actual) / totalTeamHrs
     score    = sum(accuracy * impact) / sum(impact)  */
  function calcWeightedAccuracy(projects) {
    var sumWeighted = 0, sumImpact = 0;
    for (var i = 0; i < projects.length; i++) {
      var d = projAgg[projects[i]];
      var pred = d.predicted, act = d.actual;
      var peak = Math.max(pred, act, 0.5);
      var err = Math.abs(act - pred);
      var acc = Math.max(0, 1 - (err / peak));
      var impact = Math.max(pred, act) / totalTeamHrs;
      sumWeighted += acc * impact;
      sumImpact += impact;
    }
    return sumImpact > 0 ? (sumWeighted / sumImpact) * 100 : 0;
  }
  function accLabel(pct) {
    if (pct >= 90) return {text:'Dialed In', color:'#2E7D32', bg:'#E8F5E9'};
    if (pct >= 75) return {text:'Close', color:'#F57F17', bg:'#FFF8E1'};
    if (pct >= 50) return {text:'Off', color:'#E65100', bg:'#FFF3E0'};
    return {text:'Way Off', color:'#C62828', bg:'#FFEBEE'};
  }

  for (var gi = 0; gi < clientPrefixes.length; gi++) {
    var cp = clientPrefixes[gi];
    var grp = grouped[cp];
    var clientLabel = getClientLabel(cp);
    var grpPred = 0, grpAct = 0;
    for (var j = 0; j < grp.length; j++) { grpPred += projAgg[grp[j]].predicted; grpAct += projAgg[grp[j]].actual; }

    /* Weighted accuracy for this client group */
    var grpAcc = calcWeightedAccuracy(grp);
    var grpAccInfo = accLabel(grpAcc);
    var isNBGroup = (cp === '100' || cp === '101');
    var accBadge = (!isNBGroup && (grpPred > 0 || grpAct > 0)) ? '<span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;margin-left:10px;background:' + grpAccInfo.bg + ';color:' + grpAccInfo.color + '">' + grpAcc.toFixed(0) + '% ' + grpAccInfo.text + '</span>' : '';

    /* Client group header */
    var clientOpen = !rtCollapsedClients[cp];
    h += '<div class="rtp-grp-hdr" style="cursor:pointer" onclick="rtToggleClient(\'' + cp + '\')">';
    h += '<div style="display:flex;align-items:center;gap:10px"><span class="rtp-chev' + (clientOpen ? ' open' : '') + '" style="color:rgba(255,255,255,.5)">&#9654;</span><span class="rtp-grp-label">' + clientLabel + '</span>' + accBadge + '</div>';
    h += '<div class="rtp-grp-sub">' + grp.length + ' project' + (grp.length !== 1 ? 's' : '') + ' &middot; ' + grpPred.toFixed(1) + 'h predicted &middot; ' + grpAct.toFixed(1) + 'h actual</div>';
    h += '</div>';

    if (!clientOpen) continue;

    for (var j = 0; j < grp.length; j++) {
      var pk = grp[j], d = projAgg[pk];
      var isExpanded = !!rtExpandedProjects[pk];
      var sb = d.supa;

      /* Detect non-billable / bizdev — suppress budget markers */
      var isNB = isNonBillable(pk, d) || isBizDev(pk, d);

      /* Status badge */
      var statusClass = 'on-track', statusText = 'ON TRACK';
      if (isNB) { statusClass = ''; statusText = ''; }
      else if (d.remaining !== null && d.remaining < 0) { statusClass = 'over'; statusText = 'OVER'; }
      else if (d.remaining !== null && d.budget > 0 && d.remaining < d.budget * 0.15) { statusClass = 'at-risk'; statusText = 'AT RISK'; }
      else if (sb && sb.status === 'closeout') { statusClass = 'closeout'; statusText = 'CLOSEOUT'; }
      else if (sb && sb.status === 'proposed') { statusClass = 'proposed'; statusText = 'PROPOSED'; }
      else if (d.budget === 0 && d.remaining === null) { statusClass = ''; statusText = ''; }

      /* Mini progress bar */
      var barPct = d.budget > 0 ? Math.min((d.spent / d.budget) * 100, 100) : 0;
      var barColor = statusClass === 'over' ? 'var(--ember)' : statusClass === 'at-risk' ? 'var(--honey)' : 'var(--ocean)';

      /* ── Card ── */
      h += '<div class="rtp-card">';

      /* ── Header (always visible) ── */
      h += '<div class="rtp-header" onclick="rtToggleProject(\'' + pk.replace(/'/g, "\\'") + '\')">';
      h += '<div class="rtp-chev' + (isExpanded ? ' open' : '') + '">&#9654;</div>';
      h += '<div class="rtp-code">' + (d.code || '') + '</div>';
      h += '<div class="rtp-name">' + pk + '</div>';
      h += '<div class="rtp-pills">';
      if (statusText) h += '<div class="rtp-pill ' + statusClass + '">' + statusText + '</div>';
      h += '</div>';
      if (d.budget > 0 && !isNB) {
        h += '<div class="rtp-bar-sm"><div class="rtp-bar-sm-fill" style="width:' + barPct + '%;background:' + barColor + '"></div></div>';
      }
      h += '<div class="rtp-mini">';
      if (d.budget > 0 && !isNB) {
        h += '<span>Budget <b>' + d.budget.toFixed(0) + 'h</b></span>';
        h += '<span>Spent <b>' + d.spent.toFixed(1) + 'h</b></span>';
        var remColor = d.remaining < 0 ? 'var(--ember)' : d.remaining < d.budget * 0.15 ? 'var(--honey)' : '#2E7D32';
        h += '<span>Left <b style="color:' + remColor + '">' + d.remaining.toFixed(1) + 'h</b></span>';
      }
      if (d.predicted > 0 || d.actual > 0) {
        h += '<span>Wk <b>' + d.predicted.toFixed(1) + '/' + d.actual.toFixed(1) + '</b></span>';
      }
      h += '</div></div>'; /* end header */

      /* ── Expanded body ── */
      if (isExpanded) {
        h += '<div class="rtp-body">';

        /* ── Key Metrics Row ── */
        h += '<div class="rtp-metrics">';
        if (d.budget > 0 && !isNB) {
          var pctComplete = d.budget > 0 ? Math.round((d.spent / d.budget) * 100) : 0;
          h += '<div class="rtp-metric"><div class="label">Budget</div><div class="value">' + d.budget.toFixed(0) + 'h</div></div>';
          h += '<div class="rtp-metric"><div class="label">Spent</div><div class="value">' + d.spent.toFixed(1) + 'h</div><div class="sub">' + pctComplete + '% of budget</div></div>';
          h += '<div class="rtp-metric"><div class="label">Remaining</div><div class="value" style="color:' + (d.remaining < 0 ? 'var(--ember)' : '#2E7D32') + '">' + d.remaining.toFixed(1) + 'h</div></div>';
        }
        h += '<div class="rtp-metric"><div class="label">This Week Predicted</div><div class="value">' + d.predicted.toFixed(1) + 'h</div></div>';
        h += '<div class="rtp-metric"><div class="label">This Week Actual</div><div class="value">' + d.actual.toFixed(1) + 'h</div></div>';
        if (!isNB) {
          var diffColor = d.diff === 0 ? 'var(--mid-gray)' : d.diff > 0 ? 'var(--ember)' : '#2E7D32';
          h += '<div class="rtp-metric"><div class="label">Diff</div><div class="value" style="color:' + diffColor + '">' + (d.diff >= 0 ? '+' : '') + d.diff.toFixed(1) + 'h</div><div class="sub">Accuracy: ' + d.acc.toFixed(0) + '%</div></div>';
        }
        if (d.budget > 0 && d.actual > 0 && !isNB) {
          var afterWeek = d.remaining - d.actual;
          h += '<div class="rtp-metric"><div class="label">Left After This Week</div><div class="value" style="color:' + (afterWeek < 0 ? 'var(--ember)' : '#2E7D32') + '">' + afterWeek.toFixed(1) + 'h</div></div>';
        }
        h += '</div>';

        /* ── Estimate vs Actual Bar ── */
        h += '<div class="rtp-section"><div class="rtp-section-title">Estimate vs Actual (This Week)</div>';
        var maxBar = Math.max(d.predicted, d.actual, 1);
        h += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">';
        h += '<div style="min-width:65px;font-size:11px;color:var(--mid-gray)">Predicted</div>';
        h += '<div style="flex:1;height:14px;background:var(--light-gray);border-radius:7px;overflow:hidden"><div style="height:100%;width:' + (d.predicted/maxBar*100) + '%;background:var(--canvas);border-radius:7px"></div></div>';
        h += '<div style="min-width:40px;text-align:right;font-size:12px;font-weight:600;color:var(--mid-gray)">' + d.predicted.toFixed(1) + '</div>';
        h += '</div>';
        h += '<div style="display:flex;align-items:center;gap:10px">';
        h += '<div style="min-width:65px;font-size:11px;color:var(--mid-gray)">Actual</div>';
        h += '<div style="flex:1;height:14px;background:var(--light-gray);border-radius:7px;overflow:hidden"><div style="height:100%;width:' + (d.actual/maxBar*100) + '%;background:var(--ocean);border-radius:7px"></div></div>';
        h += '<div style="min-width:40px;text-align:right;font-size:12px;font-weight:600">' + d.actual.toFixed(1) + '</div>';
        h += '</div></div>';

        /* ── Team Breakdown ── */
        var teamNames = Object.keys(d.people);
        if (teamNames.length > 0) {
          teamNames.sort(function(a,b) { return (d.people[b].a || 0) - (d.people[a].a || 0); });
          var teamMax = 1;
          for (var t = 0; t < teamNames.length; t++) { var tm = Math.max(d.people[teamNames[t]].p||0, d.people[teamNames[t]].a||0); if (tm > teamMax) teamMax = tm; }
          h += '<div class="rtp-section"><div class="rtp-section-title">Team Breakdown</div>';
          h += '<div class="rtp-team-row hdr"><div>Person</div><div style="text-align:right">Predicted</div><div style="text-align:right">Actual</div><div style="text-align:right">Diff</div><div></div></div>';
          for (var t = 0; t < teamNames.length; t++) {
            var tn = teamNames[t], tp = d.people[tn];
            var tDiff = (tp.a||0) - (tp.p||0);
            var tDiffColor = tDiff === 0 ? 'var(--mid-gray)' : tDiff > 0 ? 'var(--ember)' : '#2E7D32';
            h += '<div class="rtp-team-row">';
            h += '<div style="font-weight:500">' + tn + '</div>';
            h += '<div style="text-align:right;color:var(--mid-gray)">' + (tp.p||0).toFixed(1) + '</div>';
            h += '<div style="text-align:right;font-weight:600">' + (tp.a||0).toFixed(1) + '</div>';
            h += '<div style="text-align:right;color:' + tDiffColor + '">' + (tDiff >= 0 ? '+' : '') + tDiff.toFixed(1) + '</div>';
            h += '<div><div style="height:8px;background:var(--light-gray);border-radius:4px;overflow:hidden"><div style="height:100%;width:' + ((tp.a||0)/teamMax*100) + '%;background:var(--ocean);border-radius:4px"></div></div></div>';
            h += '</div>';
          }
          h += '</div>';
        }

        /* ── Budget Health ── */
        if (d.budget > 0 && !isNB) {
          h += '<div class="rtp-section"><div class="rtp-section-title">Budget Health</div>';
          var budPct = Math.min((d.spent / d.budget) * 100, 100);
          var budOverPct = d.spent > d.budget ? Math.min(((d.spent - d.budget) / d.budget) * 100, 50) : 0;
          var budBarColor = d.remaining < 0 ? 'var(--ember)' : d.remaining < d.budget * 0.15 ? 'var(--honey)' : 'var(--ocean)';
          h += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">';
          h += '<div style="flex:1;height:14px;background:var(--light-gray);border-radius:7px;overflow:visible;position:relative">';
          h += '<div style="height:100%;width:' + budPct + '%;background:' + budBarColor + ';border-radius:7px;position:absolute;top:0;left:0"></div>';
          if (budOverPct > 0) {
            h += '<div style="height:100%;width:' + budOverPct + '%;background:rgba(211,47,47,0.3);border-radius:0 7px 7px 0;position:absolute;top:0;left:' + budPct + '%;border-left:2px solid var(--ember)"></div>';
          }

/* ── COMPUTE ENGINE (builds RT_WEEKS from native allocations + actuals) ── */
function computeResourceWeeks() {
  var weekMap = {};

  /* 1. Process predicted hours from ALLOCATIONS (per-day format: each alloc has a .date field) */
  var allocs = ALLOCATIONS.allocations || [];
  for (var i = 0; i < allocs.length; i++) {
    var a = allocs[i];
    var dateField = a.date || a.weekOf; /* support both new per-day and old per-week format */
    var monISO = getMondayOfWeek ? getMondayOfWeek(dateField) : (a.weekOf || dateField);
    var mon = new Date(monISO + 'T00:00:00');
    var sun = new Date(mon); sun.setDate(sun.getDate() - 1);
    var sunKey = sun.toISOString().slice(0, 10);
    var hrs = a.hoursPerDay || a.totalHours || 0;

    if (!weekMap[sunKey]) weekMap[sunKey] = { people: {} };
    var wk = weekMap[sunKey];
    if (!wk.people[a.person]) wk.people[a.person] = { predicted: 0, actual: 0, projects: {} };
    wk.people[a.person].predicted += hrs;
    if (!wk.people[a.person].projects[a.project]) wk.people[a.person].projects[a.project] = { p: 0, a: 0 };
    wk.people[a.person].projects[a.project].p += hrs;
  }

  /* 2. Process actual hours from Supabase (preferred) or ACTUALS.weeks (fallback) */
  if (SUPA_LOADED && SUPA_ACTUALS_ALL.length > 0) {
    /* Group by week (Sunday boundary) and person */
    for (var i = 0; i < SUPA_ACTUALS_ALL.length; i++) {
      var a = SUPA_ACTUALS_ALL[i];
      if (!a.work_date || !a.person_name || !a.hours) continue;
      var d = new Date(a.work_date + 'T00:00:00');
      var day = d.getDay();
      var sun = new Date(d); sun.setDate(sun.getDate() - day);
      var sunKey = sun.toISOString().slice(0, 10);

      if (!weekMap[sunKey]) weekMap[sunKey] = { people: {} };
      var wk = weekMap[sunKey];
      var pn = a.person_name;
      if (!wk.people[pn]) wk.people[pn] = { predicted: 0, actual: 0, projects: {} };

      /* Map board_name to project name using RT_BUDGET_ALIASES */
      var projName = a.board_name || a.project_code || 'Unknown';
      /* Clean up board name: remove project code prefix (e.g. "320_30_10 - CES4 Post" -> "CES4 Post") */
      if (projName.match(/^\d+_\d+.*? - /)) {
        projName = projName.replace(/^\d+[\d_A-Za-z]*\s*-\s*/, '');
      }
      /* Apply aliases */
      if (RT_BUDGET_ALIASES[projName]) projName = RT_BUDGET_ALIASES[projName];

      /* Remember name → code mapping from Supabase actuals */
      if (a.project_code && !RT_NAME_TO_CODE[projName]) {
        /* Normalize code through CODE_ALIASES if applicable */
        var rawCode = a.project_code;
        RT_NAME_TO_CODE[projName] = rawCode;
      }

      wk.people[pn].actual += a.hours;
      if (!wk.people[pn].projects[projName]) wk.people[pn].projects[projName] = { p: 0, a: 0 };
      wk.people[pn].projects[projName].a += a.hours;
    }
  } else {
    /* Fallback to ACTUALS.weeks (old format) */
    var weeks = ACTUALS.weeks || [];
    for (var i = 0; i < weeks.length; i++) {
      var aw = weeks[i];
      var mon = new Date(aw.weekOf + 'T00:00:00');
      var sun = new Date(mon); sun.setDate(sun.getDate() - 1);
      var sunKey = sun.toISOString().slice(0, 10);

      if (!weekMap[sunKey]) weekMap[sunKey] = { people: {} };
      var wk = weekMap[sunKey];
      for (var pn in aw.people) {
        if (!wk.people[pn]) wk.people[pn] = { predicted: 0, actual: 0, projects: {} };
        var projs = aw.people[pn].projects || {};
        for (var proj in projs) {
          wk.people[pn].actual += projs[proj];
          if (!wk.people[pn].projects[proj]) wk.people[pn].projects[proj] = { p: 0, a: 0 };
          wk.people[pn].projects[proj].a += projs[proj];
        }
      }
    }
  }

  /* 3. Also merge in any existing RT_WEEKS data from portfolio.json (for backward compat during migration) */
  /* This keeps old actual data visible until it's migrated to actuals.json */

  /* 4. Build sorted array */
  var sundays = Object.keys(weekMap).sort();
  var result = [];
  for (var i = 0; i < sundays.length; i++) {
    var s = sundays[i];
    var sat = new Date(s + 'T00:00:00'); sat.setDate(sat.getDate() + 6);
    var sunD = new Date(s + 'T00:00:00');
    var label = sunD.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' – ' + sat.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    result.push({ label: label, sunday: s, people: weekMap[s].people });
  }

  /* Only replace RT_WEEKS if we have native data; otherwise keep portfolio.json data */
  if (allocs.length > 0 || weeks.length > 0) {
    /* Merge: keep portfolio.json weeks that aren't covered by native data */
    var nativeSundays = {};
    for (var i = 0; i < result.length; i++) nativeSundays[result[i].sunday] = true;
    for (var i = 0; i < RT_WEEKS.length; i++) {
      if (!nativeSundays[RT_WEEKS[i].sunday]) result.push(RT_WEEKS[i]);
    }
    result.sort(function(a, b) { return a.sunday < b.sunday ? -1 : a.sunday > b.sunday ? 1 : 0; });
    RT_WEEKS = result;
  }
}

function getNextMonday() {
  var d = new Date(); var day = d.getDay();

  return d.toISOString().slice(0, 10);
}
function getCurrentMonday() {
  var d = new Date(); var day = d.getDay();
  d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
  return d.toISOString().slice(0, 10);
}
function shiftWeek(mondayISO, delta) {
  var d = new Date(mondayISO + 'T00:00:00');
  d.setDate(d.getDate() + delta * 7);
  return d.toISOString().slice(0, 10);
}
function shiftOopMonth(mondayISO, delta) {
  var d = new Date(mondayISO + 'T00:00:00');
  var m = d.getMonth() + delta, y = d.getFullYear();
  if (m > 11) { m -= 12; y++; }
  if (m < 0)  { m += 12; y--; }
  var first = new Date(y, m, 1);
  var dow = first.getDay();
  // Advance to the first Monday of that month
  first.setDate(first.getDate() + (dow === 1 ? 0 : dow === 0 ? 1 : 8 - dow));
  return first.toISOString().slice(0, 10);
}
function getMondayOfWeek(dateISO) {
  var d = new Date(dateISO + 'T00:00:00'); var day = d.getDay();
  d.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
  return d.toISOString().slice(0, 10);
}
function getWeekDays(mondayISO) {
  var days = []; var d = new Date(mondayISO + 'T00:00:00');
  for (var i = 0; i < 5; i++) {
    days.push(new Date(d).toISOString().slice(0, 10));
    d.setDate(d.getDate() + 1);
  }
  return days;
}

async function saveAllocationToSupabase(person, project, date, hours, weekOf, existingSupaId) {
  if (!sparkAuth.connected) return true; /* not connected — local-only mode, not an error */
  if (!sparkConfig) {
    if (window.furnaceAPI && window.furnaceAPI.sparkReadConfig) {
      sparkConfig = await window.furnaceAPI.sparkReadConfig();
    } else {
      sparkConfig = {

        supabaseAnonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impud2RzY2RkeXF1amppa2VzZHBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyODgxOTEsImV4cCI6MjA4OTg2NDE5MX0.EQueTlfX30ULmpLDF7ijSv0xR0_baAT2kPjYoK_RnpA'
      };
    }
  }
  if (!sparkConfig) return false;
  var base = sparkConfig.supabaseUrl + '/rest/v1/allocations';
  var headers = {
    'apikey': sparkConfig.supabaseAnonKey,
    'Authorization': 'Bearer ' + sparkConfig.supabaseAnonKey,
    'Content-Type': 'application/json'
  };
  /* Detect real Supabase UUIDs vs temporary local IDs (local IDs start with 'a_') */
  var hasRealId = existingSupaId && !String(existingSupaId).startsWith('a_');
  try {
    var resp;
    if (hours <= 0) {
      /* Delete — by real ID if we have it, otherwise by person+project+date */
      var delUrl = hasRealId
        ? base + '?id=eq.' + existingSupaId
        : base + '?person=eq.' + encodeURIComponent(person) + '&project=eq.' + encodeURIComponent(project) + '&date=eq.' + date;
      resp = await fetch(delUrl, { method: 'DELETE', headers: headers });
    } else if (hasRealId) {
      /* Update existing row by its UUID — guaranteed to hit the right row */
      headers['Prefer'] = 'return=minimal';
      resp = await fetch(base + '?id=eq.' + existingSupaId, {
        method: 'PATCH', headers: headers,
        body: JSON.stringify({ hours_per_day: hours, total_hours: hours, week_of: weekOf })
      });
    } else {
      /* New row — insert and get back the real ID so future edits use PATCH */
      headers['Prefer'] = 'return=representation,resolution=merge-duplicates';
      resp = await fetch(base, {
        method: 'POST', headers: headers,
        body: JSON.stringify({ person: person, project: project, date: date, hours_per_day: hours, week_of: weekOf, total_hours: hours })
      });
      if (resp.ok) {
        try {
          var inserted = await resp.json();
          if (inserted && inserted[0] && inserted[0].id) {
            /* Backfill the real ID into our local allocations array */
            var _allocs = ALLOCATIONS.allocations;
            for (var _i = 0; _i < _allocs.length; _i++) {
              if (_allocs[_i].person === person && _allocs[_i].project === project && _allocs[_i].date === date) {
                _allocs[_i].id = inserted[0].id; break;
              }
            }
          }
        } catch(e) {}
        return true;
      }
    }
    if (!resp.ok) {
      var errText = await resp.text();
      console.error('saveAllocationToSupabase HTTP', resp.status, errText);
      return false;
    }
    return true;
  } catch (err) {
    console.error('saveAllocationToSupabase error:', err);
    return false;
  }
}

function oopGetProjectEntries(projName, mondayISO) {
  var days = getWeekDays(mondayISO);
  var entries = OOP_SCHEDULE.entries || [];
  var matched = [];
  for (var i = 0; i < entries.length; i++) {
    if (entries[i].projectName === projName && days.indexOf(entries[i].date) >= 0) matched.push(entries[i]);
  }
  return matched;
}

function oopGetDayEntries(projName, dateISO) {
  var entries = OOP_SCHEDULE.entries || [];
  var matched = [];
  for (var i = 0; i < entries.length; i++) {
    if (entries[i].projectName === projName && entries[i].date === dateISO) matched.push(entries[i]);
  }
  return matched;
}

function oopGetDayTotal(dateISO) {
  var entries = OOP_SCHEDULE.entries || [];
  var total = 0;
  for (var i = 0; i < entries.length; i++) {
    if (entries[i].date === dateISO) total += entries[i].amount || 0;
  }
  return total;
}

function oopGetProjectWeekTotal(projName, mondayISO) {
  var items = oopGetProjectEntries(projName, mondayISO);
  var total = 0;
  for (var i = 0; i < items.length; i++) total += items[i].amount || 0;
  return total;
}

function oopGetWeekGrandTotal(mondayISO) {
  var days = getWeekDays(mondayISO);
  var entries = OOP_SCHEDULE.entries || [];
  var total = 0;
  for (var i = 0; i < entries.length; i++) {
    if (days.indexOf(entries[i].date) >= 0) total += entries[i].amount || 0;
  }
  return total;
}

function oopGetProjectsWithEntries(mondayISO) {
  var days = getWeekDays(mondayISO);
  var entries = OOP_SCHEDULE.entries || [];
  var names = {};

}

/* OOP schedule CRUD — all writes go directly to Supabase payment_schedule table */

async function oopAddEntry(projName, projCode, lineItemName, amount, dateISO, notes, supaOopId) {
  var entry = {
    id: 'oop_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    projectCode: projCode,
    projectName: projName,
    lineItemName: lineItemName,
    amount: amount,
    date: dateISO,
    weekOf: getMondayOfWeek(dateISO),
    paid: false,
    notes: notes || '',
    supaOopId: supaOopId || null
  };
  /* Persist to Supabase */
  await sparkFetch('payment_schedule', '', 'POST', {
    id: entry.id,
    project_code: projCode,
    project_name: projName,
    line_item_name: lineItemName,
    amount: amount,
    scheduled_date: dateISO,
    week_of: entry.weekOf,
    paid: false,
    notes: notes || '',
    supa_oop_id: supaOopId || null
  });
  OOP_SCHEDULE.entries.push(entry);
  return entry;
}

async function oopUpdateEntry(id, updates) {
  var entries = OOP_SCHEDULE.entries || [];
  for (var i = 0; i < entries.length; i++) {
    if (entries[i].id === id) {
      for (var k in updates) { if (updates.hasOwnProperty(k)) entries[i][k] = updates[k]; }
      /* Build Supabase patch — map camelCase → snake_case */
      var patch = {};
      if (updates.amount     !== undefined) patch.amount          = updates.amount;
      if (updates.date       !== undefined) patch.scheduled_date  = updates.date;
      if (updates.weekOf     !== undefined) patch.week_of         = updates.weekOf;
      if (updates.paid       !== undefined) patch.paid            = updates.paid;
      if (updates.notes      !== undefined) patch.notes           = updates.notes;
      if (updates.lineItemName !== undefined) patch.line_item_name = updates.lineItemName;
      if (updates.supaOopId  !== undefined) patch.supa_oop_id     = updates.supaOopId;
      if (Object.keys(patch).length > 0) {
        await sparkFetch('payment_schedule?id=eq.' + id, '', 'PATCH', patch);
      }
      return;
    }
  }
}

async function oopDeleteEntry(id) {
  var entries = OOP_SCHEDULE.entries || [];
  for (var i = 0; i < entries.length; i++) {
    if (entries[i].id === id) {
      entries.splice(i, 1);
      await sparkFetch('payment_schedule?id=eq.' + id, '', 'DELETE');
      return;
    }
  }
}

async function oopTogglePaid(id) {
  var entries = OOP_SCHEDULE.entries || [];
  for (var i = 0; i < entries.length; i++) {
    if (entries[i].id === id) {
      entries[i].paid = !entries[i].paid;
      await sparkFetch('payment_schedule?id=eq.' + id, '', 'PATCH', { paid: entries[i].paid });
      renderOopGrid();
      return;
    }
  }
}

function oopGetPredictedForProject(projectCode) {
  var entries = OOP_SCHEDULE.entries || [];
  var today = new Date().toISOString().slice(0, 10);
  var total = 0;
  for (var i = 0; i < entries.length; i++) {
    if (entries[i].projectCode === projectCode && !entries[i].paid && entries[i].date >= today) {
      total += entries[i].amount || 0;
    }
  }
  return total;
}

async function oopToggleLineItemPaid(supaOopId, newPaid, projCode) {
  /* Update Supabase oop_budget_entries paid + paid_date */
  var today = new Date().toISOString().slice(0, 10);
  var patchData = { paid: newPaid, paid_date: newPaid ? today : null };
  await sparkFetch('oop_budget_entries?id=eq.' + supaOopId, '', 'PATCH', patchData);
  /* Update local cache */
  if (SUPA_BUDGETS && SUPA_BUDGETS[projCode] && SUPA_BUDGETS[projCode]._oopEntries) {
    var entries = SUPA_BUDGETS[projCode]._oopEntries;
    for (var i = 0; i < entries.length; i++) {
      if (entries[i].id === supaOopId) { entries[i].paid = newPaid; entries[i].paid_date = newPaid ? today : null; break; }
    }
    /* Recalc oopSpent */
    var spent = 0;
    for (var i = 0; i < entries.length; i++) {
      if (entries[i].paid && entries[i].is_active !== false) {
        spent += sparkOopItemEffective(entries[i]);
      }
    }
    SUPA_BUDGETS[projCode].oopSpent = spent;
  }
  renderOopProjList();
  renderOopGrid();
}
