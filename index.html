async function oopConfirmSchedule(projName, projCode, itemName, supaOopId) {
  var dateVal = document.getElementById('oopSchedDate').value;
  var amount = parseFloat(document.getElementById('oopSchedAmount').value) || 0;
  var notes = (document.getElementById('oopSchedNotes').value || '').trim();
  if (!dateVal || amount <= 0) { alert('Please pick a date and enter an amount.'); return; }

  /* If amount was adjusted, update the actual_amount in Supabase */
  var origEntries = oopGetProjectLineItems(projCode);
  var origEntry = null;
  for (var i = 0; i < origEntries.length; i++) {
    if (origEntries[i].id === supaOopId) { origEntry = origEntries[i]; break; }
  }
  if (origEntry) {
    var origEffective = sparkOopItemEffective(origEntry);
    if (Math.abs(amount - origEffective) > 0.01) {
      /* Amount was adjusted — save as actual_amount in Supabase */
      await sparkFetch('oop_budget_entries?id=eq.' + supaOopId, '', 'PATCH', { actual_amount: amount });
      origEntry.actual_amount = amount;
    }
  }

  /* Add to OOP schedule */
  oopAddEntry(projName, projCode, itemName, amount, dateVal, notes, supaOopId);

  var overlay = document.getElementById('oopModalOverlay');
  if (overlay) overlay.remove();
  renderOopProjList();
  renderOopGrid();
}

function oopGetProjectLineItems(projCode) {
  /* Fetch OOP line items from SUPA_BUDGETS cache for this project */
  if (!SUPA_BUDGETS || !SUPA_BUDGETS[projCode]) return [];
  var sb = SUPA_BUDGETS[projCode];
  /* The oopEntries are stored during loadSupabaseData */
  return sb._oopEntries || [];
}

function renderOopProjList() {
  var el = document.getElementById('oopProjListInner');
  if (!el) return;
  var projects = getProjectList();
  var search = (oopProjSearch || '').toLowerCase();

  /* Build sets: projects with OOP schedule entries AND projects with OOP budget entries in Supabase */
  var hasSchedule = {};
  var entries = OOP_SCHEDULE.entries || [];
  for (var i = 0; i < entries.length; i++) hasSchedule[entries[i].projectName] = true;

  var hasOopBudget = {};
  if (SUPA_BUDGETS) {
    for (var code in SUPA_BUDGETS) {
      var sb = SUPA_BUDGETS[code];
      if ((sb.oopTotal || 0) > 0 || (sb.oopEffective || 0) > 0) {
        for (var pi = 0; pi < projects.length; pi++) {
          if (projects[pi].code === code) { hasOopBudget[projects[pi].name] = true; break; }
        }
      }
    }
  }

  var h = '';
  var lastClient = '';
  var shown = 0;
  for (var i = 0; i < projects.length; i++) {
    var p = projects[i];
    if (!search && !hasOopBudget[p.name] && !hasSchedule[p.name]) continue;
    if (search && p.name.toLowerCase().indexOf(search) < 0 && p.code.toLowerCase().indexOf(search) < 0 && p.client.toLowerCase().indexOf(search) < 0) continue;
    if (p.client !== lastClient) {
      h += '<div class="aps-client"><span style="color:' + p.clientColor + '">&#9679;</span> ' + p.clientCode + ' ' + p.client + '</div>';
      lastClient = p.client;
    }
    var isActive = oopSelectedProject === p.name;
    var schedCount = 0;
    for (var si = 0; si < entries.length; si++) { if (entries[si].projectName === p.name) schedCount++; }

    h += '<div class="aps-item' + (isActive ? ' active' : '') + '" onclick="oopSelectedProject=' + (isActive ? 'null' : '\'' + p.name.replace(/'/g, "\\'") + '\'') + ';renderOopProjList();renderOopGrid()">';
    h += '<span style="font-size:9px;margin-right:4px">' + (isActive ? '\u25BC' : '\u25B6') + '</span>';
    h += '<span class="aps-code">' + p.code + '</span> ' + p.name;
    if (schedCount > 0) h += '<span style="margin-left:auto;background:#F57F17;color:white;font-size:9px;padding:1px 5px;border-radius:8px;font-weight:600">' + schedCount + '</span>';
    h += '</div>';

    /* Expanded: show line items from snapshot */
    if (isActive) {
      var lineItems = oopGetProjectLineItems(p.code);
      var activeItems = [];
      for (var li = 0; li < lineItems.length; li++) {
        var oi = lineItems[li];
        if (oi.is_active === false) continue;
        /* Calculate effective value — use same cascade as snapshot (actual → adjusted → planned) */
        var effective = sparkOopItemEffective(oi);
        if (effective > 0) activeItems.push({id: oi.id, name: oi.line_item_name || 'Unnamed', effective: effective, paid: oi.paid || false, supaId: oi.id});
      }

      if (activeItems.length > 0) {
        h += '<div style="background:rgba(0,0,0,.03);padding:6px 8px 8px 20px;border-bottom:1px solid var(--canvas)">';
        for (var ai = 0; ai < activeItems.length; ai++) {
          var item = activeItems[ai];
          /* Check if this item is already scheduled */
          var isScheduled = false;
          for (var si = 0; si < entries.length; si++) {
            if (entries[si].projectCode === p.code && entries[si].lineItemName === item.name && entries[si].supaOopId === item.supaId) {
              isScheduled = true; break;
            }
          }
          var paidBg = item.paid ? 'background:rgba(46,125,50,.1);' : '';
          h += '<div style="display:flex;align-items:center;gap:6px;padding:4px 0;font-size:11px;' + paidBg + 'border-radius:4px;padding:4px 6px;margin-bottom:2px">';
          /* Paid checkbox — syncs to Supabase */
          h += '<input type="checkbox" ' + (item.paid ? 'checked' : '') + ' onclick="event.stopPropagation();oopToggleLineItemPaid(\'' + item.supaId + '\',' + !item.paid + ',\'' + p.code + '\')" style="cursor:pointer" title="Mark as paid">';
          h += '<span style="flex:1;' + (item.paid ? 'text-decoration:line-through;opacity:.5' : '') + '">' + item.name + '</span>';
          h += '<span style="font-weight:600;font-variant-numeric:tabular-nums;' + (item.paid ? 'color:#2E7D32' : '') + '">$' + Math.round(item.effective).toLocaleString() + '</span>';
          /* Schedule button */
          if (!isScheduled && !item.paid) {
            h += '<button onclick="event.stopPropagation();oopScheduleLineItem(\'' + p.name.replace(/'/g, "\\'") + '\',\'' + p.code + '\',\'' + item.name.replace(/'/g, "\\'") + '\',' + item.effective + ',\'' + item.supaId + '\')" style="padding:2px 6px;border-radius:4px;border:1px solid var(--ocean);background:transparent;color:var(--ocean);cursor:pointer;font-size:9px;font-weight:600;white-space:nowrap" title="Schedule payment date">📅</button>';
          } else if (isScheduled) {
            h += '<span style="font-size:9px;color:#F57F17;font-weight:600" title="Already scheduled">\u2713 Sched</span>';
          }
          h += '</div>';
        }
        h += '</div>';
      } else {
        h += '<div style="padding:8px 20px;font-size:10px;color:var(--mid-gray)">No OOP line items with cost in snapshot</div>';
      }
    }
    shown++;
  }
  if (!shown && search) h = '<div style="padding:14px;font-size:11px;color:var(--mid-gray)">No projects match.</div>';

    if (e.projectName !== oopSelectedProject) return false;
    var ed = new Date(e.date + 'T00:00:00');
    return ed.getMonth() === curMonth && ed.getFullYear() === baseDate.getFullYear();
  });
  for (var i = 0; i < monthEntries.length; i++) monthTotal += monthEntries[i].amount || 0;

  h += '<div style="grid-column:1/6;background:var(--abyss);color:var(--white);padding:10px 14px;font-size:11px;font-weight:600">Month Total</div>';
  h += '<div style="background:var(--abyss);color:var(--honey);padding:10px;font-size:14px;font-weight:700;text-align:center">$' + Math.round(monthTotal).toLocaleString() + '</div>';

  h += '</div>';

  /* Entry list below */
  h += renderOopEntryList(projCode);
  el.innerHTML = h;
}

/* (week view day cells rendered inline in renderOopGridWeek) */

    h += '<td style="padding:6px 8px;color:' + _dmMid + ';font-size:11px">' + (ent.notes || '') + '</td>';

function renderOopFooter() {

}

/* ══════════════════════════════════════════════
   FREELANCER PLANNER (Calendar-based)
   ══════════════════════════════════════════════ */
var flProjFilter = null;
var flProjSearch = '';
var flPersonFilter = null;
var flViewMode = 'week';
var flWeekOf = null;

/* Returns true if week_label is an ISO date (YYYY-MM-DD) — used to place entry on calendar */
function flIsDateLabel(lbl) { return /^\d{4}-\d{2}-\d{2}$/.test(lbl || ''); }

/* Return unique freelancers from a budget's _flEntries (exclude __budget__ sentinels) */
function flGetFreelancers(sb) {
  var seen = {}, result = [];
  var entries = sb._flEntries || [];
  for (var i = 0; i < entries.length; i++) {
    var e = entries[i];
    if (e.week_label === '__budget__') continue;
    var tid = e.team_member_id;
    if (!seen[tid]) { seen[tid] = true; result.push({ tmId: tid, name: e._name || 'Unknown', rate: e.rate || 0 }); }
  }
  return result;
}

/* Find the calendar entry for a specific freelancer on a specific week (by ISO date label) */
function flGetWeekEntry(sb, tmId, weekOfISO) {
  var entries = sb._flEntries || [];
  for (var i = 0; i < entries.length; i++) {
    var e = entries[i];
    if (e.team_member_id === tmId && e.week_label === weekOfISO) return e;
  }
  return null;
}

var _FL_MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function renderFreelancerPlanner() {
  if (!flWeekOf) flWeekOf = getCurrentMonday();
  var mc = document.getElementById('mainContent');
  var h = mc.innerHTML; /* keep tab bar */

  h += '<div class="oop-planner-layout">';

  /* Sidebar */
  h += '<div class="alloc-proj-sidebar">';
  h += '<div class="aps-header">Projects</div>';
  h += '<input class="aps-search" type="text" placeholder="Search projects..." value="' + (flProjSearch || '') + '" oninput="flProjSearch=this.value;renderFlProjList()" id="flProjSearchInput">';
  h += '<div id="flProjListInner"></div>';
  h += '</div>';

  /* Main grid area */
  h += '<div class="oop-planner-grid-area">';
  h += '<div class="oop-planner-toolbar">';
  if (flViewMode === 'month') {
    h += '<button onclick="flWeekOf=shiftOopMonth(flWeekOf,-1);renderFlCalGrid()">&#9664;</button>';
    h += '<div class="at-label" id="flWeekLabel"></div>';
    h += '<button onclick="flWeekOf=shiftOopMonth(flWeekOf,1);renderFlCalGrid()">&#9654;</button>';
  } else {
    h += '<button onclick="flWeekOf=shiftWeek(flWeekOf,-5);renderFlCalGrid()">&#9664;</button>';
    h += '<div class="at-label" id="flWeekLabel"></div>';
    h += '<button onclick="flWeekOf=shiftWeek(flWeekOf,5);renderFlCalGrid()">&#9654;</button>';
  }
  h += '<button onclick="flWeekOf=getCurrentMonday();renderFlCalGrid()" style="font-size:11px">Today</button>';
  h += '<span id="flSaveStatus" class="alloc-save-status"></span>';
  h += '<div class="alloc-view-toggle" style="margin-left:auto">';
  h += '<button class="' + (flViewMode === 'week' ? 'active' : '') + '" onclick="flViewMode=\'week\';renderFreelancerPlanner()">Week</button>';
  h += '<button class="' + (flViewMode === 'month' ? 'active' : '') + '" onclick="flViewMode=\'month\';renderFreelancerPlanner()">Month</button>';
  h += '</div>';
  h += '</div>';
  h += '<div class="oop-planner-scroll" id="flGridScroll"></div>';
  h += '<div class="oop-footer" id="flFooter"></div>';
  h += '</div>'; /* end grid area */
  h += '</div>'; /* end layout */

  mc.innerHTML = h;
  renderFlProjList();
  renderFlCalGrid();
}

function renderFlProjList() {
  var el = document.getElementById('flProjListInner');
  if (!el) return;
  var search = (flProjSearch || '').toLowerCase();
  var h = '';

  if (!SUPA_BUDGETS || !CLIENTS) { el.innerHTML = '<div style="padding:14px;font-size:11px;color:var(--mid-gray)">Loading\u2026</div>'; return; }
  var lastClient = '';
  var shown = 0;
  for (var ci = 0; ci < CLIENTS.length; ci++) {
    var client = CLIENTS[ci];
    for (var pi = 0; pi < client.projects.length; pi++) {
      var p = client.projects[pi];
      var sb = SUPA_BUDGETS[p.code];
      if (!sb || !sb._flEntries || !sb._flEntries.length) continue;
      if (search && p.name.toLowerCase().indexOf(search) < 0 && p.code.toLowerCase().indexOf(search) < 0) continue;
      if (client.name !== lastClient) {
        h += '<div class="aps-client">' + p.code.split('_')[0] + ' ' + client.name + '</div>';
        lastClient = client.name;
      }
      var flEntries = (sb._flEntries || []).filter(function(e) { return e.week_label !== '__budget__'; });
      var calCnt = flEntries.filter(function(e) { return flIsDateLabel(e.week_label); }).length;
      var unpaidCnt = flEntries.filter(function(e) { return !e.paid && (e.hours || 0) > 0; }).length;
      var isActive = flProjFilter === p.code;
      h += '<div class="aps-item' + (isActive ? ' active' : '') + '" onclick="flProjFilter=\'' + p.code + '\';renderFlProjList();renderFlCalGrid()">';
      h += '<span style="font-size:9px;margin-right:4px">' + (isActive ? '\u25BC' : '\u25B6') + '</span>';
      h += '<span class="aps-code">' + p.code + '</span> ' + p.name;
      if (calCnt > 0) h += '<span style="margin-left:auto;background:#5B4A8A;color:white;font-size:9px;padding:1px 5px;border-radius:8px;font-weight:600">' + calCnt + '</span>';
      else if (unpaidCnt > 0) h += '<span style="margin-left:auto;color:#CE93D8;font-size:9px;font-weight:700">unpaid</span>';
      h += '</div>';
      /* Expanded freelancer breakdown when project is selected */
      if (isActive) {
        var _fls = flGetFreelancers(sb);
        for (var _fli = 0; _fli < _fls.length; _fli++) {
          var _fl = _fls[_fli];
          var _budgHrs = 0, _allocHrs = 0, _paidHrs = 0;
          for (var _fei = 0; _fei < sb._flEntries.length; _fei++) {
            var _fe = sb._flEntries[_fei];
            if (_fe.team_member_id !== _fl.tmId) continue;
            if (_fe.week_label === '__budget__') { _budgHrs += _fe.hours || 0; }
            else if (flIsDateLabel(_fe.week_label || '')) { _allocHrs += _fe.hours || 0; if (_fe.paid) _paidHrs += _fe.hours || 0; }
          }
          var _budg$ = _budgHrs * _fl.rate, _alloc$ = _allocHrs * _fl.rate, _paid$ = _paidHrs * _fl.rate;
          var _over = _budgHrs > 0 && _allocHrs > _budgHrs;
          h += '<div style="padding:8px 10px 8px 22px;border-bottom:1px solid rgba(91,74,138,.08);background:rgba(91,74,138,.04)">';
          h += '<div style="font-size:11px;font-weight:700;color:#CE93D8;margin-bottom:5px">' + _fl.name + '</div>';
          h += '<div style="font-size:10px;color:var(--mid-gray);margin-bottom:2px">$' + Math.round(_fl.rate).toLocaleString() + '/hr</div>';
          if (_budgHrs > 0) {
            h += '<div style="display:flex;justify-content:space-between;font-size:10px;margin-top:4px"><span style="color:var(--mid-gray)">Budget</span><span style="font-weight:600">$' + Math.round(_budg$).toLocaleString() + ' &middot; ' + _budgHrs + 'h</span></div>';
          }
          h += '<div style="display:flex;justify-content:space-between;font-size:10px;margin-top:2px"><span style="color:var(--mid-gray)">Allocated</span><span style="font-weight:600;color:' + (_over ? 'var(--ember)' : 'var(--abyss)') + '">$' + Math.round(_alloc$).toLocaleString() + ' &middot; ' + _allocHrs.toFixed(1) + 'h</span></div>';
          if (_paidHrs > 0) {
            h += '<div style="display:flex;justify-content:space-between;font-size:10px;margin-top:2px"><span style="color:#2E7D32">&#10003; Paid</span><span style="font-weight:600;color:#2E7D32">$' + Math.round(_paid$).toLocaleString() + ' &middot; ' + _paidHrs.toFixed(1) + 'h</span></div>';
          }
          if (_budgHrs > 0) {
            var _rem = _budgHrs - _allocHrs;
            var _remClr = _rem < 0 ? 'var(--ember)' : 'var(--mid-gray)';
            h += '<div style="display:flex;justify-content:space-between;font-size:10px;margin-top:2px"><span style="color:' + _remClr + '">Remaining</span><span style="font-weight:600;color:' + _remClr + '">$' + Math.round(Math.abs(_rem * _fl.rate)).toLocaleString() + ' &middot; ' + Math.abs(_rem).toFixed(1) + 'h' + (_rem < 0 ? ' over' : '') + '</span></div>';
          }
          h += '</div>';
        }
      }
      shown++;
    }
  }
  if (!shown && search) h = '<div style="padding:14px;font-size:11px;color:var(--mid-gray)">No projects match.</div>';
  if (!shown && !search) h = '<div style="padding:14px;font-size:11px;color:var(--mid-gray)">No projects with freelancer data. Add freelancers to a project budget first.</div>';
  el.innerHTML = h;
}

/* ── FL Calendar Grid ── */
function renderFlCalGrid() {
  var el = document.getElementById('flGridScroll');
  var lbl = document.getElementById('flWeekLabel');
  if (!el) return;
  if (!flProjFilter) {
    if (lbl) lbl.innerHTML = '';
    el.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--mid-gray);font-size:14px">Select a project from the sidebar to plan freelancer weeks</div>';
    renderFlFooter();
    return;
  }
  if (flViewMode === 'month') renderFlCalMonth(el, lbl);
  else renderFlCalWeeks(el, lbl);
  renderFlFooter();
}

function renderFlCalWeeks(el, lbl) {
  var _isDark   = document.documentElement.classList.contains('dark');
  var _dmBorder = _isDark ? 'var(--dm-border)'     : 'var(--canvas)';
  var _dmSurf   = _isDark ? 'var(--dm-surface)'    : 'var(--white)';
  var _dmMid    = _isDark ? 'var(--dm-text-muted)' : 'var(--mid-gray)';
  var _dmText   = _isDark ? 'var(--dm-text)'        : 'var(--abyss)';
  var sb = SUPA_BUDGETS && SUPA_BUDGETS[flProjFilter];
  if (!sb || !sb._flEntries || !sb._flEntries.length) {
    if (lbl) lbl.innerHTML = '';
    el.innerHTML = '<div style="padding:40px;text-align:center;color:var(--mid-gray)"><div style="font-size:14px;font-weight:600">No freelancer entries</div><div style="font-size:12px;margin-top:6px">Add freelancers to this project\'s Budget Snapshot first.</div></div>';
    return;
  }
  var weeks = []; for (var w = 0; w < 5; w++) weeks.push(shiftWeek(flWeekOf, w));
  var fd = new Date(weeks[0] + 'T00:00:00'), ld = new Date(weeks[4] + 'T00:00:00');
  ld.setDate(ld.getDate() + 4);
  if (lbl) lbl.innerHTML = _FL_MON[fd.getMonth()] + ' ' + fd.getDate() + ' &ndash; ' + _FL_MON[ld.getMonth()] + ' ' + ld.getDate() + ', ' + ld.getFullYear();
  var freelancers = flGetFreelancers(sb);
  if (!freelancers.length) { el.innerHTML = '<div style="padding:40px;text-align:center;color:var(--mid-gray)">No freelancers found for this project.</div>'; return; }
  var todayMon = getCurrentMonday();
  var gridCols = '150px'; for (var w = 0; w < 5; w++) gridCols += ' 1fr'; gridCols += ' 80px';
  var h = '<div class="oop-grid" style="grid-template-columns:' + gridCols + '">';
  /* Header */
  h += '<div class="oop-corner" style="font-size:10px;color:' + _dmMid + '">Freelancer</div>';
  for (var w = 0; w < 5; w++) {
    var wd = new Date(weeks[w] + 'T00:00:00'), fd2 = new Date(weeks[w] + 'T00:00:00'); fd2.setDate(fd2.getDate() + 4);
    var isNow = weeks[w] === todayMon;
    h += '<div class="oop-col-hdr" style="' + (isNow ? 'background:rgba(48,109,124,.08)' : '') + ';text-align:center;flex-direction:column">';
    h += '<span class="oop-day" style="' + (isNow ? 'color:var(--ocean)' : '') + '">' + _FL_MON[wd.getMonth()] + ' ' + wd.getDate() + '</span>';
    h += '<span style="font-size:9px;color:' + _dmMid + '">&ndash;' + _FL_MON[fd2.getMonth()] + ' ' + fd2.getDate() + '</span>';
    h += '</div>';
  }
  h += '<div class="oop-col-hdr" style="font-size:10px;text-align:center">Total</div>';
  /* FL rows */
  for (var fi = 0; fi < freelancers.length; fi++) {
    var fl = freelancers[fi], rowTotal = 0;
    h += '<div class="oop-row-hdr" style="flex-direction:column;align-items:flex-start;padding:8px 12px;gap:2px">';
    h += '<div style="font-weight:600;font-size:12px">' + fl.name + '</div>';
    h += '<div style="font-size:10px;color:#5B4A8A">$' + Math.round(fl.rate) + '/hr</div></div>';
    for (var w = 0; w < 5; w++) {
      var entry = flGetWeekEntry(sb, fl.tmId, weeks[w]);
      var isNow = weeks[w] === todayMon;
      h += '<div class="oop-cell" style="' + (isNow ? 'background:rgba(48,109,124,.04)' : '') + ';cursor:pointer" onclick="flShowCalModal(\'' + flProjFilter + '\',\'' + fl.tmId + '\',\'' + weeks[w] + '\',' + (entry ? '\'' + entry.id + '\'' : 'null') + ')">';
      if (entry && (entry.hours || 0) > 0) {
        var amt = (entry.hours || 0) * (entry.rate || fl.rate); rowTotal += amt;
        h += '<div class="oop-chip ' + (entry.paid ? 'paid' : 'scheduled') + '" style="display:block;text-align:center;padding:8px 6px">';
        h += '<div style="font-size:14px;font-weight:700">' + parseFloat(entry.hours).toFixed(1) + ' hrs</div>';
        h += '<div style="font-size:10px">$' + Math.round(amt).toLocaleString() + '</div>';
        h += '<div style="font-size:9px;margin-top:2px">' + (entry.paid ? '&#10003; Paid' : 'Unpaid') + '</div></div>';
      } else { h += '<div class="oop-cell-empty"><span style="font-size:18px;color:' + _dmBorder + '">+</span></div>'; }
      h += '</div>';
    }
    h += '<div class="oop-total-cell">' + (rowTotal > 0 ? '$' + Math.round(rowTotal).toLocaleString() : '&mdash;') + '</div>';
  }
  /* Grand total row */
  h += '<div class="oop-row-hdr" style="font-size:10px;color:' + _dmMid + '">All FLs</div>';
  var grandTotal = 0;
  for (var w = 0; w < 5; w++) {
    var colTot = 0;
    for (var fi = 0; fi < freelancers.length; fi++) { var ent = flGetWeekEntry(sb, freelancers[fi].tmId, weeks[w]); if (ent) colTot += (ent.hours || 0) * (ent.rate || freelancers[fi].rate); }
    grandTotal += colTot;
    h += '<div class="oop-grand-total" style="background:var(--abyss);color:var(--white);border-bottom:1px solid rgba(255,255,255,.1);text-align:center">' + (colTot > 0 ? '$' + Math.round(colTot).toLocaleString() : '&mdash;') + '</div>';
  }
  h += '<div class="oop-grand-total" style="text-align:center">$' + Math.round(grandTotal).toLocaleString() + '</div></div>';
  h += flRenderUnscheduled(sb, freelancers, _dmSurf, _dmBorder, _dmMid, _dmText);
  el.innerHTML = h;
}

function renderFlCalMonth(el, lbl) {
  var _isDark   = document.documentElement.classList.contains('dark');
  var _dmBorder = _isDark ? 'var(--dm-border)'     : 'var(--canvas)';
  var _dmSurf   = _isDark ? 'var(--dm-surface)'    : 'var(--white)';
  var _dmMid    = _isDark ? 'var(--dm-text-muted)' : 'var(--mid-gray)';
  var _dmText   = _isDark ? 'var(--dm-text)'        : 'var(--abyss)';
  var sb = SUPA_BUDGETS && SUPA_BUDGETS[flProjFilter];
  if (!sb || !sb._flEntries || !sb._flEntries.length) {
    if (lbl) lbl.innerHTML = '';
    el.innerHTML = '<div style="padding:40px;text-align:center;color:var(--mid-gray)">No freelancer entries for this project.</div>'; return;
  }
  var baseDate = new Date(flWeekOf + 'T00:00:00');
  var month = baseDate.getMonth(), year = baseDate.getFullYear();
  var monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  if (lbl) lbl.innerHTML = monthNames[month] + ' ' + year;

  /* Grid start: Monday on or before 1st of month */
  var firstOfMonth = new Date(year, month, 1);
  var fdow = firstOfMonth.getDay();
  var gridStart = new Date(firstOfMonth);
  gridStart.setDate(gridStart.getDate() - (fdow === 0 ? 6 : fdow - 1));
  var lastDay = new Date(year, month + 1, 0);

  var freelancers = flGetFreelancers(sb);
  if (!freelancers.length) { el.innerHTML = '<div style="padding:40px;text-align:center;color:var(--mid-gray)">No freelancers found for this project.</div>'; return; }

  var _todayISO = new Date().toISOString().slice(0, 10);
  var _dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var h = '';

  /* Day-of-week header */
  h += '<div style="display:grid;grid-template-columns:repeat(7,1fr);border-radius:8px 8px 0 0;overflow:hidden;border:1px solid ' + _dmBorder + ';border-bottom:none">';
  for (var _di = 0; _di < 7; _di++) {
    var _isWknd = _di >= 5;
    h += '<div style="padding:6px 0;text-align:center;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:' + (_isWknd ? _dmMid : _dmText) + ';background:rgba(91,74,138,.06);border-right:' + (_di < 6 ? '1px solid ' + _dmBorder : 'none') + '">' + _dayNames[_di] + '</div>';
  }
  h += '</div>';

  /* Calendar day cells */
  h += '<div style="display:grid;grid-template-columns:repeat(7,1fr);border:1px solid ' + _dmBorder + ';border-radius:0 0 8px 8px;overflow:hidden">';
  var cur = new Date(gridStart);
  var cellIdx = 0;
  while (true) {
    var dayISO = cur.toISOString().slice(0, 10);
    var inMonth = cur.getMonth() === month;
    var isToday = dayISO === _todayISO;
    var isWeekend = cur.getDay() === 0 || cur.getDay() === 6;
    var colIdx = cellIdx % 7;
    if (!inMonth && cur > lastDay && colIdx === 0) break;
    var cellBg = isToday ? 'rgba(48,109,124,.08)' : (isWeekend ? (_isDark ? 'rgba(255,255,255,.01)' : 'rgba(0,0,0,.02)') : 'transparent');
    h += '<div style="min-height:90px;padding:4px;background:' + cellBg + ';border-right:' + (colIdx < 6 ? '1px solid ' + _dmBorder : 'none') + ';border-bottom:1px solid ' + _dmBorder + ';opacity:' + (inMonth ? '1' : '.35') + ';cursor:pointer" onclick="flDayClick(\'' + flProjFilter + '\',\'' + dayISO + '\')">';
    h += '<div style="font-size:12px;font-weight:' + (isToday ? '700' : '500') + ';color:' + (isToday ? 'var(--ocean)' : _dmText) + ';margin-bottom:3px">' + cur.getDate() + '</div>';
    /* FL chips for this day */
    for (var fi = 0; fi < freelancers.length; fi++) {
      var fl = freelancers[fi];
      var entry = flGetWeekEntry(sb, fl.tmId, dayISO);
      if (!entry || !(entry.hours > 0)) continue;
      var amt = (entry.hours || 0) * (entry.rate || fl.rate);
      var chipBg = entry.paid ? 'rgba(46,125,50,.15)' : 'rgba(91,74,138,.15)';
      var chipClr = entry.paid ? '#2E7D32' : '#5B4A8A';
      var shortName = fl.name.split(' ')[0];
      h += '<div onclick="event.stopPropagation();flShowCalModal(\'' + flProjFilter + '\',\'' + fl.tmId + '\',\'' + dayISO + '\',\'' + entry.id + '\')" style="background:' + chipBg + ';color:' + chipClr + ';border-radius:3px;padding:2px 4px;margin-bottom:2px;font-size:9px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + shortName + ' \u00b7 ' + parseFloat(entry.hours).toFixed(1) + 'h \u00b7 $' + Math.round(amt).toLocaleString() + '</div>';
    }
    h += '</div>';
    cur.setDate(cur.getDate() + 1);
    cellIdx++;
  }
  h += '</div>';

  h += flRenderUnscheduled(sb, freelancers, _dmSurf, _dmBorder, _dmMid, _dmText);
  el.innerHTML = h;
}

async function flSaveCalModal(projCode, tmId, editId, budgetId) {
  var weekOfEl = document.getElementById('flCalWeekOf');
  var weekOfISO = (weekOfEl && weekOfEl.value) ? getMondayOfWeek(weekOfEl.value) : getCurrentMonday();
  var hours = parseFloat(document.getElementById('flCalHours').value) || 0;
  var rate = parseFloat(document.getElementById('flCalRate').value) || 0;
  var notes = (document.getElementById('flCalNotes').value || '').trim();
  var paidEl = document.getElementById('flCalPaid');
  var paid = paidEl ? paidEl.checked : false;
  var paidDateEl = document.getElementById('flCalPaidDate');
  var paidDate = (paid && paidDateEl && paidDateEl.value) ? paidDateEl.value : (paid ? new Date().toISOString().slice(0, 10) : null);

  var overlay = document.getElementById('flCalModalOverlay');
  if (overlay) overlay.remove();

  var sb = SUPA_BUDGETS && SUPA_BUDGETS[projCode];
  if (!sb) return;
  var statusEl = document.getElementById('flSaveStatus');
  if (statusEl) statusEl.textContent = 'Saving\u2026';

  if (editId) {
    var patch = { week_label: weekOfISO, hours: hours, rate: rate, notes: notes || null, paid: paid, paid_date: paidDate };
    await sparkFetch('freelancer_budget_entries?id=eq.' + editId, '', 'PATCH', patch);
    var entries = sb._flEntries || [];
    for (var i = 0; i < entries.length; i++) {
      if (entries[i].id === editId) {
        entries[i].week_label = weekOfISO; entries[i].hours = hours; entries[i].rate = rate;
        entries[i].notes = notes || null; entries[i].paid = paid; entries[i].paid_date = paidDate; break;
      }
    }
  } else {
    var result = await sparkFetch('freelancer_budget_entries', '', 'POST', {
      budget_id: budgetId, team_member_id: tmId,
      week_label: weekOfISO, hours: hours, rate: rate,
      paid: false, notes: notes || null, display_order: (sb._flEntries || []).length
    });
    if (result && result.length) {
      result[0]._name = null;
      for (var ti = 0; ti < (FURNACE_TEAM_MEMBERS || []).length; ti++) {
        if (FURNACE_TEAM_MEMBERS[ti].id === tmId) { result[0]._name = FURNACE_TEAM_MEMBERS[ti].name; break; }
      }
      if (!result[0]._name) {
        var ex = (sb._flEntries || []).filter(function(e) { return e.team_member_id === tmId; });
        result[0]._name = ex.length ? (ex[0]._name || 'Unknown') : 'Unknown';
      }
      sb._flEntries.push(result[0]);
    }
  }
  flRecomputeTotals(sb);
  if (statusEl) { statusEl.textContent = 'Saved'; setTimeout(function(){ if(statusEl) statusEl.textContent=''; }, 2000); }
  renderFlCalGrid();
  renderFlProjList();
}

async function flDeleteCalEntry(entryId, projCode) {
  var overlay = document.getElementById('flCalModalOverlay');

  var statusEl = document.getElementById('flSaveStatus');

  if (SUPA_BUDGETS && SUPA_BUDGETS[projCode] && SUPA_BUDGETS[projCode]._flEntries) {
    var entries = SUPA_BUDGETS[projCode]._flEntries;

    }
    SUPA_BUDGETS[projCode].flSpent = flSpentNew;

async function flPatchGlobal(entryId, field, value, projCode) {
  await sparkFetch('freelancer_budget_entries?id=eq.' + entryId, '', 'PATCH', { [field]: value || null });
  if (SUPA_BUDGETS && SUPA_BUDGETS[projCode] && SUPA_BUDGETS[projCode]._flEntries) {

      if (SUPA_BUDGETS[projCode]._flEntries[i].id === entryId) {
        SUPA_BUDGETS[projCode]._flEntries[i][field] = value || null;
        break;
      }
    }
  }
}

var _flDebTimers = {};
function flDebouncedPatchGlobal(entryId, field, value, projCode) {
  var key = entryId + '|' + field;
  if (_flDebTimers[key]) clearTimeout(_flDebTimers[key]);
  /* Update local cache immediately so the UI reflects the change on re-render */
  if (SUPA_BUDGETS && SUPA_BUDGETS[projCode] && SUPA_BUDGETS[projCode]._flEntries) {
    for (var i = 0; i < SUPA_BUDGETS[projCode]._flEntries.length; i++) {
      if (SUPA_BUDGETS[projCode]._flEntries[i].id === entryId) {
        SUPA_BUDGETS[projCode]._flEntries[i][field] = (field === 'hours') ? (parseFloat(value) || 0) : value;
        break;
      }
    }
    if (field === 'hours') {
      flRecomputeTotals(SUPA_BUDGETS[projCode]);
      renderFlCalGrid(); /* re-render so totals update */
    }
  }
  _flDebTimers[key] = setTimeout(async function() {
    var patch = {}; patch[field] = (field === 'hours') ? (parseFloat(value) || 0) : (value || null);
    await sparkFetch('freelancer_budget_entries?id=eq.' + entryId, '', 'PATCH', patch);
  }, 500);
}

async function flAddWeekGlobal(budgetId, tmId, projCode) {
  if (!budgetId || !tmId || !projCode) return;
  var labelInput = document.getElementById('flNewLabel_' + tmId + '_' + projCode);
  var label = (labelInput && labelInput.value.trim()) ? labelInput.value.trim() : null;
  /* Find rate + week count for this team member */
  var rate = 0, weekNum = 1;
  var entries = (SUPA_BUDGETS && SUPA_BUDGETS[projCode] && SUPA_BUDGETS[projCode]._flEntries) || [];
  for (var i = 0; i < entries.length; i++) {
    if (entries[i].team_member_id === tmId) {
      rate = entries[i].rate || rate;
      if (entries[i].week_label !== '__budget__') weekNum++;
    }
  }
  if (!label) label = 'Week ' + weekNum;
  var statusEl = document.getElementById('flSaveStatus');
  if (statusEl) statusEl.textContent = 'Saving\u2026';
  var result = await sparkFetch('freelancer_budget_entries', '', 'POST', {
    budget_id: budgetId, team_member_id: tmId,
    week_label: label, hours: 0, rate: rate, paid: false,
    display_order: entries.length
  });
  if (result && result.length) {
    /* Enrich with name */
    result[0]._name = null;
    for (var ti = 0; ti < (FURNACE_TEAM_MEMBERS||[]).length; ti++) {
      if (FURNACE_TEAM_MEMBERS[ti].id === tmId) { result[0]._name = FURNACE_TEAM_MEMBERS[ti].name; break; }
    }
    if (!result[0]._name) result[0]._name = entries.length > 0 ? (entries[0]._name || 'Unknown') : 'Unknown';
    if (SUPA_BUDGETS && SUPA_BUDGETS[projCode]) {
      SUPA_BUDGETS[projCode]._flEntries.push(result[0]);
      flRecomputeTotals(SUPA_BUDGETS[projCode]);
    }
  }
  if (statusEl) { statusEl.textContent = 'Saved'; setTimeout(function(){ if(statusEl) statusEl.textContent=''; }, 2000); }
  renderFlCalGrid();
}

function renderAllocGrid() {
  var el = document.getElementById('allocGridScroll');
  var lbl = document.getElementById('allocWeekLabel');
  if (!el) return;
  if (lbl) lbl.innerHTML = getAllocWeekLabel(allocWeekOf);

  if (!allocProject) {
    el.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--mid-gray);font-size:14px">Select a project from the sidebar</div>';
    return;
  }

  var team = (ALLOCATIONS.team || []).slice().sort(function(a, b) { return a.localeCompare(b); });
  var people = team;

  var days, cols;
  if (allocViewMode === 'day') {
    days = getWeekDays(allocWeekOf);
    cols = days.length;
  } else {
    /* Week view: show 4 weeks (current + 3 ahead) */
    days = [];
    for (var w = 0; w < 4; w++) {
      days.push(shiftWeek(allocWeekOf, w));
    }
    cols = days.length;
  }

  var gridCols = '150px ' + ('1fr ').repeat(cols) + '60px'; /* extra col for row total */
  var h = '<div class="alloc-grid" style="grid-template-columns:' + gridCols + '">';

  /* Header row */
  h += '<div class="ag-corner">People</div>';
  if (allocViewMode === 'day') {
    for (var c = 0; c < days.length; c++) {
      var isToday = days[c] === new Date().toISOString().slice(0, 10);
      h += '<div class="ag-col-hdr" style="' + (isToday ? 'background:rgba(48,109,124,.08)' : '') + '">';
      h += '<span class="ag-day">' + fmtDayShort(days[c]) + '</span> ' + fmtDayNum(days[c]);
      h += '</div>';
    }
  } else {
    for (var c = 0; c < days.length; c++) {
      var wn = getISOWeek(days[c]);
      var fri = new Date(days[c] + 'T00:00:00'); fri.setDate(fri.getDate() + 4);
      h += '<div class="ag-col-hdr">';
      h += '<span class="ag-day">Week ' + wn + '</span>';
      h += fmtMonShort(days[c]) + ' ' + fmtDayNum(days[c]) + '–' + fmtDayNum(fri.toISOString().slice(0, 10));
      h += '</div>';
    }
  }
  h += '<div class="ag-col-hdr" style="font-size:10px">Total</div>';

  /* People rows */
  for (var r = 0; r < people.length; r++) {
    var person = people[r];
    var pc = PC[person] || '#9B9590';
    var rowTotal = 0;

    /* Row header */
    if (allocViewMode === 'day') {
      rowTotal = getAllocWeekTotal(allocProject, person, allocWeekOf);
    } else {
      for (var c = 0; c < days.length; c++) rowTotal += getAllocWeekTotal(allocProject, person, days[c]);
    }

    var _personExpanded = !!allocExpandedPerson[person];
    var _personHasOtherProjects = getPersonDayTotal(person, days[0] || allocWeekOf) > 0;
    h += '<div class="ag-row-hdr" style="cursor:pointer" onclick="allocTogglePersonExpand(\'' + person.replace(/'/g, "\\'") + '\',event)">';
    h += '<span style="font-size:9px;margin-right:4px;opacity:.5">' + (_personExpanded ? '\u25BC' : '\u25B6') + '</span>';
    h += '<span class="ag-person-dot" style="background:' + pc + '"></span>' + person;
    if (rowTotal > 0) h += '<span class="ag-person-total">' + rowTotal.toFixed(1) + 'h</span>';
    h += '</div>';

    /* In day view, show capacity indicator under each cell */

    /* Cells */
    for (var c = 0; c < days.length; c++) {
      var cellKey, cellVal;
      if (allocViewMode === 'day') {
        cellKey = days[c];
        cellVal = getAllocHours(allocProject, person, cellKey);
      } else {
        cellKey = days[c]; /* Monday of that week */
        cellVal = getAllocWeekTotal(allocProject, person, cellKey);
      }

      var isEditing = allocEditingCell && allocEditingCell.person === person && allocEditingCell.date === cellKey;

      h += '<div class="ag-cell' + (cellVal > 0 ? ' ag-cell-filled' : '') + '"';
      if (!isEditing) {
        if (allocViewMode === 'day') {
          h += ' onclick="allocStartEdit(\'' + person.replace(/'/g, "\\'") + '\',\'' + cellKey + '\')"';
        } else {
          /* In week view, clicking expands to day view for that week */
          h += ' onclick="allocWeekOf=\'' + cellKey + '\';allocViewMode=\'day\';renderAllocGrid()"';
        }
      }
      h += '>';

      if (isEditing) {
        h += '<input class="ag-cell-input" type="number" min="0" max="24" step="0.5" value="' + (cellVal || '') + '" id="allocCellInput" '
          + 'onblur="allocFinishEdit(\'' + person.replace(/'/g, "\\'") + '\',\'' + cellKey + '\',this.value)" '
          + 'onkeydown="if(event.key===\'Enter\')this.blur();if(event.key===\'Escape\'){allocEditingCell=null;renderAllocGrid();}" '
          + 'autofocus>';
      } else if (cellVal > 0) {
        if (allocViewMode === 'day') {
          h += '<div class="ag-cell-val" style="background:' + pc + '">' + cellVal + ' h/d</div>';
        } else {
          h += '<div class="ag-cell-val" style="background:' + pc + '">' + cellVal.toFixed(1) + 'h</div>';
        }
      } else {
        h += '<div class="ag-cell-empty"></div>';
      }
      /* Day view: show capacity bar (X/8h across all projects) */
      if (allocViewMode === 'day' && !isEditing) {
        var dayTotal = getPersonDayTotal(person, cellKey);
        var capPct = Math.min(100, dayTotal / 8 * 100);
        var _execNames = ['Dave MacLeod','Jeff Butcher','Jeff Cole','Richelle Butcher'];
        var _isExec = _execNames.indexOf(person) >= 0;
        var capColor = _isExec ? 'var(--mid-gray)' : dayTotal >= 8 ? '#E53935' : dayTotal >= 7 ? 'var(--ember)' : dayTotal >= 6 ? 'var(--honey)' : '#81C784';
        var capTextColor = _isExec ? 'var(--mid-gray)' : dayTotal >= 8 ? '#E53935' : dayTotal >= 7 ? 'var(--ember)' : dayTotal >= 6 ? 'var(--honey)' : '#81C784';
        h += '<div style="margin-top:2px;font-size:9px;color:var(--mid-gray);display:flex;align-items:center;gap:3px">';
        h += '<div style="flex:1;height:3px;border-radius:2px;background:rgba(0,0,0,.08)"><div style="height:100%;border-radius:2px;background:' + capColor + ';width:' + capPct.toFixed(0) + '%"></div></div>';
        h += '<span style="white-space:nowrap;color:' + capTextColor + '">' + dayTotal.toFixed(1) + '/8</span>';
        h += '</div>';
      }
      h += '</div>';
    }

    /* Row total */
    var weekTotalAll = getPersonWeekTotal(person, allocWeekOf);
    var cap = ALLOCATIONS.weeklyCapacity || 40;
    var tColor = weekTotalAll > cap ? 'var(--ember)' : weekTotalAll >= cap * 0.8 ? 'var(--honey)' : 'var(--mid-gray)';
    h += '<div class="ag-col-hdr" style="font-size:11px;font-weight:700;color:' + tColor + ';border-bottom:1px solid var(--light-gray)">' + (weekTotalAll > 0 ? weekTotalAll.toFixed(1) : '') + '</div>';

    /* Expanded: show all projects this person is allocated to */
    if (_personExpanded) {
      var personProjs = getPersonAllProjectsForWeek(person, allocWeekOf);
      for (var pp = 0; pp < personProjs.length; pp++) {
        var projInfo = personProjs[pp];
        var isCurrentProj = projInfo.project === allocProject;
        h += '<div class="ag-row-hdr" style="padding-left:28px;font-size:11px;color:' + (isCurrentProj ? 'var(--ocean)' : 'var(--mid-gray)') + ';font-weight:' + (isCurrentProj ? '600' : '400') + ';border-bottom:1px solid rgba(0,0,0,.03)">';
        h += (isCurrentProj ? '\u25CF ' : '') + projInfo.project;
        h += '<span style="float:right;font-size:10px;opacity:.6">' + projInfo.total.toFixed(1) + 'h</span>';
        h += '</div>';
        for (var c = 0; c < days.length; c++) {
          var subVal = projInfo.days[days[c]] || 0;
          h += '<div style="font-size:10px;text-align:center;padding:4px 0;color:' + (subVal > 0 ? (isCurrentProj ? 'var(--ocean)' : 'var(--abyss)') : 'transparent') + ';border-bottom:1px solid rgba(0,0,0,.03);font-weight:' + (isCurrentProj ? '600' : '400') + '">';
          h += subVal > 0 ? subVal.toFixed(1) : '\u2014';
          h += '</div>';
        }
        /* Sub-row total */
        h += '<div style="font-size:10px;text-align:center;padding:4px 0;color:var(--mid-gray);border-bottom:1px solid rgba(0,0,0,.03);font-weight:600">' + projInfo.total.toFixed(1) + '</div>';
      }
    }
  }

  /* Add person row */
  h += '<div class="ag-row-hdr" style="cursor:pointer;color:var(--ocean);font-size:12px" onclick="allocShowAddPerson()">+ Add person</div>';
  for (var c = 0; c <= cols; c++) h += '<div class="ag-cell" style="border-bottom:none"></div>';

  h += '</div>';

  /* ── PROJECT HOURS SUMMARY for the week ── */
  var weekDays = getWeekDays(allocWeekOf);
  var projTotals = {};
  var allocs = ALLOCATIONS.allocations;
  for (var a = 0; a < allocs.length; a++) {
    var al = allocs[a];
    if (weekDays.indexOf(al.date) >= 0 && al.hoursPerDay > 0) {
      if (!projTotals[al.project]) projTotals[al.project] = 0;
      projTotals[al.project] += al.hoursPerDay;
    }
  }
  /* Build project name → code lookup */
  var projCodeLookup = {};
  for (var ci = 0; ci < CLIENTS.length; ci++) {
    for (var pi = 0; pi < CLIENTS[ci].projects.length; pi++) {
      var _p = CLIENTS[ci].projects[pi];
      projCodeLookup[_p.name] = _p.code;
    }
  }

  var projList = [];
  for (var pn in projTotals) projList.push({ name: pn, code: projCodeLookup[pn] || '', hours: projTotals[pn] });
  projList.sort(function(a, b) { return a.code.localeCompare(b.code); });

  if (projList.length > 0) {
    var grandTotal = projList.reduce(function(s, p) { return s + p.hours; }, 0);
    h += '<div style="margin-top:16px;border-top:2px solid var(--canvas);padding-top:12px">';
    h += '<div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mid-gray);margin-bottom:8px">Weekly Project Hours Summary</div>';
    h += '<div style="display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;font-size:12px">';
    for (var pi = 0; pi < projList.length; pi++) {
      var isActive = projList[pi].name === allocProject;
      var activeStyle = isActive ? 'background:rgba(48,109,124,.1);font-weight:600;color:var(--ocean)' : 'color:var(--text)';
      var codeStyle = isActive ? 'color:var(--ocean);font-weight:600' : 'color:var(--mid-gray)';
      h += '<div style="padding:4px 8px;font-size:11px;font-variant-numeric:tabular-nums;' + codeStyle + '">' + projList[pi].code + '</div>';
      h += '<div style="padding:4px 0;border-radius:4px;' + activeStyle + '">' + projList[pi].name + '</div>';
      h += '<div style="padding:4px 8px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;' + (isActive ? 'color:var(--ocean)' : '') + '">' + projList[pi].hours.toFixed(1) + 'h</div>';
    }
    h += '<div style="padding:4px 8px;border-top:1px solid var(--canvas)"></div>';
    h += '<div style="padding:4px 0;border-top:1px solid var(--canvas);font-weight:700;color:var(--text)">Total</div>';
    h += '<div style="padding:4px 8px;text-align:right;border-top:1px solid var(--canvas);font-weight:700;font-variant-numeric:tabular-nums">' + grandTotal.toFixed(1) + 'h</div>';
    h += '</div></div>';
  }

  el.innerHTML = h;

  /* Focus input if editing */
  if (allocEditingCell) {
    var inp = document.getElementById('allocCellInput');
    if (inp) { inp.focus(); inp.select(); }
  }
}

function allocTogglePersonExpand(person, evt) {
  evt.stopPropagation();
  allocExpandedPerson[person] = !allocExpandedPerson[person];
  renderAllocGrid();
}

function getPersonAllProjectsForWeek(person, weekOf) {
  /* Returns [{project, days: {date: hours}}] for all projects this person has time on */
  var wdays = getWeekDays(weekOf);
  var projMap = {};
  var allocs = ALLOCATIONS.allocations;
  for (var i = 0; i < allocs.length; i++) {
    var a = allocs[i];
    if (a.person !== person) continue;
    if (wdays.indexOf(a.date) < 0) continue;
    if (!projMap[a.project]) projMap[a.project] = {};
    projMap[a.project][a.date] = (projMap[a.project][a.date] || 0) + a.hoursPerDay;
  }
  var result = [];
  for (var proj in projMap) {
    var total = 0;
    for (var d in projMap[proj]) total += projMap[proj][d];
    result.push({ project: proj, days: projMap[proj], total: total });
  }
  result.sort(function(a, b) { return b.total - a.total; });
  return result;
}

function allocStartEdit(person, dateISO) {
  allocEditingCell = { person: person, date: dateISO };
  renderAllocGrid();
}

function allocFinishEdit(person, dateISO, value) {
  allocEditingCell = null;
  var hrs = parseFloat(value) || 0;
  allocSetCell(allocProject, person, dateISO, hrs);
  renderAllocGrid();
  renderCapacityPanel();
}

function allocShowAddPerson() {
  /* Quick: add first unassigned person with 0 hours so they appear in the grid */
  var team = ALLOCATIONS.team || [];
  var assigned = getProjectPeople(allocProject, allocWeekOf);
  for (var i = 0; i < team.length; i++) {
    if (assigned.indexOf(team[i]) < 0) {
      /* Start editing their first day cell */
      var firstDay = getWeekDays(allocWeekOf)[0];
      allocStartEdit(team[i], firstDay);
      return;
    }
  }
}

function renderCapacityPanel() {
  var el = document.getElementById('allocCapPanel');
  if (!el) return;
  var maxCap = ALLOCATIONS.weeklyCapacity || 40;
  var team = ALLOCATIONS.team || [];

  /* Build project name → billable lookup */
  var projBillable = {};
  if (CLIENTS) {
    for (var ci = 0; ci < CLIENTS.length; ci++) {
      for (var pi = 0; pi < CLIENTS[ci].projects.length; pi++) {
        var _p = CLIENTS[ci].projects[pi];
        var _nb = _p.projectType === 'internal' || _p.projectType === 'bizdev'
          || _p.code.indexOf('100_') === 0 || _p.code.indexOf('101_') === 0
          || _p.code.indexOf('359_') === 0
          || (_p._supabudget && (_p._supabudget.status === 'nonbillable' || _p._supabudget.status === 'bizdev'));
        projBillable[_p.name] = !_nb;
      }
    }
  }

  /* Build capacity data for current week */
  var people = [];
  for (var i = 0; i < team.length; i++) {
    var total = getPersonWeekTotal(team[i], allocWeekOf);
    /* Get project breakdown */
    var projMap = {};
    var days = getWeekDays(allocWeekOf);
    var allocs = ALLOCATIONS.allocations;
    for (var j = 0; j < allocs.length; j++) {
      if (allocs[j].person === team[i] && days.indexOf(allocs[j].date) >= 0) {
        if (!projMap[allocs[j].project]) projMap[allocs[j].project] = 0;
        projMap[allocs[j].project] += allocs[j].hoursPerDay;
      }
    }
    /* Compute billable hours */
    var billableHrs = 0;
    for (var proj in projMap) {
      if (projBillable[proj] !== false) billableHrs += projMap[proj];
    }
    people.push({ name: team[i], total: total, projects: projMap, billableHrs: billableHrs });
  }
  if (allocCapSort === 'alpha') {
    people.sort(function(a, b) { return a.name < b.name ? -1 : a.name > b.name ? 1 : 0; });
  } else {
    people.sort(function(a, b) { return b.total - a.total; });
  }

  /* Split into regular team and executives */
  var regularPeople = [], execPeople = [];
  for (var i = 0; i < people.length; i++) {
    if (CAPACITY_EXECUTIVES.indexOf(people[i].name) >= 0) execPeople.push(people[i]);
    else regularPeople.push(people[i]);
  }

  var totalAllocated = 0;
  var activeCount = 0;
  for (var i = 0; i < people.length; i++) {
    totalAllocated += people[i].total;
    if (people[i].total > 0) activeCount++;
  }

  function renderCapPerson(p) {
    var colorClass = p.total >= 40 ? 'cap-red' : p.total >= 32 ? 'cap-yellow' : 'cap-green';
    var pc = PC[p.name] || '#9B9590';
    var projKeys = Object.keys(p.projects).sort(function(a, b) { return p.projects[b] - p.projects[a]; });
    var segColors = ['var(--ocean)', 'var(--honey)', 'var(--ember)', '#7A8B6F', '#9B8EC2', '#6B9DAD', '#B8948A', '#5B7FAF'];
    var billPct = p.total > 0 ? Math.round(p.billableHrs / p.total * 100) : null;
    var billColor = billPct === null ? 'var(--mid-gray)' : billPct >= 80 ? '#81C784' : billPct >= 50 ? 'var(--honey)' : 'var(--ember)';
    var s = '<div class="cap-person">';
    s += '<div class="cap-person-header">';
    s += '<div class="cap-person-name"><span class="cp-dot" style="background:' + pc + '"></span>' + p.name + '</div>';
    s += '<div style="display:flex;align-items:center;gap:6px">';
    if (billPct !== null) s += '<span style="font-size:10px;font-weight:600;color:' + billColor + '">' + billPct + '%</span>';
    s += '<div class="cap-person-hrs ' + colorClass + '">' + p.total.toFixed(1) + ' / ' + maxCap + '</div>';
    s += '</div>';
    s += '</div>';
    s += '<div class="cap-bar">';
    for (var j = 0; j < projKeys.length; j++) {
      var segPct = maxCap > 0 ? (p.projects[projKeys[j]] / maxCap) * 100 : 0;
      s += '<div class="cap-bar-seg" style="width:' + Math.min(segPct, 100) + '%;background:' + segColors[j % segColors.length] + '" title="' + projKeys[j] + ': ' + p.projects[projKeys[j]].toFixed(1) + 'h"></div>';
    }
    s += '</div>';
    if (projKeys.length > 0) {
      s += '<div class="cap-projects">';
      var parts = [];
      for (var j = 0; j < projKeys.length; j++) parts.push(projKeys[j] + ' ' + p.projects[projKeys[j]].toFixed(1) + 'h');
      s += parts.join(' &bull; ');
      s += '</div>';
    }
    s += '</div>';
    return s;
  }

  var h = '';
  h += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">';
  h += '<h3 style="margin:0">Team Capacity</h3>';
  h += '<div style="display:flex;gap:2px;background:var(--canvas);border-radius:6px;padding:2px">';
  h += '<button onclick="allocCapSort=\'busy\';renderCapacityPanel()" style="border:none;border-radius:4px;padding:2px 8px;font-size:10px;font-weight:600;cursor:pointer;background:' + (allocCapSort==='busy' ? 'var(--white)' : 'transparent') + ';color:' + (allocCapSort==='busy' ? 'var(--abyss)' : 'var(--mid-gray)') + '">Busy</button>';
  h += '<button onclick="allocCapSort=\'alpha\';renderCapacityPanel()" style="border:none;border-radius:4px;padding:2px 8px;font-size:10px;font-weight:600;cursor:pointer;background:' + (allocCapSort==='alpha' ? 'var(--white)' : 'transparent') + ';color:' + (allocCapSort==='alpha' ? 'var(--abyss)' : 'var(--mid-gray)') + '">A–Z</button>';
  h += '</div></div>';
  h += '<div class="cap-sub">' + totalAllocated.toFixed(1) + ' hrs &bull; ' + activeCount + ' people allocated</div>';

  for (var i = 0; i < regularPeople.length; i++) h += renderCapPerson(regularPeople[i]);

  /* Executives section at bottom with toggle */
  if (execPeople.length > 0) {
    h += '<div style="margin-top:12px;border-top:1px solid var(--canvas);padding-top:10px">';
    h += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:' + (allocShowExecutives ? '8' : '0') + 'px">';
    h += '<span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mid-gray)">Executives</span>';
    h += '<div onclick="allocShowExecutives=!allocShowExecutives;renderCapacityPanel()" style="width:28px;height:16px;border-radius:8px;background:' + (allocShowExecutives ? 'var(--ocean)' : 'var(--canvas)') + ';cursor:pointer;position:relative;transition:background .2s;flex-shrink:0">';
    h += '<div style="width:12px;height:12px;border-radius:50%;background:var(--white);position:absolute;top:2px;' + (allocShowExecutives ? 'left:14px' : 'left:2px') + ';transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)"></div>';
    h += '</div></div>';
    if (allocShowExecutives) {
      for (var i = 0; i < execPeople.length; i++) h += renderCapPerson(execPeople[i]);
    }
    h += '</div>';
  }

  el.innerHTML = h;
}

/* ── NAVIGATION ── */
function navigate(view) {
  currentView = view;
  try { localStorage.setItem('furnace_view', view); } catch(e) {}
  /* Update URL hash so each view has a shareable link */
  try {
    var newHash = '#' + encodeURIComponent(view);
    if (window.location.hash !== newHash) {
      history.pushState(null, '', newHash);
    }
  } catch(e) {}
  if (view.indexOf('client:') === 0) {
    openClients[view.split(':')[1]] = true;
    showFinalized = false; /* always default to active-only when entering a client */
  } else if (view.indexOf('project:') === 0) {
    var pid = view.split(':')[1];
    for (var i = 0; i < CLIENTS.length; i++) {
      for (var j = 0; j < CLIENTS[i].projects.length; j++) {
        if (CLIENTS[i].projects[j].id === pid) openClients[CLIENTS[i].id] = true;
      }
    }
  }
  renderSidebar();
  if (view === 'master') renderMaster();
  else if (view === 'ytd') renderYTD();
  else if (view === 'flagged') renderFlagged();
  else if (view === 'importTime') renderImportTime();
  else if (view === 'completed') renderCompleted();
  else if (view === 'resource') renderResource();
  else if (view === 'allocations') renderAllocations();
  else if (view === 'spark') renderSpark();
  else if (view === 'settings') renderSettings();
  else if (view === 'opportunities') renderOpportunities();
  else if (view.indexOf('opportunity:') === 0) renderOpportunityEditor(view.split(':')[1]);
  else if (view.indexOf('client:') === 0) renderClient(view.split(':')[1]);
  else if (view.indexOf('project:') === 0) renderProject(view.split(':')[1]);
}

function setUnit(u) {
  displayUnit = u;
  document.getElementById('toggleHours').className = 'toggle-btn' + (u === 'hours' ? ' active' : '');
  document.getElementById('toggleMoney').className = 'toggle-btn' + (u === 'money' ? ' active' : '');
  navigate(currentView);
}

function toggleDarkMode() {
  var isDark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('furnace-dark-mode', isDark ? '1' : '0');
}
(function() {
  if (localStorage.getItem('furnace-dark-mode') === '1') {
    document.documentElement.classList.add('dark');
  }
})();

/* ── HASH-BASED ROUTING: back/forward button support ── */
window.addEventListener('hashchange', function() {
  try {
    var hash = window.location.hash;
    var view = hash && hash.length > 1 ? decodeURIComponent(hash.slice(1)) : 'master';
    if (view !== currentView) {
      currentView = view;
      try { localStorage.setItem('furnace_view', view); } catch(e) {}
      /* Only navigate if app data is already loaded */
      if (CLIENTS && CLIENTS.length) {
        if (view.indexOf('client:') === 0) { showFinalized = false; openClients[view.split(':')[1]] = true; }
        renderSidebar();
        if (view === 'master') renderMaster();
        else if (view === 'flagged') renderFlagged();
        else if (view === 'importTime') renderImportTime();
        else if (view === 'completed') renderCompleted();
        else if (view === 'resource') renderResource();
        else if (view === 'allocations') renderAllocations();
        else if (view === 'spark') renderSpark();
        else if (view === 'settings') renderSettings();
        else if (view.indexOf('client:') === 0) renderClient(view.split(':')[1]);
        else if (view.indexOf('project:') === 0) renderProject(view.split(':')[1]);
      }
    }
  } catch(e) {}
});

/* ── PROJECT BUDGET LOOKUP ── */
var PROJECT_BUDGETS = {};
var PROJECT_CODES = {};

/* RT project name → portfolio project name overrides (fuzzy matches) */
/* Map resolved project names (after alias) → project_code from Supabase actuals */
var RT_NAME_TO_CODE = {};

var RT_BUDGET_ALIASES = {
  'Forge Website': 'Forge Website 2.0',

function buildProjectBudgetLookup() {
  PROJECT_BUDGETS = {};
  PROJECT_CODES = {};
  /* Build lookup from portfolio client/project data */
  var portfolioBudgets = {};
  var portfolioCodes = {};
  for (var i = 0; i < CLIENTS.length; i++) {
    var projs = CLIENTS[i].projects || [];
    for (var j = 0; j < projs.length; j++) {
      var p = projs[j];
      portfolioCodes[p.name] = p.code || '';
      if (p.hasBudgetData) {
        var spent = 0;
        var phases = p.phases || [];
        for (var k = 0; k < phases.length; k++) spent += phases[k].spent || 0;
        portfolioBudgets[p.name] = { budget: p.totalBudget || 0, spent: spent, remaining: (p.totalBudget || 0) - spent };
      }
    }
  }
  /* Build reverse lookup: budget name / project name → project_code from SUPA_BUDGETS */
  var supaNameToCode = {};
  if (SUPA_BUDGETS) {
    for (var sc in SUPA_BUDGETS) {
      var sb = SUPA_BUDGETS[sc];
      if (sb.name) supaNameToCode[sb.name] = sc;
      if (sb.projects && sb.projects.name) supaNameToCode[sb.projects.name] = sc;
    }
  }

  /* Map RT project names to budget entries (exact + alias) */
  var allRTNames = {};
  for (var w = 0; w < RT_WEEKS.length; w++) {
    var ppl = RT_WEEKS[w].people || {};
    for (var pn in ppl) {
      var pr = ppl[pn].projects || {};
      for (var pk in pr) allRTNames[pk] = true;
    }
  }
  for (var rtName in allRTNames) {
    if (portfolioBudgets[rtName]) {
      PROJECT_BUDGETS[rtName] = portfolioBudgets[rtName];
    } else if (RT_BUDGET_ALIASES[rtName] && portfolioBudgets[RT_BUDGET_ALIASES[rtName]]) {
      PROJECT_BUDGETS[rtName] = portfolioBudgets[RT_BUDGET_ALIASES[rtName]];
    }
    if (portfolioCodes[rtName]) {
      PROJECT_CODES[rtName] = portfolioCodes[rtName];
    } else if (RT_BUDGET_ALIASES[rtName] && portfolioCodes[RT_BUDGET_ALIASES[rtName]]) {
      PROJECT_CODES[rtName] = portfolioCodes[RT_BUDGET_ALIASES[rtName]];
    } else if (RT_NAME_TO_CODE[rtName]) {
      /* Fallback: use project_code from Supabase actuals data */
      PROJECT_CODES[rtName] = RT_NAME_TO_CODE[rtName];
    } else if (supaNameToCode[rtName]) {
      /* Fallback: match budget name from SUPA_BUDGETS */
      PROJECT_CODES[rtName] = supaNameToCode[rtName];
    }
  }
}

      sparkConfig = await window.furnaceAPI.sparkReadConfig();

      };
    }
  }
  if (!sparkConfig) return [];

  /* Use anon key directly — no user session required */
  var token = sparkConfig.supabaseAnonKey;

  var all = [], page = 0, pageSize = 1000;
  var url = sparkConfig.supabaseUrl + '/rest/v1/' + table + '?' + query;
  while (true) {

  return all;
}
