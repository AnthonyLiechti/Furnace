}

var FURNACE_CACHE_KEY = 'furnace_supa_v5';
var FURNACE_CACHE_TTL = 45 * 60 * 1000; /* 45 min — real-time handles live updates */

function furnaceSaveCache(payload) {
  try { localStorage.setItem(FURNACE_CACHE_KEY, JSON.stringify({ ts: Date.now(), d: payload })); } catch(e) {}
}

function furnaceLoadCache() {
  try {
    var raw = localStorage.getItem(FURNACE_CACHE_KEY);
    if (!raw) return null;
    var p = JSON.parse(raw);
    if (!p || !p.d) return null;
    return p; /* return even if stale — caller decides what to do with it */
  } catch(e) { return null; }
}

function furnaceApplyCachePayload(payload) {
  if (!payload) return;
  FURNACE_TEAM_MEMBERS = payload.teamMembers || [];
  SUPA_BUDGETS         = payload.supaBudgets || {};
  SUPA_ACTUALS         = payload.supaActuals || {};
  SUPA_ACTUALS_ALL     = payload.supaActualsAll || [];
  SUPA_LOADED = true;
}

/* ══════════════════════════════════════════════════════════════
   GLOBAL REAL-TIME — subscribe to budget/labor/oop/fl changes
   across ALL projects so the master portfolio view stays live.
   ══════════════════════════════════════════════════════════════ */
var _furnaceGlobalChannel = null;

function furnaceSubscribeGlobalRealtime() {
  if (!_furnaceAuthClient || _furnaceGlobalChannel) return;
  _furnaceGlobalChannel = _furnaceAuthClient
    .channel('furnace-global')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'budgets' }, function(p) {
      var rec = p.new;
      if (!rec) return;
      /* Find which projCode this budget belongs to */
      var projCode = PROJ_CODE_MAP[rec.project_id];
      if (!projCode || !SUPA_BUDGETS[projCode]) return;
      /* Merge scalar budget fields (client_price, no_oop, etc.) */
      var sb = SUPA_BUDGETS[projCode];
      var keep = ['laborHours','laborTotal','laborCostInternal','oopTotal','oopEffective','oopSpent',
                  'flTotal','flSpent','_flEntries','_oopEntries','labor','oop'];
      for (var k in rec) { if (keep.indexOf(k) === -1) sb[k] = rec[k]; }
      /* Re-render the project financials banner if it's visible */
      if (CLIENTS) {
        for (var ci = 0; ci < CLIENTS.length; ci++) {
          for (var pi = 0; pi < CLIENTS[ci].projects.length; pi++) {
            var proj = CLIENTS[ci].projects[pi];
            if (proj.code === projCode) { renderProjFinancials(proj); break; }
          }
        }
      }
      /* If master/portfolio view is active, refresh the project card */
      furnaceGlobalRefreshProjectCard(projCode);
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'labor_budget_entries' }, function(p) {
      furnaceGlobalHandleEntryChange('labor', p);
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'oop_budget_entries' }, function(p) {
      furnaceGlobalHandleEntryChange('oop', p);
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'freelancer_budget_entries' }, function(p) {
      furnaceGlobalHandleEntryChange('fl', p);
    })
    .subscribe();
}

function furnaceGlobalHandleEntryChange(type, payload) {
  var rec = payload.new || payload.old;
  if (!rec || !rec.budget_id) return;
  /* Find which projCode owns this budget */
  var projCode = null;
  for (var code in SUPA_BUDGETS) {
    if (SUPA_BUDGETS[code].id === rec.budget_id) { projCode = code; break; }
  }
  if (!projCode) return;
  var sb = SUPA_BUDGETS[projCode];

  /* Update the relevant entry array on the cached budget object */
  var arr = type === 'labor' ? sb.labor : type === 'oop' ? sb.oop : sb._flEntries;
  if (!arr) return;
  if (payload.eventType === 'DELETE') {
    arr = arr.filter(function(e) { return e.id !== rec.id; });
  } else {
    var found = false;
    for (var i = 0; i < arr.length; i++) {
      if (arr[i].id === rec.id) { arr[i] = Object.assign({}, arr[i], rec); found = true; break; }
    }
    if (!found && payload.eventType === 'INSERT') arr.push(rec);
  }
  if (type === 'labor') sb.labor = arr;
  else if (type === 'oop') { sb.oop = arr; sb._oopEntries = arr; } /* keep _oopEntries in sync for OOP planner */
  else { sb._flEntries = arr; if (RM_FL.projCode === projCode) { RM_FL.entries = arr; } } /* keep RM_FL in sync if open */

  /* Recompute totals for this budget */
  var laborHours = 0, laborCost = 0, laborInternal = 0;
  for (var i = 0; i < (sb.labor || []).length; i++) {
    var le = sb.labor[i];
    var hrs = (le.phase1||0)+(le.phase2||0)+(le.phase3_1||0)+(le.phase3_2||0)+(le.phase4||0)+(le.phase5||0);
    laborHours += hrs; laborCost += hrs * 200;
    var fbr = (le.team_member && le.team_member.fully_burdened_rate) ? le.team_member.fully_burdened_rate : 200;
    laborInternal += hrs * fbr;
  }
  sb.laborHours = laborHours; sb.laborTotal = laborCost; sb.laborCostInternal = laborInternal;
  var oopEff = 0, oopSpent = 0;
  for (var i = 0; i < (sb.oop || []).length; i++) {
    var oe = sb.oop[i]; if (oe.is_active === false) continue;
    var v = sparkOopItemEffective(oe); oopEff += v; if (oe.paid) oopSpent += v;
  }
  var _mkPct3 = sparkSettingVal((sparkCurrentData && sparkCurrentData.settings) || [], 'markup', 'oop_markup_percentage', 20);
  sb.oopEffective = oopEff;
  sb.oopEffectiveWithMarkup = oopEff > 0 ? oopEff * (1 + _mkPct3 / 100) : 0;
  sb.oopMarkupPct = _mkPct3;
  sb.oopSpent = oopSpent;
  flRecomputeTotals(sb);

  /* Re-render project financials banner and portfolio card */
  if (CLIENTS) {
    for (var ci = 0; ci < CLIENTS.length; ci++) {
      for (var pi = 0; pi < CLIENTS[ci].projects.length; pi++) {
        var proj = CLIENTS[ci].projects[pi];
        if (proj.code === projCode) {
          proj.laborCost = laborCost; proj.oopCost = oopEff;
          renderProjFinancials(proj);
          break;
        }
      }
    }
  }
  furnaceGlobalRefreshProjectCard(projCode);

  /* Live re-render resource planner if the relevant tab is open */
  if (type === 'oop') {
    if (rtView === 'oop') { renderOopProjList(); renderOopGrid(); }
    else if (allocResourceTab === 'oop') { renderOopProjList(); renderOopGrid(); }
  } else if (type === 'fl') {
    if (rtView === 'freelancers') renderRMFlUpdate();
  }
}

function furnaceGlobalRefreshProjectCard(projCode) {
  /* Re-render just the project row/card in whatever list view is currently active */
  var cardEl = document.getElementById('projCard-' + projCode) || document.getElementById('proj-row-' + projCode);
  if (!cardEl || !CLIENTS) return;
  for (var ci = 0; ci < CLIENTS.length; ci++) {
    for (var pi = 0; pi < CLIENTS[ci].projects.length; pi++) {
      var proj = CLIENTS[ci].projects[pi];
      if (proj.code === projCode) {
        /* Flash the card briefly to signal a live update */
        cardEl.style.transition = 'box-shadow .3s';
        cardEl.style.boxShadow = '0 0 0 2px #81C784';
        setTimeout(function() { cardEl.style.boxShadow = ''; }, 1200);
        return;
      }
    }
  }
}

async function loadSupabaseData() {
  if (!sparkAuth.connected) return;
  try {

    /* ── CACHE: serve stale data instantly while fresh fetch runs in background ──
       If we have cached data, apply it now so the rest of loadData can render
       immediately using cached SUPA_BUDGETS/SUPA_ACTUALS. Then if cache is still
       fresh, skip the heavy re-fetch entirely. If stale, continue to re-fetch and
       the UI will silently update when the fresh data arrives. ── */
    var cached = furnaceLoadCache();
    var isStale = !cached || (Date.now() - cached.ts > FURNACE_CACHE_TTL);
    if (cached) {
      furnaceApplyCachePayload(cached.d);
      furnaceSubscribeGlobalRealtime();
      if (!isStale) { setDataStatus('live'); return; } /* cache is fresh */
      setDataStatus('cached'); /* stale cache applied — fresh fetch starting */
    }
    setDataStatus('syncing');
    /* 0+1+1b. Fetch team members, budgets, and project ID map in parallel */
    var _phase1 = await Promise.all([
      sparkFetchAll('team_members', 'select=id,name,department,employment_type,fully_burdened_rate,billable_rate,is_active&is_active=eq.true&order=department.asc,name.asc'),
      sparkFetchAll('budgets', 'select=id,name,status,client_price,total_amount,has_discount,discount_percentage,reserve_percentage,oop_markup_percentage,no_oop,no_freelancers,is_small_project,project_id,projects(id,project_code,name)&visibility=eq.visible&status=neq.opportunity&status=neq.lost'),
      sparkFetchAll('projects', 'select=id,project_code')
    ]);
    FURNACE_TEAM_MEMBERS = _phase1[0] || [];
    var budgets = _phase1[1];
    var projRows = _phase1[2] || [];

    if (!budgets || !budgets.length) {
      /* Fallback: try without the projects join in case join is failing */
      console.warn('[Furnace] budgets with join returned empty — trying without join');
      budgets = await sparkFetchAll('budgets', 'select=id,name,status,client_price,total_amount,has_discount,discount_percentage,reserve_percentage,oop_markup_percentage,no_oop,no_freelancers,is_small_project,project_id&visibility=eq.visible&status=neq.opportunity&status=neq.lost');
      if (!budgets || !budgets.length) { console.warn('[Furnace] No Supabase budgets found — check Supabase RLS policies and table data'); SUPA_LOADED = false; return; }
    }

    PROJ_CODE_MAP = {};
    for (var i = 0; i < projRows.length; i++) {
      if (projRows[i].project_code) PROJ_CODE_MAP[projRows[i].id] = projRows[i].project_code;
    }
    var projCodeMap = PROJ_CODE_MAP;

    /* 2. Fetch all entry tables + actuals + allocations in parallel */
    var budgetIds = budgets.map(function(b) { return b.id; });
    var _bids = budgetIds.join(',');
    var _phase2 = await Promise.all([
      sparkFetchAll('labor_budget_entries', 'select=id,budget_id,department,employment_type,phase1,phase2,phase3_1,phase3_2,phase4,phase5,rate_override,team_member_id,team_member:team_members(id,name,fully_burdened_rate)&budget_id=in.(' + _bids + ')'),
      sparkFetchAll('oop_budget_entries', 'select=id,budget_id,line_item_name,count,rate,days,head_count,adjusted_count,adjusted_rate,adjusted_days,adjusted_head_count,actual_count,actual_rate,actual_days,actual_head_count,actual_amount,paid,paid_date,is_active&budget_id=in.(' + _bids + ')'),
      sparkFetchAll('freelancer_budget_entries', 'select=id,budget_id,team_member_id,week_label,hours,rate,paid,paid_date,notes&budget_id=in.(' + _bids + ')'),
      sparkFetchAll('labor_actuals', 'select=id,hours,work_date,person_name,project_code,phase_key,is_billable,is_bizdev,is_timeoff,board_name,billable_rate&source=eq.timetracker&work_date=gte.2024-01-01&project_code=not.like.100_%25&order=work_date.desc'),
      sparkFetchAll('allocations', 'select=id,person,project,date,hours_per_day,week_of&order=date.asc')
    ]);
    var laborEntries = _phase2[0];
    var oopEntries   = _phase2[1];
    var flEntries    = _phase2[2] || [];

    /* 3. Group entries by budget_id */
    var laborByBudget = {}, oopByBudget = {}, flByBudget = {};
    for (var i = 0; i < (laborEntries || []).length; i++) {
      var le = laborEntries[i];
      if (!laborByBudget[le.budget_id]) laborByBudget[le.budget_id] = [];
      laborByBudget[le.budget_id].push(le);
    }
    for (var i = 0; i < (oopEntries || []).length; i++) {
      var oe = oopEntries[i];
      if (!oopByBudget[oe.budget_id]) oopByBudget[oe.budget_id] = [];
      oopByBudget[oe.budget_id].push(oe);
    }
    for (var i = 0; i < flEntries.length; i++) {
      var fle = flEntries[i];
      if (!flByBudget[fle.budget_id]) flByBudget[fle.budget_id] = [];
      flByBudget[fle.budget_id].push(fle);
    }

    /* 4. Build SUPA_BUDGETS keyed by project_code */
    SUPA_BUDGETS = {};
    for (var i = 0; i < budgets.length; i++) {
      var b = budgets[i];
      var projCode = (b.projects && b.projects.project_code) ? b.projects.project_code : projCodeMap[b.project_id];
      if (!projCode) continue;

      b.labor = laborByBudget[b.id] || [];
      b.oop = oopByBudget[b.id] || [];
      b._flEntries = flByBudget[b.id] || [];

      /* Enrich freelancer entries with team member name for planner */
      for (var k = 0; k < b._flEntries.length; k++) {
        var fe = b._flEntries[k];
        if (!fe._name) {
          for (var ti = 0; ti < FURNACE_TEAM_MEMBERS.length; ti++) {
            if (FURNACE_TEAM_MEMBERS[ti].id === fe.team_member_id) { fe._name = FURNACE_TEAM_MEMBERS[ti].name; break; }
          }
          if (!fe._name) fe._name = 'Unknown';
        }
      }

      /* Compute freelancer totals (respects __budget__ sentinels) */
      flRecomputeTotals(b);

      /* Compute labor totals — flat $200/hr agency rate for everything */
      var laborHours = 0;
      for (var k = 0; k < b.labor.length; k++) {
        var le = b.labor[k];
        var hrs = (le.phase1 || 0) + (le.phase2 || 0) + (le.phase3_1 || 0) + (le.phase3_2 || 0) + (le.phase4 || 0) + (le.phase5 || 0);
        laborHours += hrs;
      }
      var laborCost = laborHours * 200;

      /* Compute internal labor cost using team member fully_burdened_rate */
      var laborInternalCost = 0;
      for (var k2 = 0; k2 < b.labor.length; k2++) {
        var le2 = b.labor[k2];
        var leHrs = (le2.phase1||0) + (le2.phase2||0) + (le2.phase3_1||0) + (le2.phase3_2||0) + (le2.phase4||0) + (le2.phase5||0);
        var tmRate = 200; /* default */
        if (le2.team_member_id) {
          for (var ti = 0; ti < FURNACE_TEAM_MEMBERS.length; ti++) {
            if (FURNACE_TEAM_MEMBERS[ti].id === le2.team_member_id) {
              tmRate = FURNACE_TEAM_MEMBERS[ti].fully_burdened_rate || 200;
              break;
            }
          }
        } else if (le2.team_member && le2.team_member.fully_burdened_rate) {
          tmRate = le2.team_member.fully_burdened_rate;
        }
        laborInternalCost += leHrs * tmRate;
      }

      /* Compute OOP totals: planned, effective (cascade), and spent (paid only) */
      var oopPlanned = 0, oopEffective = 0, oopSpent = 0;
      for (var k = 0; k < b.oop.length; k++) {
        var oe = b.oop[k];
        if (oe.is_active === false) continue;
        /* Planned: always from planned fields */
        oopPlanned += (oe.count || 0) * (oe.rate || 0) * (oe.days || 1) * (oe.head_count || 1);
        /* Effective: cascade Actual Amount → Actual Fields → Adjusted Fields → Planned */
        var effVal;
        if (oe.actual_amount != null) {
          effVal = oe.actual_amount;
        } else if (oe.actual_count != null || oe.actual_rate != null || oe.actual_days != null || oe.actual_head_count != null) {
          effVal = (oe.actual_count != null ? oe.actual_count : (oe.adjusted_count != null ? oe.adjusted_count : (oe.count||0)))
                 * (oe.actual_rate != null ? oe.actual_rate : (oe.adjusted_rate != null ? oe.adjusted_rate : (oe.rate||0)))
                 * (oe.actual_days != null ? oe.actual_days : (oe.adjusted_days != null ? oe.adjusted_days : (oe.days||1)))
                 * (oe.actual_head_count != null ? oe.actual_head_count : (oe.adjusted_head_count != null ? oe.adjusted_head_count : (oe.head_count||1)));
        } else if (oe.adjusted_count != null || oe.adjusted_rate != null || oe.adjusted_days != null || oe.adjusted_head_count != null) {
          effVal = (oe.adjusted_count != null ? oe.adjusted_count : (oe.count||0)) * (oe.adjusted_rate != null ? oe.adjusted_rate : (oe.rate||0)) * (oe.adjusted_days != null ? oe.adjusted_days : (oe.days||1)) * (oe.adjusted_head_count != null ? oe.adjusted_head_count : (oe.head_count||1));
        } else {
          effVal = (oe.count || 0) * (oe.rate || 0) * (oe.days || 1) * (oe.head_count || 1);
        }
        oopEffective += effVal;
        /* Spent: only if Paid is checked */
        if (oe.paid) oopSpent += effVal;
      }

      b.laborHours = laborHours;
      b.laborTotal = laborCost;
      b.laborCostInternal = laborInternalCost;
      b.oopTotal = oopPlanned;
      b.oopEffective = oopEffective;
      var _bulkMkPct = (b.oop_markup_percentage != null) ? b.oop_markup_percentage : 20;
      b.oopEffectiveWithMarkup = oopEffective > 0 ? oopEffective * (1 + _bulkMkPct / 100) : 0;
      b.oopMarkupPct = _bulkMkPct;
      b.oopSpent = oopSpent;
      b._oopEntries = b.oop; /* store raw OOP entries for planner sidebar */

      SUPA_BUDGETS[projCode] = b;
    }

    /* 5. labor_actuals already fetched in phase 2 parallel batch */
    SUPA_ACTUALS_ALL = _phase2[3] || [];

    /* 6. Build SUPA_ACTUALS keyed by project_code */
    /* Code aliases: map 7pace board codes to Furnace project codes */
    var CODE_ALIASES = {
      '386_10': '386_10_XXX',     /* Synchrony Small Projects */
      '320_10': '320_10_XXX',     /* CareCredit Small Projects */
      '101_10': '101_10_XXX',     /* Forge Tool Development */
      '321_13_01': '321_13_01_A012', /* Provider Testimonials AuDacity */
      '378_06_03': '378_06_05',   /* NEGU Gala Video */
      '322_07_01': '322_07_02',   /* CES4 Social Media → Post */
      '100_02': '100_00_00',      /* Post Depo → Non-Billable */
      '100_00': '100_00_00',      /* Time OFF → Non-Billable */
      '100_07_05': '100_00_00',   /* Stryke → Non-Billable */
      '100_07_03': '100_00_00',   /* os-crnt → Non-Billable */
      '100_05': '100_00_00',      /* Dept Small Tasks → Non-Billable */
      '100_01': '100_00_00',      /* Leadership Meetings → Non-Billable */
      '100_07_09': '100_00_00',   /* YT Companion → Non-Billable */
    };

    var NB_BD_CUTOFF = '2026-01-01'; /* Non-billable & bizdev hours only counted from this date onward */

    SUPA_ACTUALS = {};
    for (var i = 0; i < SUPA_ACTUALS_ALL.length; i++) {
      var a = SUPA_ACTUALS_ALL[i];
      var code = a.project_code;
      if (!code) code = '100_00_00'; /* unknown/private → Non-Billable */
      if (CODE_ALIASES[code]) code = CODE_ALIASES[code];
      a.project_code = code; /* update in place so downstream uses resolved code */
      if (!code) continue;
      /* Skip non-billable and bizdev entries before the cutoff date */
      var isNbOrBd = (code.indexOf('100_') === 0 || code.indexOf('101_') === 0 || a.is_bizdev || a.is_timeoff);
      if (isNbOrBd && a.work_date < NB_BD_CUTOFF) continue;
      if (!SUPA_ACTUALS[code]) SUPA_ACTUALS[code] = { totalHours: 0, phases: {}, people: {}, byDate: {} };
      var sa = SUPA_ACTUALS[code];
      sa.totalHours += a.hours || 0;
      if (a.phase_key) {
        if (!sa.phases[a.phase_key]) sa.phases[a.phase_key] = 0;
        sa.phases[a.phase_key] += a.hours || 0;
      }
      if (a.person_name) {
        if (!sa.people[a.person_name]) sa.people[a.person_name] = 0;
        sa.people[a.person_name] += a.hours || 0;
      }
      if (a.work_date) {
        if (!sa.byDate[a.work_date]) sa.byDate[a.work_date] = 0;
        sa.byDate[a.work_date] += a.hours || 0;
      }
    }

    /* 7. Allocations already fetched in phase 2 parallel batch */
    var supaAllocs = _phase2[4];
    if (supaAllocs && supaAllocs.length > 0) {
      ALLOCATIONS.allocations = supaAllocs.map(function(a) {
        return { id: a.id, person: a.person, project: a.project, date: a.date, hoursPerDay: a.hours_per_day, weekOf: a.week_of };
      });
      /* Build team list from allocations */
      var teamSet = {};
      for (var i = 0; i < ALLOCATIONS.allocations.length; i++) {
        teamSet[ALLOCATIONS.allocations[i].person] = true;
      }
      ALLOCATIONS.team = Object.keys(teamSet).sort();
      /* Build forecastProjects from allocations, merged with any existing local forecastProjects */
      var projSet = {};
      var existingForecast = (ALLOCATIONS.forecastProjects || []);
      for (var i = 0; i < existingForecast.length; i++) {
        projSet[existingForecast[i]] = true;
      }
      for (var i = 0; i < ALLOCATIONS.allocations.length; i++) {
        projSet[ALLOCATIONS.allocations[i].project] = true;
      }
      ALLOCATIONS.forecastProjects = Object.keys(projSet).sort();
      console.log('Supabase allocations loaded:', ALLOCATIONS.allocations.length, 'entries,', ALLOCATIONS.team.length, 'team members,', ALLOCATIONS.forecastProjects.length, 'forecast projects');
    }

    SUPA_LOADED = true;
    setDataStatus('live');
    console.log('Supabase data loaded:', Object.keys(SUPA_BUDGETS).length, 'budgets,', SUPA_ACTUALS_ALL.length, 'actuals');

    /* Load Slack bot token + hours_last_updated from agency_settings */
    (async function() {
      try {
        var slackSetting = await sparkFetch('agency_settings', 'key=eq.slack_bot_token&select=value');
        if (slackSetting && slackSetting[0] && slackSetting[0].value) SLACK_BOT_TOKEN = slackSetting[0].value;
      } catch(e) {}
      try {
        var hoursSetting = await sparkFetch('agency_settings', 'key=eq.hours_last_updated&select=value');
        if (hoursSetting && hoursSetting[0] && hoursSetting[0].value) setHoursUpdatedDisplay(hoursSetting[0].value);
      } catch(e) {}
    })();

    /* Load purchase orders (pos table) */
    loadPOs();

    /* Save fresh data to cache for next load */
    furnaceSaveCache({
      teamMembers:    FURNACE_TEAM_MEMBERS,
      supaBudgets:    SUPA_BUDGETS,
      supaActuals:    SUPA_ACTUALS,
      supaActualsAll: SUPA_ACTUALS_ALL
    });

    /* Update "Updated" timestamp to reflect fresh Supabase data */
    var lu = document.getElementById('lastUpdated');
    if (lu) lu.textContent = 'Updated ' + new Date().toLocaleDateString('en-US', {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'});

    /* Start global real-time subscription (no-op if already subscribed) */
    furnaceSubscribeGlobalRealtime();

  } catch (err) {
    console.error('Failed to load Supabase data:', err);
  }
}

/* ── ENRICH PROJECTS WITH SUPABASE DATA ── */
function enrichProjectsWithSupabase() {
  if (!SUPA_LOADED) return;
  for (var i = 0; i < CLIENTS.length; i++) {
    for (var j = 0; j < CLIENTS[i].projects.length; j++) {
      var p = CLIENTS[i].projects[j];
      var sb = SUPA_BUDGETS[p.code];
      if (sb) {
        p._supabudget = sb;
        p.dataSource = 'supabase';
        p.dollarBudget = sb.client_price || 0;
        p.laborCost = sb.laborTotal || 0;
        p.oopCost = sbOopBudget(sb);
        /* Compute profit from live labor + OOP data, not stale total_amount */
        var computedTotal = (sb.laborTotal || 0) + sbOopBudget(sb);
        p.profit = (sb.client_price || 0) - computedTotal;
        p.profitMargin = sb.client_price > 0 ? ((p.profit / sb.client_price) * 100) : 0;
        p.totalBudget = sb.laborHours || 0;
      } else {
        p._supabudget = null;
        /* Non-billable and internal projects don't need a budget */
        var isNonBillable = p.projectType === 'internal' || p.projectType === 'bizdev' || p.code.indexOf('100_') === 0 || p.code.indexOf('101_') === 0 || p.code.indexOf('359_') === 0;
        if (isNonBillable) {
          p.dataSource = p.dataSource || 'snapshot'; /* keep existing, don't flag */
        } else {
          p.dataSource = 'needs_review';
        }
      }

      /* Check Supabase budget status — nonbillable/bizdev/complete don't need attention */
      if (p._supabudget) {
        var bStatus = p._supabudget.status;
        if (bStatus === 'nonbillable' || bStatus === 'bizdev') {
          p.dataSource = 'supabase';
          if (bStatus === 'nonbillable') p.projectType = 'internal';
          if (bStatus === 'bizdev') p.projectType = 'bizdev';
        }
        if (bStatus === 'complete') {
          p.status = 'complete';
          p.dataSource = 'supabase';
        }
      }
      var sa = SUPA_ACTUALS[p.code];
      if (sa) {
        p._supaactuals = sa;
      }
    }
  }
}

/* ── BUILD CLIENTS FROM SUPABASE ── */
async function buildClientsFromSupabase() {
  var _results = await Promise.all([
    sparkFetch('clients', 'select=id,name,client_number,color,client_status&order=client_number.asc'),
    sparkFetchAll('projects', 'select=*&order=project_code.asc')
  ]);
  var clients  = _results[0] || [];
  var projects = _results[1] || [];

  console.log('[Furnace] buildClientsFromSupabase: ' + clients.length + ' clients, ' + projects.length + ' projects');

  /* Index clients by Supabase UUID AND by client_number for fallback matching */
  var clientMapById   = {};
  var clientMapByCode = {};
  for (var i = 0; i < clients.length; i++) {
    var c = clients[i];
    var entry = {
      id: c.client_number,
      name: c.name,
      code: c.client_number,
      color: c.color || '#306D7C',
      status: c.client_status || 'active',
      projects: [],
      _supaId: c.id
    };
    clientMapById[c.id]             = entry;
    clientMapByCode[c.client_number] = entry;
  }

  /* Build project list — try client_id first, fall back to project_code prefix */
  var matched = 0, unmatched = 0;
  for (var j = 0; j < projects.length; j++) {
    var p = projects[j];
    var client = clientMapById[p.client_id];
    if (!client) {
      /* Fallback: derive client number from first segment of project code e.g. "358_16_14" → "358" */
      var prefix = (p.project_code || '').split('_')[0];
      client = clientMapByCode[prefix];
    }
    if (!client) { unmatched++; continue; }
    matched++;

    var sb = SUPA_BUDGETS[p.project_code];
    /* phases_snapshot is JSONB — Supabase returns it already parsed as an object/array */
    var phases = Array.isArray(p.phases_snapshot) ? p.phases_snapshot : [];

    var proj = {
      id: p.display_id || p.project_code,
      name: p.name,
      code: p.project_code,
      status: p.project_status || 'active',
      boardId: p.board_id,
      hourType: p.hour_type || 'billable',
      projectType: p.project_type || null,
      snapshotUrl: p.snapshot_url || null,
      hasBudgetData: p.has_budget_data || !!sb,
      phases: phases,
      dataSource: sb ? 'supabase' : (p.has_budget_data ? 'snapshot' : 'no_snapshot'),
      dollarBudget: sb ? (sb.client_price || 0) : (p.dollar_budget || 0),
      laborCost:    sb ? (sb.laborTotal   || 0) : (p.labor_cost_snapshot || 0),
      oopCost:      sb ? sbOopBudget(sb) : (p.oop_cost_snapshot || 0),
      totalBudget:  sb ? (sb.laborHours   || 0) : 0,
      _supabudget:  sb || null,
      _supaId: p.id,
      currentPhase: p.current_phase || null
    };
    if (sb) {
      proj.profit = (sb.client_price || 0) - (sb.laborTotal || 0) - sbOopBudget(sb);
      proj.profitMargin = sb.client_price > 0 ? (proj.profit / sb.client_price * 100) : 0;
    }
    client.projects.push(proj);
  }

  console.log('[Furnace] buildClientsFromSupabase result: ' + matched + ' matched, ' + unmatched + ' unmatched, ' + Object.keys(clientMapById).length + ' clients');

  CLIENTS = Object.values(clientMapById).sort(function(a, b) {
    return (a.code || '').localeCompare(b.code || '', undefined, { numeric: true });
  });
}

/* ── DATA LOADER ── */
async function loadData() {
  try {
    /* Always connected — load everything from Supabase */
    await sparkCheckStatus();
    await loadSupabaseData();

    /* Build client/project list + allocations + payment schedule in parallel */
    var _loadResults = await Promise.all([
      buildClientsFromSupabase(),
      sparkFetchAll('allocations', 'select=*&order=date.asc'),
      sparkFetch('payment_schedule', 'select=*&order=scheduled_date.asc')
    ]);
    var allocRows = _loadResults[1] || [];
    var schedRows = _loadResults[2] || [];

    enrichProjectsWithSupabase();
    buildProjectBudgetLookup();

    /* Process allocations */
    ALLOCATIONS = {
      version: 2,
      forecastProjects: [],
      allocations: allocRows.map(function(a) {
        return {
          id: a.id, person: a.person, project: a.project, date: a.date,
          hoursPerDay: a.hours_per_day, weekOf: a.week_of,
          totalHours: a.total_hours || a.hours_per_day,
          days: a.days || 1, notes: a.notes || ''
        };
      })
    };
    var fpSet = {}, teamSet = {};
    for (var i = 0; i < ALLOCATIONS.allocations.length; i++) {
      fpSet[ALLOCATIONS.allocations[i].project] = true;
      teamSet[ALLOCATIONS.allocations[i].person] = true;
    }
    ALLOCATIONS.forecastProjects = Object.keys(fpSet).sort();
    ALLOCATIONS.team = Object.keys(teamSet).sort();

    /* Process payment schedule */
    OOP_SCHEDULE = {
      version: 2,
      entries: (schedRows || []).map(function(r) {
        return {
          id: r.id, projectCode: r.project_code, projectName: r.project_name,
          lineItemName: r.line_item_name, amount: r.amount,
          date: r.scheduled_date, weekOf: r.week_of,
          paid: r.paid, notes: r.notes, supaOopId: r.supa_oop_id
        };
      })
    };

    /* Compute resource weeks */
    if (ALLOCATIONS.allocations.length > 0 || SUPA_LOADED) {
      computeResourceWeeks();
    }

    var savedView = null;
    try {
      var _h = window.location.hash;
      savedView = (_h && _h.length > 1) ? decodeURIComponent(_h.slice(1)) : localStorage.getItem('furnace_view');
    } catch(e) {}
    /* If the fast path already loaded the budget editor, just re-render the
       project shell around it (title, actuals, phases) without re-fetching
       the budget — sparkProjectBudget content is already live */
    var _fastCode = savedView && savedView.indexOf('project:') === 0 ? savedView.split(':')[1] : null;
    if (_fastCode && document.getElementById('sparkProjectBudget')) {
      var _fp = null;
      for (var _ci = 0; _ci < CLIENTS.length && !_fp; _ci++) {
        for (var _pi = 0; _pi < CLIENTS[_ci].projects.length && !_fp; _pi++) {
          if (CLIENTS[_ci].projects[_pi].code === _fastCode || CLIENTS[_ci].projects[_pi].id === _fastCode) {
            _fp = CLIENTS[_ci].projects[_pi];
          }
        }
      }
      if (_fp) {
        /* Re-render project shell (title, phases, actuals) preserving budget editor */
        currentView = savedView;
        renderSidebar();
        renderProject(_fp.id);
        /* Re-attach the already-loaded budget editor if renderProject replaced it */
        return;
      }
    }
    navigate(savedView || 'master');
  } catch(e) {
    console.error('loadData error:', e);
    document.getElementById('mainContent').innerHTML = '<div style="padding:60px 40px;text-align:center"><h2 style="color:var(--ember)">Unable to load data</h2><p style="color:var(--mid-gray);margin-top:12px">' + e.message + '</p></div>';
  }
}

      '<div style="padding:48px 40px 0">' +
      '<div style="height:28px;width:200px;background:var(--canvas);border-radius:6px;margin-bottom:8px;animation:furnaceShimmer 1.4s ease-in-out infinite"></div>' +
      '<div style="height:13px;width:140px;background:var(--canvas);border-radius:4px;margin-bottom:28px;animation:furnaceShimmer 1.4s ease-in-out infinite .1s"></div>' +
      '<div id="fastClientBanner" style="height:130px;background:var(--canvas);border-radius:10px;margin-bottom:20px;animation:furnaceShimmer 1.4s ease-in-out infinite .15s"></div>' +
      [0,1,2].map(function(i){ return '<div style="height:72px;background:var(--canvas);border-radius:10px;margin-bottom:10px;animation:furnaceShimmer 1.4s ease-in-out infinite ' + (.2+i*.07) + 's"></div>'; }).join('') +
      '</div>';
    sparkAuth.connected = true;
    (async function() {
      try {
        var _cr = await sparkFetch('clients', 'client_number=eq.' + encodeURIComponent(fastClientCode) + '&select=id,name,client_number');
        if (!_cr || !_cr.length) return;
        var _pr = await sparkFetch('projects', 'client_id=eq.' + _cr[0].id + '&select=id&order=project_code.asc');
        if (!_pr || !_pr.length) return;
        var _br = await sparkFetch('budgets', 'project_id=in.(' + _pr.map(function(p){return p.id;}).join(',') + ')&visibility=eq.visible&select=status,client_price');
        var _total = 0, _active = 0;
        for (var _i = 0; _i < (_br||[]).length; _i++) { _total += _br[_i].client_price||0; if (_br[_i].status==='active') _active++; }
        var _el = document.getElementById('fastClientBanner');
        if (_el) {
          _el.style.cssText = '';
          _el.className = 'snapshot-banner';
          _el.innerHTML = '<div class="snap-header"><div class="snap-title">' + _cr[0].client_number + ' — ' + _cr[0].name + '</div><div class="snap-version">Loading full data\u2026</div></div>' +
            '<div class="snap-financials">' +
            '<div class="snap-fin-item"><div class="sf-label">Total Budget</div><div class="sf-value sf-gold">$' + Math.round(_total).toLocaleString() + '</div></div>' +
            '<div class="snap-fin-item"><div class="sf-label">Active Projects</div><div class="sf-value">' + _active + '</div></div>' +
            '<div class="snap-fin-item"><div class="sf-label">Total Snapshots</div><div class="sf-value">' + (_br||[]).length + '</div></div>' +
            '</div>';
        }
      } catch(e) {}
    })();
  }

  if (fastProjectCode) {
    /* Render a project-shaped skeleton immediately */
    var mc = document.getElementById('mainContent');
    mc.innerHTML =
      '<div style="padding:48px 40px 0">' +
      '<div style="height:11px;width:90px;background:var(--canvas);border-radius:4px;margin-bottom:10px;animation:furnaceShimmer 1.4s ease-in-out infinite"></div>' +
      '<div style="height:28px;width:300px;background:var(--canvas);border-radius:6px;margin-bottom:8px;animation:furnaceShimmer 1.4s ease-in-out infinite .05s"></div>' +
      '<div style="height:13px;width:180px;background:var(--canvas);border-radius:4px;margin-bottom:28px;animation:furnaceShimmer 1.4s ease-in-out infinite .1s"></div>' +
      '</div>' +
      '<div style="padding:0 40px" id="sparkProjectOverview"></div>' +
      '<div style="padding:0 40px">' +
      '<div style="height:40px;width:160px;background:var(--canvas);border-radius:6px;margin-bottom:16px;animation:furnaceShimmer 1.4s ease-in-out infinite .15s"></div>' +
      '<div id="sparkProjectBudget"><div style="height:200px;background:var(--canvas);border-radius:10px;animation:furnaceShimmer 1.4s ease-in-out infinite .2s"></div></div>' +
      '</div>';

    /* Fire budget load immediately — doesn't need full CLIENTS data */
    sparkAuth.connected = true;
    sparkLoadBudgetForProject(fastProjectCode);
  } else {
    /* Generic shimmer for non-project views */
    document.getElementById('mainContent').innerHTML =
      '<div style="padding:48px 40px">' +
      '<div style="height:28px;width:220px;background:var(--canvas);border-radius:6px;margin-bottom:12px;animation:furnaceShimmer 1.4s ease-in-out infinite"></div>' +
      '<div style="height:14px;width:160px;background:var(--canvas);border-radius:4px;margin-bottom:32px;animation:furnaceShimmer 1.4s ease-in-out infinite .1s"></div>' +
      '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px">' +
      [0,1,2,3].map(function(i){ return '<div style="height:80px;background:var(--canvas);border-radius:10px;animation:furnaceShimmer 1.4s ease-in-out infinite ' + (i*0.08) + 's"></div>'; }).join('') +
      '</div>' +
      '<div style="height:120px;background:var(--canvas);border-radius:10px;margin-bottom:16px;animation:furnaceShimmer 1.4s ease-in-out infinite .3s"></div>' +
      '<div style="height:80px;background:var(--canvas);border-radius:10px;animation:furnaceShimmer 1.4s ease-in-out infinite .4s"></div>' +
      '</div>';
  }

  /* Full data load always runs — when done it re-renders the correct view,
     enriching the fast-path content with sidebar, actuals, etc. */
  loadData();
}

/* ── INIT ── */
(async function() {
  var sessionData = await _furnaceAuthClient.auth.getSession();
  var session = sessionData.data && sessionData.data.session;
  if (session && session.user) {
    var email = session.user.email || '';
    if (email.endsWith('@' + FURNACE_ALLOWED_DOMAIN)) {
      furnaceShowApp(session.user);
    } else {
      await _furnaceAuthClient.auth.signOut();
      furnaceShowLogin('This tool is restricted to @' + FURNACE_ALLOWED_DOMAIN + ' accounts.<br>You signed in as <strong>' + email + '</strong>.');
    }
  } else {
    furnaceShowLogin();
  }
})();
</script>
</body>
</html>
