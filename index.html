    h += '<td class="num">' + _p.entries + '</td>';
    h += '<td class="num">' + _p.entries + '</td>';
    h += '</tr>';
  }
  h += '</tbody></table>';

  /* ── UPCOMING RESOURCE ALLOCATION (this week + next week) ── */
  var todayStr = new Date().toISOString().slice(0,10);
  var curWeekSun = getWeekMon(todayStr);
  var curWeekSat = getSaturday(curWeekSun);
  var curWeekNum = getISOWeek(curWeekSun);
  var nwDate = new Date(curWeekSun + 'T00:00:00');
  nwDate.setDate(nwDate.getDate() + 7);
  var nextWeekSun = nwDate.toISOString().slice(0,10);
  var nextWeekSat = getSaturday(nextWeekSun);
  var nextWeekNum = getISOWeek(nextWeekSun);

  /* Show two weeks: current and next */
  var weekPairs = [
    { sun: curWeekSun, sat: curWeekSat, num: curWeekNum, label: 'This Week' },
    { sun: nextWeekSun, sat: nextWeekSat, num: nextWeekNum, label: 'Next Week' }
  ];

  for (var wpi = 0; wpi < weekPairs.length; wpi++) {
    var wp = weekPairs[wpi];
    h += '<div class="section-title" style="margin-top:' + (wpi === 0 ? '28' : '20') + 'px">' + wp.label + ' — Week ' + wp.num + ' <span style="font-size:11px;font-weight:400;color:var(--mid-gray)">(' + fmtDateShort(wp.sun) + ' – ' + fmtDateShort(wp.sat) + ')</span></div>';

    var anyAlloc = false;
    for (var i = 0; i < visibleList.length; i++) {
      var p = visibleList[i];
      if (isProjectCompleted(p)) continue;
      var weeks = buildWeeks(p.id);
      var wk = null;
      for (var wi = 0; wi < weeks.length; wi++) {
        if (weeks[wi].sunday === wp.sun) { wk = weeks[wi]; break; }
      }
      if (!wk) continue;
      anyAlloc = true;

      var ppl = [];
      for (var pk in wk.people) ppl.push([pk, wk.people[pk]]);
      ppl.sort(function(a,b){ return b[1] - a[1]; });

      h += '<div style="margin-bottom:16px;padding:14px 16px;background:var(--cloud);border-radius:10px;border-left:3px solid ' + c.color + '">';
      h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">';
      h += '<div><span style="font-weight:700;font-size:13px;color:var(--abyss)">' + p.name + '</span> <span style="font-size:11px;color:var(--mid-gray)">' + p.code + '</span></div>';
      h += '<div style="font-weight:700;font-size:14px;color:var(--ocean)">' + wk.total.toFixed(1) + ' hrs</div>';
      h += '</div>';

      h += '<div style="display:flex;flex-wrap:wrap;gap:6px">';
      for (var si = 0; si < ppl.length; si++) {
        if (ppl[si][0] === 'Unknown') continue;
        var fn = ppl[si][0].split(' ')[0];
        h += '<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 10px;background:rgba(255,255,255,.7);border-radius:12px;font-size:11px;color:var(--abyss)"><span style="width:6px;height:6px;border-radius:50%;background:' + (PC[ppl[si][0]] || '#9B9590') + '"></span>' + fn + ' ' + ppl[si][1].toFixed(1) + 'h</span>';
      }
      h += '</div></div>';
    }

    if (!anyAlloc) {
      h += '<div style="font-size:13px;color:var(--mid-gray);padding:16px;background:var(--cloud);border-radius:8px">No allocations for ' + wp.label.toLowerCase() + ' <span style="font-weight:600">(' + fmtDateShort(wp.sun) + ' – ' + fmtDateShort(wp.sat) + ')</span></div>';
    }
  }

  /* Hour Type Breakdown for this client */
  var clientHt = computeHourTypes(visibleList);
  if (clientHt.bizdev.count > 0 || clientHt.ops.count > 0) {
    h += renderHourTypeSection(clientHt, c.id);
  }

  document.getElementById('mainContent').innerHTML = h;
}

/* ══════════════════════════════════════════════
   PROJECT FINANCIALS BANNER
   ══════════════════════════════════════════════ */
function renderProjFinancials(p) {
  var el = document.getElementById('projFin-' + p.code);
  if (!el || !p._supabudget) return;
  var sb = p._supabudget;

  var allTimeHrs = SUPA_ACTUALS[p.code] ? SUPA_ACTUALS[p.code].totalHours : 0;
  var saHrs = filteredProjectSpent(p); /* respects global date filter */
  var isFiltered = (globalDateFilter !== 'all');
  var allocHrs = 0;
  var nativeAllocs = getAllocationsForProject(p.id);
  for (var ai = 0; ai < nativeAllocs.length; ai++) allocHrs += nativeAllocs[ai].hoursPerDay || 0;
  var hrsRemaining = (sb.laborHours || 0) - allTimeHrs; /* always all-time so remaining is accurate */

  var rawPrice = sb.client_price || 0;
  var hasDisc = sb.has_discount || false;
  var discAmt = hasDisc ? rawPrice * 0.035 : 0;
  var tcvPrice = rawPrice - discAmt;

  var noOop = sb.no_oop === true;
  var noFl  = sb.no_freelancers === true;

  var flBudget   = noFl  ? 0 : (sb.flTotal || 0);
  var flSpent    = noFl  ? 0 : (sb.flSpent || 0);
  var flRemaining = flBudget - flSpent;

  var oopBudget   = noOop ? 0 : sbOopBudget(sb);          /* effective (cascade) amounts × markup — used for OOP detail row + progress bar */
  var oopSpent    = noOop ? 0 : (sb.oopSpent || 0);
  var oopPredicted = noOop ? 0 : oopGetPredictedForProject(p.code);
  var oopRemaining = oopBudget - oopSpent;
  /* Projected OOP Price: use sbOopBudget (effective amounts × markup) — same as oopBudget */
  var _oopMkPct   = sb.oopMarkupPct != null ? sb.oopMarkupPct : 20;
  var oopProjected = oopBudget;

  /* Determine finished state early so profit/margin tiles match the bar */
  var isFinished = sb.status === 'complete' || p.status === 'complete' || p.status === 'finished';
  var agencyRate = 200;
  /* Use per-entry billable_rate overrides when available; falls back to $200/hr */
  var laborSpent$ = filteredProjectSpentDollars(p, agencyRate);

  var internalLaborCost = sb.laborCostInternal || sb.laborTotal || 0;
  /* Projected Labor Price = labor budget entries minus FL portion (FL tracked separately in flBudget) */
  var projLaborPrice = Math.max(0, (sb.laborTotal || 0) - (noFl ? 0 : (sb.flTotal || 0)));

  /* Profit tile: finished → actual spending; open → projected budget amounts.
     projLaborPrice already excludes FL so flBudget is not double-counted. */
  var profitVal = isFinished
    ? tcvPrice - laborSpent$ - oopSpent - flSpent
    : tcvPrice - projLaborPrice - oopProjected - flBudget;
  var profitPctVal = tcvPrice > 0 ? ((profitVal / tcvPrice) * 100).toFixed(1) : 0;
  /* Margin uses projected budget prices (not internal rates) */
  var marginOop = isFinished ? oopSpent : oopProjected;
  var marginFl  = isFinished ? flSpent  : flBudget;
  var marginPctVal = tcvPrice > 0 ? ((tcvPrice - projLaborPrice - marginOop - marginFl) / tcvPrice * 100).toFixed(1) : 0;
  var _mPct = parseFloat(marginPctVal);
  var marginColor = _mPct > 25 ? '#81C784' : _mPct > 15 ? '#81C784' : _mPct > 10 ? '#F57F17' : '#EF5350';
  var marginSparkle = _mPct > 25;

  var effRate = saHrs > 0 ? (internalLaborCost / saHrs) : 0;
  var effRateDisplay = saHrs > 0 ? '$' + Math.round(effRate).toLocaleString() + '/hr' : '\u2014';
  var effRateColor = effRate > 0 && effRate <= 150 ? '#81C784' : effRate <= 175 ? 'var(--honey)' : effRate > 0 ? 'var(--ember)' : 'var(--white)';

  var laborRemaining$ = Math.max(0, hrsRemaining) * agencyRate;

  /* ── Projected: future RM allocations (labor) + scheduled FL/OOP entries ── */
  var _projToday = new Date().toISOString().slice(0,10);
  var laborProjHrs = 0;
  var _fpAllocs = getAllocationsForProject(p.id);
  for (var _fpai = 0; _fpai < _fpAllocs.length; _fpai++) {
    var _fpa = _fpAllocs[_fpai];
    if (_fpa.date && _fpa.date > _projToday) laborProjHrs += (_fpa.hoursPerDay || 0);
  }
  var laborProj$ = laborProjHrs * agencyRate;
  var flProj = 0;
  if (!noFl) {
    var _fpFlEnts = sb._flEntries || [];
    for (var _fpfi = 0; _fpfi < _fpFlEnts.length; _fpfi++) {
      var _fpfe = _fpFlEnts[_fpfi];
      if (_fpfe.week_label === '__budget__') continue;
      if (/^\d{4}-\d{2}-\d{2}$/.test(_fpfe.week_label||'') && _fpfe.week_label > _projToday && !_fpfe.paid) {
        flProj += (_fpfe.hours || 0) * (_fpfe.rate || 0);
      }
    }
  }
  var oopProj = 0;
  if (!noOop && sb._oopEntries) {
    var _fpSchedIds = {};
    var _fpOopSched = (OOP_SCHEDULE && OOP_SCHEDULE.entries) ? OOP_SCHEDULE.entries : [];
    for (var _fpos = 0; _fpos < _fpOopSched.length; _fpos++) {
      if (_fpOopSched[_fpos].oopEntryId) _fpSchedIds[_fpOopSched[_fpos].oopEntryId] = true;
    }
    for (var _fpoo = 0; _fpoo < sb._oopEntries.length; _fpoo++) {
      var _fpOopi = sb._oopEntries[_fpoo];
      if (_fpOopi.is_active === false || _fpOopi.paid) continue;
      if (_fpSchedIds[_fpOopi.id]) {
        var _fpC = _fpOopi.adjusted_count      != null ? _fpOopi.adjusted_count      : (_fpOopi.count      || 0);
        var _fpR = _fpOopi.adjusted_rate       != null ? _fpOopi.adjusted_rate       : (_fpOopi.rate       || 0);
        var _fpD = _fpOopi.adjusted_days       != null ? _fpOopi.adjusted_days       : (_fpOopi.days       || 1);
        var _fpH = _fpOopi.adjusted_head_count != null ? _fpOopi.adjusted_head_count : (_fpOopi.head_count || 1);
        oopProj += _fpOopi.actual_amount != null ? _fpOopi.actual_amount : (_fpC * _fpR * _fpD * _fpH);
      }
    }
  }

  var barTotal = tcvPrice > 0 ? tcvPrice : 1;
  /* When finished, unspent labor folds into profit — don't subtract it from the bar */
  var profitBar$ = isFinished
    ? Math.max(0, tcvPrice - laborSpent$ - oopSpent - flSpent)
    : Math.max(0, tcvPrice - laborSpent$ - laborRemaining$ - oopSpent - Math.max(0, oopRemaining) - flBudget);

  /* Toggle button style helper */
  function toggleBtn(field, isOn, label) {
    var onStyle = 'background:rgba(255,255,255,.12);color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:2px 8px;font-size:10px;cursor:pointer;font-weight:600';
    var offStyle = 'background:rgba(255,255,255,.04);color:rgba(255,255,255,.35);border:1px dashed rgba(255,255,255,.2);border-radius:4px;padding:2px 8px;font-size:10px;cursor:pointer;font-weight:500';
    return '<button style="' + (isOn ? onStyle : offStyle) + '" onclick="sparkToggleBudgetSection(\'' + sb.id + '\',\'' + p.code + '\',\'' + field + '\')" title="' + (isOn ? 'Click to re-enable' : 'Click to mark as not needed') + '">' + (isOn ? '✕ ' : '') + label + '</button>';
  }

  var h = '';
  h += '<div class="snapshot-banner" style="margin-bottom:16px">';
  h += '<div class="snap-header"><div class="snap-title">Project Financials</div><div class="snap-version">Live from Furnace &#128293;</div></div>';

  /* ── Top summary row ── */
  h += '<div class="snap-financials">';
  h += '<div class="snap-fin-item"><div class="sf-label">Client Price</div><div class="sf-value sf-gold">$' + Math.round(tcvPrice).toLocaleString() + '</div>';
  if (hasDisc) h += '<div class="sf-sub">Before discount: $' + Math.round(rawPrice).toLocaleString() + '</div>';
  h += '</div>';
  h += '<div class="snap-fin-item"><div class="sf-label">Projected Labor Price</div><div class="sf-value">$' + Math.round(projLaborPrice).toLocaleString() + '</div><div class="sf-sub">' + (sb.laborHours || 0).toFixed(0) + ' hrs @ $200/hr</div></div>';
  h += '<div class="snap-fin-item"><div class="sf-label">Projected Freelancer Price</div><div class="sf-value" style="color:#CE93D8">' + (noFl ? '<span style="opacity:.4">—</span>' : '$' + Math.round(flBudget).toLocaleString()) + '</div>' + (!noFl && flBudget > 0 ? '<div class="sf-sub">' + (sb._flEntries || []).length + ' entries</div>' : '') + '</div>';
  h += '<div class="snap-fin-item"><div class="sf-label">Projected OOP Price</div><div class="sf-value">' + (noOop ? '<span style="opacity:.4">—</span>' : '$' + Math.round(oopProjected).toLocaleString()) + '</div><div class="sf-sub">' + (!noOop && oopProjected > 0 ? _oopMkPct + '% markup' : '') + '</div></div>';
  h += '<div class="snap-fin-item"><div class="sf-label">Projected Profit</div><div class="sf-value ' + (profitVal >= 0 ? 'sf-green' : '') + '">$' + Math.round(profitVal).toLocaleString() + '</div><div class="sf-sub">' + profitPctVal + '%</div></div>';
  h += '<div class="snap-fin-item"><div class="sf-label">Projected Profit Margin</div><div class="sf-value' + (marginSparkle ? ' margin-sparkle' : '') + '" style="' + (marginSparkle ? '' : 'color:' + marginColor) + '">' + marginPctVal + '%</div><div class="sf-sub">Proj. labor: $' + Math.round(projLaborPrice).toLocaleString() + '</div></div>';
  h += '<div class="snap-fin-item"><div class="sf-label">Eff. Rate</div><div class="sf-value" style="color:' + effRateColor + '">' + effRateDisplay + '</div>' + (saHrs > 0 ? '<div class="sf-sub">vs $200 bill rate</div>' : '<div class="sf-sub">No hours tracked</div>') + '</div>';
  h += '</div>';

  /* ── Actuals row ── */
  var _pfActOpen = !!projFinActualsOpen[p.code];
  /* Build name → fully_burdened_rate lookup */
  var _pfTmRateMap = {};
  if (FURNACE_TEAM_MEMBERS) {
    for (var _pfti = 0; _pfti < FURNACE_TEAM_MEMBERS.length; _pfti++) {
      var _pftm = FURNACE_TEAM_MEMBERS[_pfti];
      if (_pftm.name && _pftm.fully_burdened_rate) _pfTmRateMap[_pftm.name] = _pftm.fully_burdened_rate;
    }
  }
  var _pfActLaborHrs = 0, _pfActLaborCost = 0;
  if (SUPA_ACTUALS_ALL) {
    for (var _pfai = 0; _pfai < SUPA_ACTUALS_ALL.length; _pfai++) {
      var _pfae = SUPA_ACTUALS_ALL[_pfai];
      if (_pfae.project_code !== p.code) continue;
      var _pfaeRate = (_pfae.person_name && _pfTmRateMap[_pfae.person_name]) ? _pfTmRateMap[_pfae.person_name] : (_pfae.billable_rate || 200);
      _pfActLaborHrs += (_pfae.hours || 0);
      _pfActLaborCost += (_pfae.hours || 0) * _pfaeRate;
    }
  }
  /* Actuals FL: sum calendar entries directly (non-sentinel), fall back to sentinel if no calendar entries exist */
  var _pfActFlCost = 0, _pfActFlPaid = 0;
  if (!noFl) {
    var _pfFlEnts = sb._flEntries || [];
    var _pfHasCal = false;
    for (var _pfci = 0; _pfci < _pfFlEnts.length; _pfci++) { if (_pfFlEnts[_pfci].week_label !== '__budget__') { _pfHasCal = true; break; } }
    for (var _pffi = 0; _pffi < _pfFlEnts.length; _pffi++) {
      var _pffe = _pfFlEnts[_pffi];
      var _pffc = (_pffe.hours || 0) * (_pffe.rate || 0);
      if (_pffe.week_label === '__budget__') {
        if (!_pfHasCal) { _pfActFlCost += _pffc; if (_pffe.paid) _pfActFlPaid += _pffc; }
      } else {
        _pfActFlCost += _pffc;
        if (_pffe.paid) _pfActFlPaid += _pffc;
      }
    }
  }
  var _pfActOopScheduled = noOop ? 0 : sbOopBudget(sb); /* all active OOP × markup */
  var _pfActOopPaid = sb.oopSpent || 0;                 /* paid only */
  var _pfActOopSpent = _pfActOopPaid;
  /* Add scheduled-but-unpaid OOP items so committed costs show in actuals */
  if (!noOop && OOP_SCHEDULE && OOP_SCHEDULE.entries) {
    var _oopPaidIds = {};
    for (var _opi = 0; _opi < (sb._oopEntries || []).length; _opi++) {
      if (sb._oopEntries[_opi].paid) _oopPaidIds[sb._oopEntries[_opi].id] = true;
    }
    for (var _osi = 0; _osi < OOP_SCHEDULE.entries.length; _osi++) {
      var _ose = OOP_SCHEDULE.entries[_osi];
      if (_ose.projectCode === p.code && _ose.supaOopId && !_oopPaidIds[_ose.supaOopId]) {
        _pfActOopSpent += (_ose.amount || 0);
      }
    }
  }
  var _pfActFlInternal = _pfActFlPaid * 0.5;            /* FL Internal Cost = 50% of paid */
  var _pfActProfit = tcvPrice - _pfActLaborCost - _pfActFlInternal - _pfActOopSpent;
  var _pfActMargin = tcvPrice > 0 ? (_pfActProfit / tcvPrice * 100) : 0;
  if (canViewActuals()) {
    h += '<div style="display:flex;justify-content:flex-end;margin-top:6px">';
    h += '<button onclick="projFinToggleActuals(\'' + p.code + '\')" style="font-size:11px;padding:3px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.45);cursor:pointer;font-family:inherit;letter-spacing:.02em">';
    h += (_pfActOpen ? '\u25b2 Hide Actuals' : '\u25bc Show Actuals') + '</button></div>';
  }
  if (_pfActOpen) {
    h += '<div class="snap-financials" style="margin-top:6px;padding-top:12px;border-top:1px solid rgba(129,199,132,.25)">';
    var _pfActSparkle = _pfActMargin > 45;
    h += '<div class="snap-fin-item"><div class="sf-label" style="color:rgba(129,199,132,.7)">Actual Labor</div><div class="sf-value">$' + Math.round(_pfActLaborCost).toLocaleString() + '</div><div class="sf-sub">' + _pfActLaborHrs.toFixed(1) + ' hrs at cost rate</div></div>';
    h += '<div class="snap-fin-item"><div class="sf-label" style="color:rgba(129,199,132,.7)">Actual FL</div><div class="sf-value" style="color:#CE93D8">$' + Math.round(_pfActFlInternal).toLocaleString() + '</div><div class="sf-sub">paid: $' + Math.round(_pfActFlPaid).toLocaleString() + '</div></div>';
    var _pfOopSub = _pfActOopSpent > _pfActOopPaid ? 'paid: $' + Math.round(_pfActOopPaid).toLocaleString() + ' · w/ markup: $' + Math.round(_pfActOopScheduled).toLocaleString() : 'w/ markup: $' + Math.round(_pfActOopScheduled).toLocaleString();
    h += '<div class="snap-fin-item"><div class="sf-label" style="color:rgba(129,199,132,.7)">Actual OOP</div><div class="sf-value">$' + Math.round(_pfActOopSpent).toLocaleString() + '</div><div class="sf-sub">' + _pfOopSub + '</div></div>';
    h += '<div class="snap-fin-item"><div class="sf-label" style="color:rgba(129,199,132,.7)">Proj. Actual Profit</div><div class="sf-value" style="color:' + (_pfActProfit >= 0 ? '#81C784' : 'var(--ember)') + '">$' + Math.round(_pfActProfit).toLocaleString() + '</div></div>';
    h += '<div class="snap-fin-item"><div class="sf-label" style="color:rgba(129,199,132,.7)">Proj. Actual Margin</div><div class="sf-value' + (_pfActSparkle ? ' margin-sparkle' : '') + '" style="' + (_pfActSparkle ? '' : 'color:' + (_pfActMargin >= 0 ? '#81C784' : 'var(--ember)')) + '">' + _pfActMargin.toFixed(1) + '%</div></div>';
    h += '</div>';
    /* ── Actuals bar ── */
    var _pfActBarTot = tcvPrice > 0 ? tcvPrice : 1;
    var _pfpActL = Math.max(0, Math.min(100,               _pfActLaborCost  / _pfActBarTot * 100));
    var _pfpActFl = Math.max(0, Math.min(100 - _pfpActL,  _pfActFlInternal / _pfActBarTot * 100));
    var _pfpActOop = Math.max(0, Math.min(100 - _pfpActL - _pfpActFl, _pfActOopSpent / _pfActBarTot * 100));
    var _pfpActProfit = Math.max(0, 100 - _pfpActL - _pfpActFl - _pfpActOop);
    h += '<div style="margin-top:12px">';
    h += '<div style="font-size:9px;text-transform:uppercase;letter-spacing:.8px;opacity:.4;margin-bottom:5px;font-weight:600">Actuals vs. Client Price</div>';
    h += '<div class="lob-bar">';
    if (_pfpActL      > 0.1) h += '<div class="lob-seg" style="width:' + _pfpActL.toFixed(1)      + '%;background:#1565C0">'      + (_pfpActL      >= 8 ? '$' + Math.round(_pfActLaborCost).toLocaleString()  : '') + '</div>';
    if (_pfpActFl     > 0.1) h += '<div class="lob-seg" style="width:' + _pfpActFl.toFixed(1)     + '%;background:#7B1FA2">'      + (_pfpActFl     >= 8 ? '$' + Math.round(_pfActFlInternal).toLocaleString() : '') + '</div>';
    if (_pfpActOop    > 0.1) h += '<div class="lob-seg" style="width:' + _pfpActOop.toFixed(1)    + '%;background:var(--ember)">' + (_pfpActOop    >= 8 ? '$' + Math.round(_pfActOopSpent).toLocaleString()   : '') + '</div>';
    if (_pfpActProfit > 0.5) h += '<div class="lob-seg" style="width:' + _pfpActProfit.toFixed(1) + '%;background:#81C784">'      + (_pfpActProfit >= 8 ? '$' + Math.round(_pfActProfit).toLocaleString()     : '') + '</div>';
    h += '</div>';
    h += '<div class="lob-legend">';
    if (_pfpActL      > 0.1) h += '<div class="lob-legend-item"><div class="lob-legend-dot" style="background:#1565C0"></div>Actual Labor</div>';
    if (_pfpActFl     > 0.1) h += '<div class="lob-legend-item"><div class="lob-legend-dot" style="background:#7B1FA2"></div>Actual FL</div>';
    if (_pfpActOop    > 0.1) h += '<div class="lob-legend-item"><div class="lob-legend-dot" style="background:var(--ember)"></div>Actual OOP</div>';
    if (_pfpActProfit > 0.5) h += '<div class="lob-legend-item"><div class="lob-legend-dot" style="background:#81C784"></div>Actual Profit</div>';
    h += '</div></div>';
  }

  /* ── Progress bar: proportional segments — all scaled to barTotal so profit always shows ── */
  var _bHasLaborSpend  = laborSpent$ > 0;
  var _bHasProjLabor   = !isFinished && laborProj$ > 0;
  var _bHasFlSpend     = !noFl && flSpent > 0;
  var _bHasProjFl      = !noFl && flProj > 0;
  var _bHasOopSpend    = !noOop && oopSpent > 0;
  var _bHasProjOop     = !noOop && oopProj > 0;
  /* Dollar value of each segment */
  var _b_lbdg = (!_bHasLaborSpend && !_bHasProjLabor && !isFinished) ? projLaborPrice : 0;
  var _b_lsp  = _bHasLaborSpend ? laborSpent$ : 0;
  var _b_lprj = _bHasProjLabor  ? laborProj$ : 0;
  var _b_lrem = (_bHasLaborSpend || _bHasProjLabor) && !isFinished ? Math.max(0, projLaborPrice - laborSpent$ - laborProj$) : 0;
  var _b_fbdg = (!noFl && !_bHasFlSpend && !_bHasProjFl && flBudget > 0) ? flBudget : 0;
  var _b_fsp  = _bHasFlSpend ? flSpent : 0;
  var _b_fprj = _bHasProjFl  ? flProj : 0;
  var _b_frem = (_bHasFlSpend || _bHasProjFl) ? Math.max(0, flBudget - flSpent - flProj) : 0;
  var _b_obdg = (!noOop && !_bHasOopSpend && !_bHasProjOop && oopBudget > 0) ? oopBudget : 0;
  var _b_osp  = _bHasOopSpend ? oopSpent : 0;
  var _b_oprj = _bHasProjOop  ? oopProj : 0;
  var _b_orem = (_bHasOopSpend || _bHasProjOop) ? Math.max(0, oopRemaining - oopProj) : 0;
  var _b_prof = profitBar$;
  /* Scale: compress proportionally if spending exceeds client price */
  var _b_tot = _b_lbdg + _b_lsp + _b_lprj + _b_lrem + _b_fbdg + _b_fsp + _b_fprj + _b_frem + _b_obdg + _b_osp + _b_oprj + _b_orem + _b_prof;
  var _b_sc  = (_b_tot > barTotal && _b_tot > 0) ? (barTotal / _b_tot) : 1;
  var pLaborBudg = _b_lbdg / barTotal * 100 * _b_sc;
  var pLaborSpent= _b_lsp  / barTotal * 100 * _b_sc;
  var pLaborProj = _b_lprj / barTotal * 100 * _b_sc;
  var pLaborRem  = _b_lrem / barTotal * 100 * _b_sc;

  if (pLaborRem   > 0.5) h += '<div class="lob-seg" style="width:' + pLaborRem.toFixed(1)   + '%;background:#80CBC4;color:var(--abyss)">' + (pLaborRem   >= 8 ? '$' + Math.round(Math.max(0, projLaborPrice - laborSpent$ - laborProj$)).toLocaleString() : '') + '</div>';

  if (pFlProj     > 0.5) h += '<div class="lob-seg" style="width:' + pFlProj.toFixed(1)     + '%;background:#AB47BC">'                    + (pFlProj     >= 8 ? '$' + Math.round(flProj).toLocaleString()          : '') + '</div>';
  if (pFlRem      > 0.5) h += '<div class="lob-seg" style="width:' + pFlRem.toFixed(1)      + '%;background:#CE93D8;color:var(--abyss)">' + (pFlRem      >= 8 ? '$' + Math.round(Math.max(0, flBudget - flSpent - flProj)).toLocaleString() : '') + '</div>';
  if (pOopBudg    > 0.5) h += '<div class="lob-seg" style="width:' + pOopBudg.toFixed(1)    + '%;background:#FFCC80;color:var(--abyss)">' + (pOopBudg    >= 8 ? '$' + Math.round(oopBudget).toLocaleString()      : '') + '</div>';
  if (pOopSpent   > 0.1) h += '<div class="lob-seg" style="width:' + pOopSpent.toFixed(1)   + '%;background:var(--ember)">'               + (pOopSpent   >= 8 ? '$' + Math.round(oopSpent).toLocaleString()        : '') + '</div>';
  if (pOopProj    > 0.5) h += '<div class="lob-seg" style="width:' + pOopProj.toFixed(1)    + '%;background:#FFA726;color:var(--abyss)">' + (pOopProj    >= 8 ? '$' + Math.round(oopProj).toLocaleString()         : '') + '</div>';
  if (pOopRem     > 0.5) h += '<div class="lob-seg" style="width:' + pOopRem.toFixed(1)     + '%;background:#FFCC80;color:var(--abyss)">' + (pOopRem     >= 8 ? '$' + Math.round(Math.max(0, oopRemaining - oopProj)).toLocaleString() : '') + '</div>';
  if (pProfit     > 0.5) h += '<div class="lob-seg" style="width:' + pProfit.toFixed(1)     + '%;background:#81C784">'                    + (pProfit     >= 8 ? '$' + Math.round(profitBar$).toLocaleString()      : '') + '</div>';
  h += '</div>';
  h += '<div class="lob-legend">';
  if (pLaborBudg  > 0.1)              h += '<div class="lob-legend-item"><div class="lob-legend-dot" style="background:#80CBC4"></div>Labor Budgeted</div>';

  if (pFlSpent    > 0.1)              h += '<div class="lob-legend-item"><div class="lob-legend-dot" style="background:#7B1FA2"></div>FL Spent</div>';
  if (pFlProj     > 0.5)              h += '<div class="lob-legend-item"><div class="lob-legend-dot" style="background:#AB47BC"></div>FL Projected</div>';
  if (pFlRem      > 0.5)              h += '<div class="lob-legend-item"><div class="lob-legend-dot" style="background:#CE93D8"></div>FL Remaining</div>';

  if (pOopProj    > 0.5)              h += '<div class="lob-legend-item"><div class="lob-legend-dot" style="background:#FFA726"></div>OOP Projected</div>';

  h += '</div></div>';

  /* ── Labor hours row ── */
  h += '<div class="snap-financials" style="margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1)">';

  } else if (flBudget > 0) {
    var flUnpaid = flBudget - flSpent;
    /* FL Internal Cost = 50% of actual paid (accounting convention) */
    var flCostInternal = flSpent * 0.5;
    h += '<div class="snap-financials">';
    h += '<div class="snap-fin-item"><div class="sf-label">FL Billable Price</div><div class="sf-value" style="color:#CE93D8">$' + Math.round(flBudget).toLocaleString() + '</div><div class="sf-sub">' + (sb._flEntries || []).length + ' entries</div></div>';
    h += '<div class="snap-fin-item"><div class="sf-label">FL Internal Cost</div><div class="sf-value" style="color:#F57F17">$' + Math.round(flCostInternal).toLocaleString() + '</div><div class="sf-sub">at cost rate</div></div>';
    h += '<div class="snap-fin-item"><div class="sf-label">FL Paid</div><div class="sf-value" style="color:#81C784">$' + Math.round(flSpent).toLocaleString() + '</div><div class="sf-sub">' + pct(flSpent, flBudget) + '% billed</div></div>';
    h += '<div class="snap-fin-item"><div class="sf-label">FL Remaining</div><div class="sf-value" style="color:' + (flRemaining < 0 ? 'var(--ember)' : 'var(--white)') + '">$' + Math.round(flRemaining).toLocaleString() + '</div></div>';
    h += '</div>';
  } else {
    h += '<div style="font-size:12px;color:var(--mid-gray);padding:8px 0;font-style:italic">No freelancer entries yet — add them in the Budget Snapshot below.</div>';
  }

  /* ── OOP row — always shown, collapsible via toggle ── */
  h += '<div style="margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">';

  h += '</div>';
  if (noOop) {
    h += '<div style="font-size:12px;color:var(--mid-gray);padding:8px 0;font-style:italic">Marked as no out-of-pocket costs for this project.</div>';
  } else {
    h += '<div class="snap-financials">';

    h += '<div class="snap-fin-item"><div class="sf-label">OOP Spent</div><div class="sf-value" style="color:#F57F17">$' + Math.round(oopSpent).toLocaleString() + '</div><div class="sf-sub">' + pct(oopSpent, oopBudget) + '% of budget</div></div>';

    h += '<div class="snap-fin-item"><div class="sf-label">OOP Remaining</div><div class="sf-value" style="color:' + (oopRemaining < 0 ? 'var(--ember)' : 'var(--white)') + '">$' + Math.round(oopRemaining).toLocaleString() + '</div></div>';
    h += '</div>';
  }

  h += '</div>'; /* end snapshot-banner */

  /* ── Billed to Date ── */
  var _projCode = p.code;
  var _projPOs = SUPA_POS.filter(function(po) {
    return po.project_code === _projCode;
  }).sort(function(a,b){ return (a.date_sent||'').localeCompare(b.date_sent||''); });
  if (_projPOs.length > 0 || tcvPrice > 0) {
    var _totalBilled = _projPOs.reduce(function(s,po){ return s + (parseFloat(po.amount)||0); }, 0);
    var _billRem = tcvPrice - _totalBilled;
    var _billedPct = tcvPrice > 0 ? Math.round(_totalBilled / tcvPrice * 100) : 0;
    h += '<div class="snapshot-banner" style="margin-top:12px">';
    h += '<div class="snap-header"><div class="snap-title">Billed to Date</div>';
    h += '<div class="snap-version">' + (_projPOs.length > 0 ? _projPOs.length + ' PO' + (_projPOs.length !== 1 ? 's' : '') : 'No POs yet') + '</div></div>';
    h += '<div class="snap-financials">';
    h += '<div class="snap-fin-item"><div class="sf-label">Total Billed</div><div class="sf-value sf-gold">$' + Math.round(_totalBilled).toLocaleString() + '</div><div class="sf-sub">' + _billedPct + '% of TCV</div></div>';
    h += '<div class="snap-fin-item"><div class="sf-label">TCV</div><div class="sf-value">$' + Math.round(tcvPrice).toLocaleString() + '</div></div>';

    if (_projPOs.length > 0) {
      h += '<div style="margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1)">';
      for (var _poi = 0; _poi < _projPOs.length; _poi++) {
        var _po = _projPOs[_poi];
